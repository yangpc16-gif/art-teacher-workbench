<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美术教师智能工作台 · 书卷</title>
<style>
:root{
  --bg:#f7f2e7;--card:#fffaf0;--ink:#2b2b2b;--muted:#606060;--primary:#3c5464;--primary2:#587184;
  --ochre:#b58a66;--blue:#56758c;--cinnabar:#a83232;--coral:#b86c5f;--yellow:#c6a15b;--line:rgba(62,56,46,.18);
  --soft:rgba(60,84,100,.085);--shadow:0 5px 18px rgba(64,48,30,.075);--paperNoise:.028;
}
[data-theme="dark"]{
  --bg:#2e2922;--card:#3a342b;--ink:#eadfc7;--muted:#aaa08d;--primary:#718695;--primary2:#8498a6;
  --ochre:#a98567;--blue:#6f8a9b;--cinnabar:#bd5a52;--coral:#ae7568;--yellow:#b89a62;--line:rgba(234,223,199,.14);
  --soft:rgba(113,134,149,.13);--shadow:0 5px 18px rgba(0,0,0,.15);--paperNoise:.018;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Songti SC","STSong","SimSun","FangSong","KaiTi",serif}
body{overflow-x:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-3;background:
  linear-gradient(90deg,transparent 0 34px,rgba(168,50,50,.035) 34px 35px,transparent 35px),
  radial-gradient(circle at 78% 18%,rgba(60,84,100,.045),transparent 24%),
  repeating-linear-gradient(0deg,rgba(60,50,35,var(--paperNoise)) 0 1px,transparent 1px 4px)}
.mountain{position:fixed;right:1.5vw;bottom:2vh;width:37vw;height:18vh;opacity:.075;pointer-events:none;z-index:-2;color:var(--primary)}.mountain svg{width:100%;height:100%}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;background:linear-gradient(180deg,rgba(60,84,100,.14),rgba(60,84,100,.055) 50%,rgba(201,166,139,.08));border-right:1px solid var(--line);backdrop-filter:none}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 22px}.brand-mark{width:44px;height:44px;border-radius:5px;display:grid;place-items:center;background:var(--primary);color:#fff9ef;box-shadow:inset 0 0 0 5px rgba(255,249,239,.14);font-weight:800;letter-spacing:.15em}.brand b{font-size:18px}.brand small{display:block;margin-top:4px;color:var(--muted)}
.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:11px;width:100%;padding:12px 14px;border-radius:6px;text-align:left;position:relative}.nav button:hover{background:var(--soft)}.nav button.active{background:linear-gradient(90deg,rgba(60,84,100,.18),rgba(60,84,100,.055));font-weight:700}.nav button.active:before{content:"";width:5px;height:21px;border-radius:4px;background:var(--cinnabar);position:absolute;left:3px}.nav .icon{width:26px;text-align:center;font-size:18px}
.side-foot{position:absolute;left:16px;right:16px;bottom:18px;color:var(--muted);font-size:12px;line-height:1.7;padding:12px;border-top:1px solid var(--line)}
.main{min-width:0;padding:0 28px 50px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:20}.top-actions{display:flex;align-items:center;gap:10px}.teacher-mini{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--soft),rgba(201,166,139,.22));border:2px solid rgba(60,84,100,.38);box-shadow:0 0 0 4px rgba(60,84,100,.08)}
.iconbtn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:9px 13px;box-shadow:0 3px 12px rgba(40,30,20,.04)}.iconbtn{padding:9px 11px}.btn:hover,.iconbtn:hover{filter:brightness(.98)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff9ef}.btn.red{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff9ef}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.hamb{display:none}.content{max-width:1540px;margin:0 auto;padding-top:24px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.page-head h1{margin:0;font-size:28px;letter-spacing:.08em}.page-head p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 38%),repeating-linear-gradient(0deg,rgba(86,68,44,.018) 0 1px,transparent 1px 5px),var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-20px;top:-22px;width:90px;height:60px;border-radius:50%;background:radial-gradient(ellipse,rgba(60,84,100,.08),transparent 68%);pointer-events:none}.card h3{margin:0 0 14px;font-size:18px}.subtle{color:var(--muted);font-size:13px}.seal{display:inline-grid;place-items:center;width:28px;height:28px;border:1px solid var(--cinnabar);color:var(--cinnabar);font-size:11px;line-height:1;border-radius:4px;transform:rotate(-2deg)}
.hero{display:flex;justify-content:space-between;gap:30px;align-items:end;padding:22px 4px 26px}.hero-date{font-size:36px;font-weight:700;letter-spacing:.08em}.hero-time{font-size:34px;color:var(--primary);font-variant-numeric:tabular-nums}.hero-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.metric{padding:16px}.metric b{display:block;font-size:26px;margin-top:5px}.progress{height:9px;border-radius:999px;background:rgba(120,110,90,.12);overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));border-radius:inherit}
.todo-list,.list{display:grid;gap:9px}.todo{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:6px}.todo.overdue{background:rgba(184,66,60,.10);border-color:rgba(184,66,60,.28)}.todo.done{background:rgba(60,84,100,.09);opacity:.78}.todo-main{flex:1;min-width:0}.todo-title{font-weight:700}.todo-meta{font-size:12px;color:var(--muted);margin-top:4px}.check{width:21px;height:21px;border-radius:50%;border:1px solid var(--primary);background:transparent;display:grid;place-items:center;color:#fff9ef;padding:0}.check.on{background:var(--primary)}.mini-actions{display:flex;gap:6px;flex-wrap:wrap}
.countdown{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}.countdown:last-child{border-bottom:0}.countdown .days{font-size:27px;color:var(--cinnabar);font-weight:700}.schedule-today{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.schedule-today:last-child{border:0}.period{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px}.tab.active{background:var(--primary);color:#fff9ef;border-color:var(--primary)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.spacer{flex:1}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 94%,var(--bg));color:var(--ink);border-radius:5px;padding:10px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:rgba(60,84,100,.65);box-shadow:0 0 0 3px rgba(60,84,100,.09)}textarea{min-height:100px;resize:vertical}.inline-field{display:flex;align-items:center;gap:8px}.inline-field input,.inline-field select{width:auto;min-width:120px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:6px}.table{width:100%;border-collapse:collapse;min-width:720px;background:color-mix(in srgb,var(--card) 98%,transparent)}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:13px;color:var(--muted);font-weight:600;background:rgba(60,84,100,.055)}.table tr:last-child td{border-bottom:0}.table input,.table select{padding:7px 8px}
.week-grid{display:grid;grid-template-columns:72px repeat(5,minmax(125px,1fr));border:1px solid var(--line);border-radius:6px;overflow:auto;min-width:820px}.week-grid>div{min-height:72px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;background:color-mix(in srgb,var(--card) 97%,transparent)}.week-grid .head{min-height:auto;background:rgba(60,84,100,.08);font-weight:700;text-align:center}.week-grid .period-cell{display:grid;place-items:center;color:var(--muted);font-size:13px}.week-grid .slot{cursor:pointer;position:relative}.week-grid .slot:hover{background:var(--soft)}.week-grid .slot.holiday{filter:grayscale(.8);opacity:.5;background:rgba(100,100,100,.08)}.course-chip{border-left:4px solid var(--primary);padding-left:7px}.course-chip b{display:block}.course-chip small{color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{text-align:center;color:var(--muted);font-size:12px;padding:6px}.cal-day{min-height:86px;border:1px solid var(--line);border-radius:5px;padding:7px;position:relative;background:color-mix(in srgb,var(--card) 97%,transparent)}.cal-day.dim{opacity:.35}.cal-day.holiday{background:rgba(184,66,60,.07)}.cal-day b{font-size:13px}.cal-events{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.stamp{position:absolute;right:5px;top:5px;color:var(--cinnabar);font-size:10px;border:1px solid currentColor;padding:2px;border-radius:3px}
.statuses{display:flex;gap:4px;flex-wrap:wrap}.status{border:1px solid var(--line);background:rgba(140,140,130,.08);color:var(--muted);padding:5px 8px;border-radius:999px;font-size:12px}.status.on{color:white}.status.present.on{background:#6f8d78;border-color:#6f8d78}.status.late.on{background:#b89d56;border-color:#b89d56}.status.absent.on{background:#b75c53;border-color:#b75c53}.status.leave.on{background:#bd8292;border-color:#bd8292}.statbar{display:flex;gap:10px;flex-wrap:wrap}.statbox{padding:8px 10px;border-radius:5px;background:var(--soft);font-size:13px}
.seat-grid{display:grid;gap:9px;max-width:850px}.seat{min-height:66px;border:1px dashed rgba(60,84,100,.42);border-radius:5px;display:grid;place-items:center;text-align:center;padding:5px;cursor:pointer;background:rgba(60,84,100,.04)}.seat:hover{background:var(--soft)}
.club-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.club-card{min-height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.club-card:hover{transform:translateY(-1px)}.club-card h3{font-size:21px}.club-mark{font-size:38px;color:var(--primary);opacity:.7}
.file-zone{border:1px dashed rgba(60,84,100,.45);border-radius:6px;padding:14px;background:rgba(60,84,100,.04)}.file-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.file-item:last-child{border:0}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.drop-note{font-size:12px;color:var(--muted)}
.note{padding:12px;border-left:3px solid var(--ochre);background:rgba(201,166,139,.08);border-radius:0 6px 6px 0}.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1px dashed var(--line);border-radius:6px}.danger-zone{border-color:rgba(184,66,60,.25);background:rgba(184,66,60,.04)}
.hobby-layout{display:grid;grid-template-columns:230px 1fr;gap:16px}.hobby-nav{display:grid;gap:7px}.hobby-nav button{text-align:left}.hobby-day{min-height:76px;cursor:pointer}.hobby-day.checked{background:rgba(60,84,100,.12);border-color:rgba(60,84,100,.35)}.hobby-day .mark{position:absolute;right:6px;bottom:5px;color:var(--primary);font-weight:800}.hobby-thumb{width:100%;height:42px;object-fit:cover;border-radius:6px;margin-top:5px}
.modal-back{position:fixed;inset:0;background:rgba(24,21,17,.38);display:grid;place-items:center;z-index:90;padding:20px}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 70px rgba(0,0,0,.2);padding:20px}.modal h2{margin:0 0 16px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:120;display:grid;gap:8px}.toast{background:color-mix(in srgb,var(--card) 92%,var(--primary));border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 14px;border-radius:5px;animation:toastIn .2s ease}@keyframes toastIn{from{transform:translateY(8px);opacity:0}}
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px}.lock-card{width:min(430px,100%);text-align:center}.lock-emblem{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-size:34px}
.storage-meter{height:10px;border-radius:999px;background:rgba(120,110,90,.13);overflow:hidden}.storage-meter i{height:100%;display:block;background:var(--primary)}
@media(max-width:1050px){.grid.four{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(2,1fr)}.hobby-layout{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;z-index:60;transform:translateX(-105%);transition:.2s;box-shadow:12px 0 34px rgba(0,0,0,.14)}.sidebar.open{transform:none}.main{padding:0 14px 36px}.hamb{display:inline-flex}.topbar{height:66px}.teacher-mini .who{display:none}.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column;gap:12px}.hero-date{font-size:28px}.hero-time{font-size:28px}.page-head{align-items:flex-start;flex-direction:column}.week-grid{min-width:760px}.calendar{gap:3px}.cal-day{min-height:68px;padding:5px}.club-cards{grid-template-columns:1fr}.top-actions{gap:6px}.top-actions .text-hide{display:none}.period-time-grid{grid-template-columns:1fr}.period-time-row{grid-template-columns:54px 36px minmax(74px,1fr) 20px minmax(74px,1fr)}.sync-badge{max-width:104px;overflow:hidden;text-overflow:ellipsis}}

.sync-badge{cursor:pointer;white-space:nowrap}.sync-badge.online{border-color:rgba(60,84,100,.35);background:rgba(60,84,100,.08)}.sync-badge.danger{color:var(--cinnabar);border-color:rgba(168,50,50,.4);background:rgba(168,50,50,.08)}
.period-time-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}.period-time-row{display:grid;grid-template-columns:62px 44px 1fr 24px 1fr;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--line)}.period-time-row input{padding:7px}.conflict-box{margin-top:12px;padding:12px;border:1px solid rgba(168,50,50,.38);background:rgba(168,50,50,.07);border-radius:5px}.cloud-card details{border-top:1px solid var(--line);padding-top:12px}.cloud-card summary{cursor:pointer;font-weight:700}.period-cell small{display:block;margin-top:3px;font-size:10px}.brand-mark{border:1px solid rgba(255,250,240,.4)}

.countdown-actions{display:flex;align-items:center;gap:10px}.course-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.course-line b{font-size:13px;line-height:1.25}.course-line b:last-child{white-space:nowrap;text-align:right}.week-grid .period-cell b{font-size:13px;color:var(--ink2)}.week-grid .slot[style]{transition:background .15s ease}.week-grid .slot[style]:hover{filter:saturate(1.04)}

@media print{.sidebar,.topbar,.toolbar button,.btn,.mountain{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none}.content{max-width:none}}


/* ============================================================
   视觉重构：参考“语文教师智能工作台 · 书卷”
   仅调整视觉与外壳布局，不改变业务数据、云同步与功能逻辑
   ============================================================ */
:root{
  --bg:#f7f2e7; --bg2:#f1e9d9; --bg3:#ece2ce;
  --card:#fffaf0; --cardg1:#fffaf0; --cardg2:#fbf3e3;
  --ink:#2b2b2b; --ink2:#606060; --ink3:#8b8272;
  --main:#3c5464; --main2:#4e6c80; --mainSoft:#e4ebef;
  --accent:#a83232; --accentSoft:#f6e4e0;
  --line:#d8ceb6; --line2:#e9e0cb; --chip:#efe7d3;
  --zhu:#a83232; --hua:#2e5c8a; --zhe:#8c4b2f; --teng:#b08a15; --zhuq:#54764c; --ouhe:#9c6b86;
  --sd:0 1px 2px rgba(90,70,40,.10),0 8px 20px -12px rgba(90,70,40,.28);
  --sd2:0 2px 6px rgba(90,70,40,.14),0 18px 34px -18px rgba(90,70,40,.30);
  --ff:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --ffk:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --r:6px;
  /* 与原美术版变量兼容 */
  --muted:var(--ink2); --primary:var(--main); --primary2:var(--main2);
  --soft:var(--mainSoft); --cinnabar:var(--accent); --ochre:#b58a66; --blue:#56758c;
  --coral:#b86c5f; --yellow:#c6a15b; --shadow:var(--sd); --paperNoise:.028;
}
[data-theme="dark"]{
  --bg:#2e2922; --bg2:#332e26; --bg3:#3a342b;
  --card:#38322a; --cardg1:#3a3429; --cardg2:#332d25;
  --ink:#f0e6cd; --ink2:#bcae91; --ink3:#948972;
  --main:#8fb2c4; --main2:#a6c5d5; --mainSoft:#33414a;
  --accent:#d0644c; --accentSoft:#4a2e26;
  --line:#4d4436; --line2:#443c30; --chip:#423a2d;
  --zhu:#d0644c; --hua:#7fa8cf; --zhe:#c08256; --teng:#d9b64c; --zhuq:#8fb083; --ouhe:#c294ad;
  --sd:0 1px 2px rgba(0,0,0,.35),0 10px 22px -14px rgba(0,0,0,.60);
  --sd2:0 2px 8px rgba(0,0,0,.45),0 18px 34px -18px rgba(0,0,0,.70);
  --muted:var(--ink2); --primary:var(--main); --primary2:var(--main2); --soft:var(--mainSoft);
  --cinnabar:var(--accent); --shadow:var(--sd); --paperNoise:.018;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--ff);color:var(--ink);font-size:14.5px;line-height:1.7;background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(120,95,50,.030) 0 1px,transparent 1px 5px),repeating-linear-gradient(90deg,rgba(120,95,50,.022) 0 1px,transparent 1px 7px);
}
[data-theme="dark"] body{background-image:repeating-linear-gradient(0deg,rgba(255,235,190,.022) 0 1px,transparent 1px 5px),repeating-linear-gradient(90deg,rgba(255,235,190,.016) 0 1px,transparent 1px 7px)}
body:before{display:none}.mountain{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}::-webkit-scrollbar-track{background:transparent}

/* 外壳 */
.app{display:flex;min-height:100vh;grid-template-columns:none}
.sidebar{width:216px;flex:0 0 216px;height:100vh;position:sticky;top:0;padding:0;background:linear-gradient(180deg,var(--bg2),var(--bg3));border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;box-shadow:none}
.sidebar::after{content:"";position:absolute;right:3px;top:0;bottom:0;width:2px;background-image:repeating-linear-gradient(180deg,var(--line) 0 10px,transparent 10px 22px);opacity:.7;pointer-events:none}
.sb-brand{padding:16px 14px 10px;border-bottom:1px solid var(--line);text-align:center}
.sb-brand .zh{font-family:var(--ffk);font-size:19px;letter-spacing:3px;color:var(--main);font-weight:700}
.sb-brand .en{font-size:10.5px;color:var(--ink3);letter-spacing:1.7px;margin-top:2px}
.me{padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.avatar-wrap{position:relative;width:74px;height:74px;display:block;cursor:pointer}

function shell(){const bf=document.getElementById('bootFallback');if(bf)bf.remove();
  const currentNav=navs.find(n=>n[0]===S.route)||navs[0];
  document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar ${S.sideOpen?'open':''}" id="sidebar"><div class="sb-brand"><div class="zh">美術工作臺</div><div class="en">ART TEACHER WORKBENCH</div></div><div class="me"><label class="avatar-wrap" title="点击更换 JPG 头像"><img class="avatar" src="${DB.settings.avatar||tinyJpg}"><span class="av-edit">＋</span><input type="file" accept="image/jpeg,.jpg,.jpeg" hidden onchange="changeAvatar(this.files[0])"></label><div class="nm">${esc(DB.settings.teacherName||'美术老师')}</div><div class="sc">${esc(DB.settings.school||'')}</div></div><nav class="nav">${navs.map(n=>`<button class="${S.route===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="icon">${n[2]}</span>${n[1]}</button>`).join('')}</nav><div class="side-foot">云端同步 · 自动保存<br>同一账号，多端共用</div></aside><div class="backdrop ${S.sideOpen?'show':''}" onclick="toggleSide()"></div><main class="main"><header class="topbar"><button class="hamb" onclick="toggleSide()">☰</button><div class="tb-title">${esc(currentNav[1])}<small>美术教师智能工作台</small></div><div class="tb-actions"><span id="syncBadge" class="pill sync-badge" onclick="go('settings')">云端未配置</span><button class="btn mini" onclick="togglePrivacy()">${DB.settings.privacy?'显示姓名':'隐私模式'}</button><button class="btn mini" onclick="toggleTheme()">${DB.settings.theme==='dark'?'☀ 日卷':'☾ 夜卷'}</button><button class="btn mini" onclick="lockNow()">锁屏</button></div></header><section class="content" id="content"></section></main></div>`;
  renderRoute();shellSyncBadge(); if(S.locked)renderLock();
}
function go(r){S.route=r;S.sideOpen=false;shell()}
function toggleSide(){S.sideOpen=!S.sideOpen;$('#sidebar')?.classList.toggle('open',S.sideOpen);document.querySelector('.backdrop')?.classList.toggle('show',S.sideOpen)}
function toggleTheme(){DB.settings.theme=DB.settings.theme==='dark'?'light':'dark';save(true);shell();toast(DB.settings.theme==='dark'?'已切换深色书卷模式':'已切换浅色书卷模式')}
function togglePrivacy(){DB.settings.privacy=!DB.settings.privacy;save(true);shell();toast(DB.settings.privacy?'已隐藏学生真实姓名':'已显示学生真实姓名')}
function changeAvatar(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();if(!['jpg','jpeg'].includes(ext)){toast('头像仅支持 JPG/JPEG');return}readJpgImage(file,800,.82,data=>{DB.settings.avatar=data;save(true);shell();toast('头像已更换')})}
function lockNow(){if(!DB.settings.passwordHash){toast('请先在设置中设置锁屏密码');go('settings');return}S.locked=true;renderLock()}
function renderLock(){document.body.insertAdjacentHTML('beforeend',`<div class="lock" id="lockLayer"><div class="card lock-card"><div class="lock-emblem">卷</div><h2>工作台已锁定</h2><p class="subtle">输入本机锁屏密码继续使用</p><div class="field"><input id="unlockPwd" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')unlock()"></div><button class="btn primary" style="width:100%" onclick="unlock()">解锁</button></div></div>`)}
function unlock(){const v=$('#unlockPwd')?.value||'';if(simpleHash(v)===DB.settings.passwordHash){S.locked=false;$('#lockLayer')?.remove();toast('已解锁')}else toast('密码不正确')}
function renderRoute(){const map={home:renderHome,schedule:renderSchedule,art:renderArtClass,teaching:renderTeaching,clubs:renderClubs,projects:renderProjects,settings:renderSettings,help:renderHelp,hobbies:renderHobbies};(map[S.route]||renderHome)()}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(desc||'')}</p></div><div class="mini-actions">${actions}</div></div>`}
function renderHome(){
  const n=new Date(),week=getWeek(),prog=semesterProgress(),day=(n.getDay()+6)%7;
  const todays=DB.schedule.entries.filter(e=>e.day===day&&activeEntry(e,week)).sort((a,b)=>a.period-b.period);
  const overdue=t=>!t.done&&new Date(`${t.deadline}T${t.time||'23:59'}`)<n;
  const lessonCount=DB.schedule.entries.filter(e=>activeEntry(e,week)).length;
  const countdowns=DB.holidays.slice().sort((a,b)=>{const da=daysLeft(a.date),db=daysLeft(b.date),af=da>=0,bf=db>=0;if(af!==bf)return af?-1:1;return af?da-db:db-da});
  $('#content').innerHTML=`<div class="hero"><div><div class="hero-date">${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日</div><div class="hero-meta"><span class="pill">第 ${week} 教学周</span><span class="pill">${DB.settings.school||'未设置学校'}</span><span class="pill">学期进度 ${prog}%</span></div></div><div class="hero-time" id="clock">${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}</div></div>
  <div class="grid four"><div class="card metric"><span class="subtle">本周课量</span><b>${lessonCount} 节</b></div><div class="card metric"><span class="subtle">今日课程</span><b>${todays.length} 节</b></div><div class="card metric"><span class="subtle">未完成待办</span><b>${DB.todos.filter(x=>!x.done).length} 项</b></div><div class="card metric"><span class="subtle">学期进度</span><b>${prog}%</b><div class="progress"><i style="width:${prog}%"></i></div></div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">To do list</h3><span class="seal">待办</span><span class="spacer"></span><button class="btn primary small" onclick="addTodo()">新增任务</button></div><div class="todo-list">${DB.todos.length?DB.todos.slice().sort((a,b)=>(a.done-b.done)||(`${a.deadline}${a.time}`).localeCompare(`${b.deadline}${b.time}`)).map(t=>`<div class="todo ${overdue(t)?'overdue':''} ${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="toggleTodo('${t.id}')">${t.done?'✓':''}</button><div class="todo-main"><div class="todo-title">${esc(t.title)}</div><div class="todo-meta">截止 ${esc(t.deadline)} ${esc(t.time||'')}</div></div><button class="btn small red" onclick="deleteTodo('${t.id}')">删除</button></div>`).join(''):empty('暂无任务，点击新增')}</div></div>
  <div class="card"><div class="toolbar"><h3 style="margin:0">假期倒计时</h3><span class="seal">盼</span><span class="spacer"></span><button class="btn small" onclick="addHoliday()">新增</button></div>${countdowns.length?countdowns.map(h=>{const d=daysLeft(h.date);return `<div class="countdown"><div><b>${esc(h.name)}</b><div class="subtle">${esc(h.date)}</div></div><div class="countdown-actions"><div class="days">${d>=0?d+'天':'已过'}</div><button class="btn small red" onclick="deleteHoliday('${h.id}')">删除</button></div></div>`}).join(''):empty()}</div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">今日课表</h3><span class="spacer"></span><button class="btn small" onclick="go('schedule')">查看课表</button></div>${todays.length?todays.map(e=>`<div class="schedule-today"><div class="period">${periodBadgeText(e.period)}</div><div><b>${esc(e.className)}</b><div class="subtle">${esc(e.grade)} · ${esc(e.subject)} · ${periodSlotLabel(e.period)} · ${periodTimeText(e.period,e.grade)}</div></div></div>`).join(''):empty('今日暂无课程')}</div>
  <div class="card"><div class="toolbar"><h3 style="margin:0">数据状态</h3><span class="spacer"></span><button class="btn small" onclick="go('settings')">同步设置</button></div><div class="note"><b>${cloudReady()?'云端同步已启用':'当前为本机保存'}</b><div class="subtle">${cloudReady()?esc(cloudStatusText()):'数据已自动写入本机 IndexedDB；配置云端后可跨设备同步。'}</div></div><div class="subtle" style="margin-top:10px">本机数据约 ${fmtBytes(storageUsage())}</div></div></div>`;
}

function addTodo(){modal('新增待办',`<div class="field"><label>任务</label><input id="mTitle"></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${today()}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="17:00"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitTodo()">添加</button>`)}
function commitTodo(){const title=$('#mTitle').value.trim();if(!title)return toast('请填写任务');DB.todos.push({id:uid(),title,deadline:$('#mDate').value,time:$('#mTime').value,done:false});save(true);closeModal();renderHome();toast('任务已添加')}
function toggleTodo(id){const x=DB.todos.find(x=>x.id===id);if(x){x.done=!x.done;save(true);renderHome()}}
function deleteTodo(id){const i=DB.todos.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这条待办？',()=>{pushRecycle('todo',DB.todos[i]);DB.todos.splice(i,1);save(true);renderHome();toast('已移入回收站')})}
function addHoliday(){modal('新增倒计时',`<div class="field"><label>名称</label><input id="mName"></div><div class="field"><label>日期</label><input id="mDate" type="date"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHoliday()">添加</button>`)}
function commitHoliday(){const name=$('#mName').value.trim(),date=$('#mDate').value;if(!name||!date)return toast('请填写完整');DB.holidays.push({id:uid(),name,date});save(true);closeModal();renderHome()}
function deleteHoliday(id){const i=DB.holidays.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这条倒计时？',()=>{pushRecycle('holiday',DB.holidays[i]);DB.holidays.splice(i,1);save(true);renderHome();toast('倒计时已移入回收站')})}

function periodSlotLabel(period){return PERIOD_SLOT_LABELS[(+period||1)-1]||`第${period}节`}
function periodBadgeText(period){return +period===2?'大':(+period===1?1:+period-1)}
function periodSessionLabel(period){return +period===2?'课间':(+period<=5?'上午':'下午')}
function periodTimeText(period,grade='初一'){const g=GRADES.includes(grade)?grade:'初一',t=DB.settings.gradePeriodTimes?.[g]?.[(+period||1)-1]||DEFAULT_GRADE_PERIOD_TIMES()[g]?.[(+period||1)-1];return t&&t[0]&&t[1]?`${t[0]}–${t[1]}`:(t&&(t[0]||t[1])?`${t[0]||'--:--'}–${t[1]||'--:--'}`:'')}
function scheduleCellBg(color){const h=String(color||'#3c5464').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return 'rgba(60,84,100,.08)';const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},.12)`}
function schedulePeriodOptions(grade,selected){return Array.from({length:11},(_,i)=>{const p=i+1,time=periodTimeText(p,grade);return `<option value="${p}" ${+selected===p?'selected':''}>${periodSlotLabel(p)}${time?' · '+time:''}</option>`}).join('')}
function updateSchedulePeriodOptions(){const g=$('#mGrade')?.value||'初一',sel=$('#mPeriod');if(!sel)return;const cur=+sel.value||1;sel.innerHTML=schedulePeriodOptions(g,cur)}

function renderSchedule(){
  S.viewWeek=Math.max(1,Math.min(20,+S.viewWeek||getWeek()));

  $('#content').innerHTML=pageHead('课表','1–20周 · 每日10节 + 大课间 · 初一/初二/初三课时时间独立设置',actions)+`<div class="card"><div class="toolbar"><div class="tabs" style="margin:0">${[['week','周视图'],['day','日列表'],['month','月日历'],['timeline','时间轴']].map(v=>`<button class="tab ${S.scheduleView===v[0]?'active':''}" onclick="S.scheduleView='${v[0]}';renderSchedule()">${v[1]}</button>`).join('')}</div><span class="spacer"></span><div class="inline-field"><button class="btn small" onclick="S.viewWeek=Math.max(1,S.viewWeek-1);renderSchedule()">‹</button><select onchange="S.viewWeek=+this.value;renderSchedule()">${Array.from({length:20},(_,i)=>`<option value="${i+1}" ${S.viewWeek===i+1?'selected':''}>第${i+1}周</option>`).join('')}</select><button class="btn small" onclick="S.viewWeek=Math.min(20,S.viewWeek+1);renderSchedule()">›</button></div></div><div id="scheduleBody"></div></div>

  if(S.scheduleView==='week')renderScheduleWeek();if(S.scheduleView==='day')renderScheduleDay();if(S.scheduleView==='month')renderScheduleMonth();if(S.scheduleView==='timeline')renderScheduleTimeline();

function renderScheduleWeek(){let out=`<div class="week-grid"><div class="head">节次</div>${DAYS.map((d,i)=>`<div class="head">${d}<div class="subtle">${dateForWeekDay(S.viewWeek,i)}</div></div>`).join('')}`;for(let p=1;p<=11;p++){out+=`<div class="period-cell"><b>${periodSlotLabel(p)}</b>${p===5?'<small>上午结束</small>':p===6?'<small>下午开始</small>':''}</div>`;for(let d=0;d<5;d++){const date=dateForWeekDay(S.viewWeek,d),holiday=DB.schedule.holidayDates.includes(date),arr=DB.schedule.entries.filter(e=>e.day===d&&e.period===p&&activeEntry(e,S.viewWeek)),e=arr[0],bg=e?scheduleCellBg(e.color):'';out+=`<div class="slot ${holiday?'holiday':''}" ${e?`style="background:${bg}"`:''} onclick="editSchedule(${d},${p},'${e?.id||''}')">${holiday?'<span class="stamp">放假</span>':''}${e?`<div class="course-chip" style="border-left-color:${esc(e.color||'#3c5464')}"><div class="course-line"><b>${esc(e.className)}</b><b>${esc(periodTimeText(e.period,e.grade))}</b></div><small>${esc(e.grade)} · ${esc(e.subject)} · ${e.weeks==='odd'?'单周':e.weeks==='even'?'双周':'每周'}</small></div>`:'<span class="subtle">点击编辑</span>'}</div>`}}out+='</div>';$('#scheduleBody').innerHTML=out}

function renderScheduleDay(){const d=Math.min(4,(new Date().getDay()+6)%7);$('#scheduleBody').innerHTML=`<div class="toolbar"><select id="daySel" onchange="renderDaySelected(+this.value)">${DAYS.map((x,i)=>`<option value="${i}" ${i===d?'selected':''}>${x}</option>`).join('')}</select></div><div id="dayList"></div>`;renderDaySelected(d)}
function renderDaySelected(d){const date=dateForWeekDay(S.viewWeek,d),holiday=DB.schedule.holidayDates.includes(date);let rows='';for(let p=1;p<=11;p++){const e=DB.schedule.entries.find(x=>x.day===d&&x.period===p&&activeEntry(x,S.viewWeek));rows+=`<div class="todo ${holiday?'overdue':''}" ${e?`style="background:${scheduleCellBg(e.color)}"`:''} onclick="editSchedule(${d},${p},'${e?.id||''}')"><div class="period">${periodBadgeText(p)}</div><div class="todo-main"><b>${e?esc(e.className):'空课'}</b><div class="subtle">${e?`${esc(e.grade)} · ${periodTimeText(p,e.grade)} · ${esc(e.subject)}`:periodSlotLabel(p)}${holiday?' · 放假':''}</div></div></div>`}$('#dayList').innerHTML=rows}

function renderScheduleMonth(){const base=new Date(dateForWeekDay(S.viewWeek,0)+'T00:00:00'),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const ds=isoDate(dt),dim=dt.getMonth()!==m,di=(dt.getDay()+6)%7,count=di<5?DB.schedule.entries.filter(e=>e.day===di).length:0;cells+=`<div class="cal-day ${dim?'dim':''} ${DB.schedule.holidayDates.includes(ds)?'holiday':''}"><b>${dt.getDate()}</b>${DB.schedule.holidayDates.includes(ds)?'<span class="stamp">放</span>':''}<div class="cal-events">${count&&di<5?`${count} 个课表单元`:''}</div></div>`}$('#scheduleBody').innerHTML=`<div class="toolbar"><b>${y}年${m+1}月</b></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div>`}
function renderScheduleTimeline(){const list=DB.schedule.entries.filter(e=>activeEntry(e,S.viewWeek)).sort((a,b)=>a.day-b.day||a.period-b.period);$('#scheduleBody').innerHTML=list.length?list.map(e=>`<div class="todo" style="background:${scheduleCellBg(e.color)}"><div class="period">${periodBadgeText(e.period)}</div><div class="todo-main"><b>${DAYS[e.day]} · ${esc(e.className)}</b><div class="subtle">${esc(e.grade)} · ${periodSlotLabel(e.period)} · ${periodTimeText(e.period,e.grade)} · ${esc(e.subject)}</div></div><button class="btn small" onclick="editSchedule(${e.day},${e.period},'${e.id}')">编辑</button></div>`).join(''):empty()}

function editSchedule(day='',period='',id=''){const e=id?DB.schedule.entries.find(x=>x.id===id):null,grade=GRADES.includes(e?.grade)?e.grade:'初一',selPeriod=e?.period??period??1;modal(e?'编辑课程':'新增课程',`<div class="grid two"><div class="field"><label>星期</label><select id="mDay">${DAYS.map((x,i)=>`<option value="${i}" ${(e?.day??day)==i?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>年级（必选）</label><select id="mGrade" onchange="updateSchedulePeriodOptions()">${GRADES.map(g=>`<option value="${g}" ${grade===g?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="grid two"><div class="field"><label>节次</label><select id="mPeriod">${schedulePeriodOptions(grade,selPeriod)}</select></div><div class="field"><label>课表格颜色</label><input id="mColor" type="color" value="${esc(e?.color||'#3c5464')}" style="height:42px;padding:5px"></div></div><div class="grid two"><div class="field"><label>班级 / 社团</label><input id="mClass" value="${esc(e?.className||'')}"></div><div class="field"><label>科目 / 内容</label><input id="mSubject" value="${esc(e?.subject||'美术')}"></div></div><div class="field"><label>生效周</label><select id="mWeeks"><option value="all" ${e?.weeks==='all'?'selected':''}>每周</option><option value="odd" ${e?.weeks==='odd'?'selected':''}>单周</option><option value="even" ${e?.weeks==='even'?'selected':''}>双周</option></select></div>`,`<button class="btn" onclick="closeModal()">取消</button>${e?`<button class="btn red" onclick="deleteSchedule('${e.id}')">删除</button>`:''}<button class="btn primary" onclick="commitSchedule('${e?.id||''}')">保存</button>`) }

function renderHomeworkDetail(hw){const a=currentArt(),near=daysLeft(hw.deadline)<=3&&daysLeft(hw.deadline)>=0,missing=a.students.filter(s=>(hw.records[s.id]?.status||'missing')==='missing');return `<div class="note" style="margin-bottom:14px"><b>${esc(hw.title)}</b> · ${esc(hw.subject)} · 截止 ${esc(hw.deadline)} ${near?'<span style="color:var(--cinnabar)">临近截止</span>':''}<div class="subtle">${esc(hw.requirement)}</div><div style="margin-top:7px">未交：${missing.length?missing.map((s,i)=>esc(privacyName(s.name,a.students.indexOf(s)))).join('、'):'无'}</div><div class="mini-actions" style="margin-top:8px"><button class="btn small" onclick="editHomework('${hw.id}')">编辑作业</button><button class="btn small red" onclick="deleteHomework('${hw.id}')">删除作业</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>状态</th><th>成绩</th><th>美术作业备注</th></tr></thead><tbody>${a.students.map((s,i)=>{const r=hw.records[s.id]||{status:'missing',score:'',note:''};return `<tr><td>${esc(privacyName(s.name,i))}</td><td><button class="btn small" onclick="cycleHomework('${hw.id}','${s.id}')">${r.status==='missing'?'未交':r.status==='submitted'?'已交':'已批'}</button></td><td>${r.status==='graded'?`<input type="number" min="0" max="100" value="${r.score??''}" oninput="setHomeworkScore('${hw.id}','${s.id}',this.value)">`:'—'}</td><td><input value="${esc(r.note||'')}" oninput="setHomeworkNote('${hw.id}','${s.id}',this.value)"></td></tr>`}).join('')}</tbody></table></div>`}
function editHomework(id=''){const a=currentArt(),h=a.homework.find(x=>x.id===id);modal(h?'编辑作业':'新增作业',`<div class="field"><label>标题</label><input id="mTitle" value="${esc(h?.title||'')}"></div><div class="grid two"><div class="field"><label>科目</label><input id="mSubject" value="${esc(h?.subject||'美术')}"></div><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(h?.deadline||today())}"></div></div><div class="field"><label>美术创作要求</label><textarea id="mReq">${esc(h?.requirement||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHomework('${id}')">保存</button>`)}
function commitHomework(id){const a=currentArt(),h=a.homework.find(x=>x.id===id),obj={id:id||uid(),title:$('#mTitle').value.trim(),subject:$('#mSubject').value.trim(),deadline:$('#mDate').value,requirement:$('#mReq').value.trim(),records:h?.records||{}};if(!obj.title)return toast('请填写标题');if(h)Object.assign(h,obj);else{a.students.forEach(s=>obj.records[s.id]={status:'missing',score:null,note:''});a.homework.push(obj);S.hwId=obj.id}save(true);closeModal();renderArtClass()}
function cycleHomework(hid,sid){const r=currentArt().homework.find(x=>x.id===hid).records[sid]||={status:'missing',score:null,note:''};r.status=r.status==='missing'?'submitted':r.status==='submitted'?'graded':'missing';if(r.status==='graded'&&r.score==null)r.score=85;save(true);renderArtClass()}
function setHomeworkScore(hid,sid,v){const r=currentArt().homework.find(x=>x.id===hid).records[sid];r.score=v===''?null:+v;save(true)}
function setHomeworkNote(hid,sid,v){const h=currentArt().homework.find(x=>x.id===hid);h.records[sid]??={status:'missing',score:null,note:''};h.records[sid].note=v;save(true)}
function deleteHomework(id){const a=currentArt(),i=a.homework.findIndex(x=>x.id===id);askConfirm('删除这项作业及其批改记录？',()=>{pushRecycle('homework',a.homework[i],{classId:S.classId});a.homework.splice(i,1);S.hwId=null;save(true);renderArtClass()})}
function renderBonus(){const a=currentArt();$('#artBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="addBonus()">新增附加分</button></div>${a.bonus.length?`<div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>日期</th><th>事由</th><th>分值</th><th>操作</th></tr></thead><tbody>${a.bonus.map(b=>{const i=a.students.findIndex(s=>s.id===b.studentId);return `<tr><td>${i>=0?esc(privacyName(a.students[i].name,i)):'已删除学生'}</td><td>${esc(b.date)}</td><td>${esc(b.reason)}</td><td>+${b.points}</td><td><button class="btn small red" onclick="deleteBonus('${b.id}')">删除</button></td></tr>`}).join('')}</tbody></table></div>`:empty()}`}
function addBonus(){const a=currentArt();modal('新增附加分',`<div class="field"><label>学生</label><select id="mStudent">${a.students.map((s,i)=>`<option value="${s.id}">${esc(privacyName(s.name,i))}</option>`).join('')}</select></div><div class="field"><label>事由</label><input id="mReason" list="bonusLabels"><datalist id="bonusLabels">${DB.settings.bonusLabels.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div><div class="grid two"><div class="field"><label>分值</label><input id="mPoints" type="number" step="0.5" value="1"></div><div class="field"><label>日期</label><input id="mDate" type="date" value="${today()}"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitBonus()">添加</button>`)}
function commitBonus(){const reason=$('#mReason').value.trim();if(!reason)return toast('请填写事由');currentArt().bonus.push({id:uid(),studentId:$('#mStudent').value,reason,points:+$('#mPoints').value||0,date:$('#mDate').value});save(true);closeModal();renderArtClass()}
function deleteBonus(id){const a=currentArt(),i=a.bonus.findIndex(x=>x.id===id);askConfirm('删除这条附加分记录？',()=>{pushRecycle('bonus',a.bonus[i],{classId:S.classId});a.bonus.splice(i,1);save(true);renderArtClass()})}
function calcGrades(a,s){const dates=Object.keys(a.attendance),vals=dates.map(d=>a.attendance[d][s.id]).filter(Boolean);const map={present:100,late:90,leave:85,absent:0};const att=vals.length?vals.reduce((n,x)=>n+(map[x]??0),0)/vals.length:0;const scores=a.homework.map(h=>h.records[s.id]).filter(r=>r?.status==='graded'&&r.score!=null).map(r=>+r.score);const hw=scores.length?scores.reduce((n,x)=>n+x,0)/scores.length:0;const usual=.6*att+.4*hw;const bonus=Math.min(10,a.bonus.filter(b=>b.studentId===s.id).reduce((n,b)=>n+(+b.points||0),0));return{att,hw,usual,bonus,final:.9*usual+bonus}}
function renderGrades(){const a=currentArt();$('#artBody').innerHTML=`<div class="note" style="margin-bottom:14px">计算规则：平时成绩 = 60%考勤 + 40%作业；期末成绩 = 90%平时成绩 + 附加分（附加分按累计点数计入，最高10分）。</div>${a.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>考勤</th><th>作业</th><th>平时成绩</th><th>附加分</th><th>期末成绩</th></tr></thead><tbody>${a.students.map((s,i)=>{const g=calcGrades(a,s);return `<tr><td>${esc(privacyName(s.name,i))}</td><td>${g.att.toFixed(1)}</td><td>${g.hw.toFixed(1)}</td><td>${g.usual.toFixed(1)}</td><td>${g.bonus.toFixed(1)}</td><td><b>${g.final.toFixed(1)}</b></td></tr>`}).join('')}</tbody></table></div>`:empty()}`}
function renderTeaching(){const tabs=[['plans','教案库'],['courseware','课件索引'],['pbl','PBL项目'],['topic','项目课题'],['papers','论文'],['awards','获奖记录']];$('#content').innerHTML=pageHead('教学教研','教案版本、课后反思、课件索引与美术教研记录')+`<div class="card"><div class="tabs">${tabs.map(t=>`<button class="tab ${S.teachTab===t[0]?'active':''}" onclick="S.teachTab='${t[0]}';renderTeaching()">${t[1]}</button>`).join('')}</div><div id="teachBody"></div></div>`;({plans:renderPlans,courseware:renderCourseware,pbl:renderPBL,topic:renderTopic,papers:renderPapers,awards:renderAwards}[S.teachTab]||renderPlans)()}
function renderPlans(){const list=DB.teaching.plans;$('#teachBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editPlan()">新建教案</button></div>${list.length?list.map(p=>{const v=p.versions[p.versions.length-1];return `<div class="card" style="margin-bottom:12px"><div class="toolbar"><div><h3 style="margin:0">${esc(p.title)}</h3><span class="subtle">${esc(p.grade||'')} · ${p.versions.length}个版本 · 最新v${v?.version||1}</span></div><span class="spacer"></span><button class="btn small" onclick="viewPlan('${p.id}')">查看版本</button><button class="btn small" onclick="newPlanVersion('${p.id}')">复制旧版新建</button><button class="btn small red" onclick="deletePlan('${p.id}')">删除</button></div><div class="note">${esc(v?.content||'')}</div>${v?.reflection?`<p class="subtle">课后反思：${esc(v.reflection)}</p>`:''}</div>`}).join(''):empty()}`}
function editPlan(){modal('新建教案',`<div class="field"><label>教案名称</label><input id="mTitle"></div><div class="field"><label>年级 / 对象</label><input id="mGrade"></div><div class="field"><label>教案内容</label><textarea id="mContent"></textarea></div><div class="field"><label>课后反思</label><textarea id="mReflection"></textarea></div><div class="field"><label>附件（Word / Excel / JPG / PNG，单文件≤${fmtBytes(MAX_FILE)}）</label><input id="mFile" type="file" accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitPlan()">创建</button>`)}
function commitPlan(){const title=$('#mTitle').value.trim();if(!title)return toast('请填写教案名称');const p={id:uid(),title,grade:$('#mGrade').value.trim(),versions:[{id:uid(),version:1,date:today(),content:$('#mContent').value.trim(),reflection:$('#mReflection').value.trim(),attachments:[]}]};const file=$('#mFile').files[0];const done=()=>{DB.teaching.plans.push(p);save(true);closeModal();renderTeaching();toast('教案已创建')};if(file)readFile(file,['doc','docx','xls','xlsx','jpg','jpeg','png'],f=>{p.versions[0].attachments.push(f);done()});else done()}
function viewPlan(id){const p=DB.teaching.plans.find(x=>x.id===id);if(!p)return;modal(p.title,`<div class="tabs">${p.versions.map((v,i)=>`<button class="tab ${i===p.versions.length-1?'active':''}" onclick="showPlanVersion('${p.id}','${v.id}',this)">v${v.version}</button>`).join('')}</div><div id="planVersionBox"></div>`,`<button class="btn" onclick="closeModal()">关闭</button>`);setTimeout(()=>showPlanVersion(p.id,p.versions[p.versions.length-1].id),0)}
function showPlanVersion(pid,vid,btn){const p=DB.teaching.plans.find(x=>x.id===pid),v=p?.versions.find(x=>x.id===vid);if(!v)return;if(btn){$$('.modal .tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}$('#planVersionBox').innerHTML=`<div class="field"><label>教案内容</label><textarea oninput="updatePlanVersion('${pid}','${vid}','content',this.value)">${esc(v.content)}</textarea></div><div class="field"><label>课后反思</label><textarea oninput="updatePlanVersion('${pid}','${vid}','reflection',this.value)">${esc(v.reflection||'')}</textarea></div><div class="file-zone"><div class="toolbar"><b>附件</b><span class="spacer"></span><label class="btn small">上传附件<input type="file" hidden accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" onchange="uploadPlanAttachment('${pid}','${vid}',this.files[0])"></label></div>${attachmentList(v.attachments,`deletePlanAttachment('${pid}','${vid}',{i})`)}</div>`}
function updatePlanVersion(pid,vid,key,val){const v=DB.teaching.plans.find(x=>x.id===pid)?.versions.find(x=>x.id===vid);if(v){v[key]=val;save(true)}}

function newPlanVersion(pid){const p=DB.teaching.plans.find(x=>x.id===pid),base=p.versions[p.versions.length-1];modal('复制旧版新建版本',`<div class="field"><label>教案内容</label><textarea id="mContent">${esc(base.content)}</textarea></div><div class="field"><label>课后反思</label><textarea id="mReflection">${esc(base.reflection||'')}</textarea></div><div class="field"><label>可附加新文件</label><input id="mFile" type="file" accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitPlanVersion('${pid}')">新建版本</button>`)}

function renderProjects(){const cats=['党政中心','融媒体中心','美育中心'];if(!DB.projects[S.projectCat])DB.projects[S.projectCat]={tasks:[],notes:[],progress:[]};const p=DB.projects[S.projectCat];$('#content').innerHTML=pageHead('项目中心','党政、融媒体与美育工作统一管理')+`<div class="tabs">${cats.map(c=>`<button class="tab ${S.projectCat===c?'active':''}" onclick="S.projectCat='${c}';renderProjects()">${c}</button>`).join('')}</div><div class="grid three"><div class="card"><div class="toolbar"><h3 style="margin:0">待办清单</h3><span class="spacer"></span><button class="btn primary small" onclick="addProjectTask()">新增</button></div>${p.tasks.length?p.tasks.map(t=>{const od=!t.done&&daysLeft(t.deadline)<0;return `<div class="todo ${od?'overdue':''} ${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="toggleProjectTask('${t.id}')">${t.done?'✓':''}</button><div class="todo-main"><b>${esc(t.title)}</b><div class="subtle">${esc(t.deadline)} · ${t.repeat==='daily'?'每日重复':t.repeat==='weekly'?'每周重复':'不重复'}</div></div><button class="btn small red" onclick="deleteProjectTask('${t.id}')">删除</button></div>`}).join(''):empty()}</div><div class="card"><div class="toolbar"><h3 style="margin:0">便签</h3><span class="spacer"></span><button class="btn primary small" onclick="addProjectNote()">新增</button></div>${p.notes.length?p.notes.map(n=>`<div class="note" style="margin-bottom:9px"><div>${esc(n.text)}</div><div class="mini-actions" style="margin-top:8px"><button class="btn small" onclick="editProjectNote('${n.id}')">编辑</button><button class="btn small red" onclick="deleteProjectNote('${n.id}')">删除</button></div></div>`).join(''):empty()}</div><div class="card"><div class="toolbar"><h3 style="margin:0">工作进度表</h3><span class="spacer"></span><button class="btn primary small" onclick="addProjectProgress()">新增</button></div>${p.progress.length?p.progress.map(x=>`<div class="note" style="margin-bottom:10px"><b>计划</b><div>${esc(x.plan)}</div><b>任务</b><div>${esc(x.task)}</div><b>总结</b><div>${esc(x.summary)}</div><div class="mini-actions" style="margin-top:8px"><button class="btn small" onclick="editProjectProgress('${x.id}')">编辑</button><button class="btn small red" onclick="deleteProjectProgress('${x.id}')">删除</button></div></div>`).join(''):empty()}</div></div>`}

function toggleProjectTask(id){const a=DB.projects[S.projectCat].tasks,t=a.find(x=>x.id===id),was=t.done;t.done=!t.done;if(!was&&t.done&&t.repeat!=='none'){const d=new Date(t.deadline+'T00:00:00');d.setDate(d.getDate()+(t.repeat==='daily'?1:7));const nd=isoDate(d);if(!a.some(x=>x.title===t.title&&x.deadline===nd&&!x.done))a.push({id:uid(),title:t.title,deadline:nd,repeat:t.repeat,done:false})}save(true);renderProjects()}

<div class="card" style="margin-top:16px"><div class="toolbar"><h3 style="margin:0">课时设置</h3><span class="pill">10节课 + 大课间</span><span class="spacer"></span><select style="width:auto;min-width:104px" onchange="S.settingsPeriodGrade=this.value;renderSettings()">${GRADES.map(x=>`<option value="${x}" ${g===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="resetPeriodTimes()">恢复${g}演示时间</button></div><div class="period-time-grid">${Array.from({length:11},(_,i)=>`<div class="period-time-row"><b>${periodSlotLabel(i+1)}</b><span>${periodSessionLabel(i+1)}</span><input type="time" value="${esc(DB.settings.gradePeriodTimes[g][i]?.[0]||'')}" onchange="setPeriodTime(${i},0,this.value)"><span>至</span><input type="time" value="${esc(DB.settings.gradePeriodTimes[g][i]?.[1]||'')}" onchange="setPeriodTime(${i},1,this.value)"></div>`).join('')}</div></div>
<div class="card cloud-card" style="margin-top:16px"><div class="toolbar"><h3 style="margin:0">云同步</h3><span id="cloudStatusBox" class="pill">${esc(cloudStatusText())}</span><span class="spacer"></span>${cloudReady()?`<button class="btn primary" onclick="cloudSyncNow(true)">立即同步</button><button class="btn" onclick="cloudLogout()">退出账号</button>`:''}</div><div class="grid two"><div><div class="field"><label>Supabase 项目 URL</label><input id="cloudUrl" placeholder="https://xxxx.supabase.co" value="${esc(Cloud.cfg?.url||'')}"></div><div class="field"><label>Publishable / anon key（可公开客户端Key，禁止填写service_role）</label><textarea id="cloudKey" style="min-height:76px">${esc(Cloud.cfg?.key||'')}</textarea></div><div class="toolbar"><button class="btn" onclick="saveCloudSettingsFromUI()">保存云端连接</button><button class="btn" onclick="testCloudConnection()">测试云端连接</button><button class="btn" onclick="copyCloudLink()">复制多端访问链接</button></div><label class="pill"><input type="checkbox" style="width:auto" ${Cloud.cfg?.autoSync!==false?'checked':''} onchange="saveCloudConfig({autoSync:this.checked});startCloudPolling()"> 自动同步（约12秒检查一次）</label></div><div><div class="field"><label>邮箱账号</label><input id="cloudEmail" type="email" value="${esc(Cloud.session?.user?.email||'')}" ${cloudReady()?'disabled':''}></div><div class="field"><label>密码</label><input id="cloudPassword" type="password" placeholder="密码不会写入工作台数据或云端快照" ${cloudReady()?'disabled':''}></div>${cloudReady()?`<div class="note"><b>已登录：</b>${esc(Cloud.session.user.email||Cloud.session.user.id)}<br>同一账号在电脑、手机、平板打开同一个已部署链接即可同步数据。</div>`:`<div class="toolbar"><button class="btn primary" onclick="cloudSignIn()">登录</button><button class="btn" onclick="cloudSignUp()">注册</button></div>`}${Cloud.conflict?`<div class="conflict-box"><b>检测到本机与云端同时修改</b><p>为避免静默覆盖，请选择保留哪一份；另一份不会自动合并。</p><button class="btn" onclick="resolveCloudConflict('remote')">采用云端</button> <button class="btn red" onclick="resolveCloudConflict('local')">采用本机</button></div>`:''}</div></div><div class="note" style="margin-top:12px"><b>存储结构：</b>业务数据先自动保存到本机 IndexedDB；登录后同步到云数据库；Word/Excel/JPG/PNG附件同步到私有对象存储。将本HTML部署到静态网站后，同一网址可在电脑、手机和平板使用。</div><details style="margin-top:12px"><summary>首次配置Supabase所需SQL（点开复制）</summary><textarea id="cloudSql" readonly style="min-height:330px">${esc(cloudSetupSQL())}</textarea><button class="btn small" onclick="copyCloudSQL()">复制SQL</button><p class="subtle">在Supabase SQL Editor执行一次即可。表使用RLS按登录用户隔离；附件Bucket为私有。</p></details></div>
<div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">班级管理</h3><span class="spacer"></span><button class="btn primary small" onclick="editClass()">新增班级</button></div>${DB.classes.length?DB.classes.map(c=>`<div class="file-item"><div class="inline-field"><span class="dot" style="background:${c.color}"></span><b>${esc(c.name)}</b></div><div class="mini-actions"><button class="btn small" onclick="editClass('${c.id}')">编辑</button><button class="btn small red" onclick="deleteClass('${c.id}')">删除</button></div></div>`).join(''):empty()}</div><div class="card"><h3>附加分标签</h3><div class="field"><label>每行一个标签</label><textarea oninput="DB.settings.bonusLabels=this.value.split(/\n/).map(x=>x.trim()).filter(Boolean);save(true)">${esc((DB.settings.bonusLabels||[]).join('\n'))}</textarea></div></div></div>
<div class="grid two" style="margin-top:16px"><div class="card"><h3>数据管理</h3><div class="toolbar"><button class="btn primary" onclick="exportBackup()">导出JSON备份</button><label class="btn">导入JSON恢复<input type="file" hidden accept="application/json,.json" onchange="importBackup(this.files[0]);this.value='' "></label><button class="btn" onclick="fillDemo()">一键填充演示数据</button><button class="btn red" onclick="clearAllData()">清空全部数据</button></div><div class="storage-meter"><i style="width:${Math.min(100,Math.round(used/(100*1024*1024)*100))}%"></i></div><p class="subtle" id="storageInfo">正在读取本机存储占用…</p><div class="note">业务数据以IndexedDB作为本机缓存；登录云端后，同步快照写入云数据库，教学附件同步到私有对象存储。JSON备份仍建议定期导出作为独立归档。</div></div><div class="card"><h3>回收站</h3><div class="subtle" style="margin-bottom:10px">共 ${DB.recycle.length} 项</div>${DB.recycle.length?DB.recycle.slice(0,20).map(x=>`<div class="file-item"><div><b>${esc(recycleLabel(x))}</b><div class="subtle">${new Date(x.deletedAt).toLocaleString()}</div></div><button class="btn small" onclick="restoreRecycle('${x.id}')">恢复</button></div>`).join(''):empty('回收站为空')}</div></div>`;updateStorageEstimate();updateCloudStatusBox()}

function setPeriodTime(i,part,val){const g=GRADES.includes(S.settingsPeriodGrade)?S.settingsPeriodGrade:'初一';DB.settings.gradePeriodTimes[g][i][part]=val;save(true);toast(`${g}课时时间已更新`)}

function resetPeriodTimes(){const g=GRADES.includes(S.settingsPeriodGrade)?S.settingsPeriodGrade:'初一';DB.settings.gradePeriodTimes[g]=DEFAULT_GRADE_PERIOD_TIMES()[g].map(x=>x.slice());save(true);renderSettings();toast(`已恢复${g}演示时间`)}

function saveCloudSettingsFromUI(){const url=$('#cloudUrl').value.trim().replace(/\/+$/,''),key=$('#cloudKey').value.trim();if(!url||!key)return toast('请填写项目URL和客户端Key');if(/service_role/i.test(key))return toast('禁止在前端填写service_role密钥');saveCloudConfig({url,key});Cloud.status='连接已保存';renderSettings();toast('云端连接已保存')}
async function testCloudConnection(){const url=($('#cloudUrl')?.value||Cloud.cfg?.url||'').trim().replace(/\/+$/,''),key=($('#cloudKey')?.value||Cloud.cfg?.key||'').trim();if(!url||!key)return toast('请先填写项目URL和Publishable Key');try{const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();toast('云端连接正常');modal('云端连接测试','<p><b>连接成功。</b>Supabase Auth API可以访问。</p><div class="note">下一步请执行设置页中的初始化SQL，再注册/登录账号，然后点击“立即同步”。</div>','<button class="btn primary" onclick="closeModal()">知道了</button>')}catch(e){toast('连接失败：'+e.message)}}
function updateCloudStatusBox(){const el=$('#cloudStatusBox');if(el)el.textContent=cloudStatusText()}
function copyCloudLink(){if(!Cloud.cfg?.url||!Cloud.cfg?.key)return toast('请先保存云端连接');if(location.protocol==='file:')return toast('当前是本地file链接。请先把这个HTML部署到静态网站，再复制多端链接');const u=new URL(location.href);u.searchParams.set('sp_url',Cloud.cfg.url);u.searchParams.set('sp_key',Cloud.cfg.key);navigator.clipboard?.writeText(u.toString()).then(()=>toast('多端链接已复制；其他设备打开后再登录同一账号')).catch(()=>prompt('复制这个链接：',u.toString()))}
function cloudSetupSQL(){return `create table if not exists public.art_teacher_snapshots (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  data jsonb not null default '{}'::jsonb,\n  client_updated_at bigint not null default 0,\n  client_id text,\n  updated_at timestamptz not null default now()\n);\nalter table public.art_teacher_snapshots enable row level security;\ngrant select, insert, update, delete on public.art_teacher_snapshots to authenticated;\ndrop policy if exists \"users read own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users read own art teacher snapshot\" on public.art_teacher_snapshots for select to authenticated using (auth.uid() = user_id);\ndrop policy if exists \"users insert own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users insert own art teacher snapshot\" on public.art_teacher_snapshots for insert to authenticated with check (auth.uid() = user_id);\ndrop policy if exists \"users update own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users update own art teacher snapshot\" on public.art_teacher_snapshots for update to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndrop policy if exists \"users delete own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users delete own art teacher snapshot\" on public.art_teacher_snapshots for delete to authenticated using (auth.uid() = user_id);\ninsert into storage.buckets (id,name,public) values ('art-teacher-files','art-teacher-files',false) on conflict (id) do nothing;\ndrop policy if exists \"art teacher files read\" on storage.objects;\ncreate policy \"art teacher files read\" on storage.objects for select to authenticated using (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');\ndrop policy if exists \"art teacher files insert\" on storage.objects;\ncreate policy \"art teacher files insert\" on storage.objects for insert to authenticated with check (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');\ndrop policy if exists \"art teacher files update\" on storage.objects;\ncreate policy \"art teacher files update\" on storage.objects for update to authenticated using (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%') with check (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');\ndrop policy if exists \"art teacher files delete\" on storage.objects;\ncreate policy \"art teacher files delete\" on storage.objects for delete to authenticated using (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');`;}
function copyCloudSQL(){navigator.clipboard?.writeText(cloudSetupSQL()).then(()=>toast('SQL已复制')).catch(()=>{const t=$('#cloudSql');t.select();document.execCommand('copy');toast('SQL已复制')})}
function setPassword(){const v=$('#setPwd').value;if(v.length<4)return toast('密码至少4位');DB.settings.passwordHash=simpleHash(v);save(true);$('#setPwd').value='';toast('锁屏密码已设置')}
function clearPassword(){askConfirmNoRecycle('确认清除锁屏密码？',()=>{DB.settings.passwordHash='';save(true);toast('密码已清除')})}
function askConfirmNoRecycle(msg,onYes){modal('确认操作',`<p>${esc(msg)}</p>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn red" id="confirmNoRecycle">确认</button>`);setTimeout(()=>$('#confirmNoRecycle').onclick=()=>{closeModal();onYes()},0)}
function editClass(id=''){const c=DB.classes.find(x=>x.id===id);modal(c?'编辑班级':'新增班级',`<div class="field"><label>班级名称</label><input id="mName" value="${esc(c?.name||'')}"></div><div class="field"><label>标识色</label><input id="mColor" type="color" value="${esc(c?.color||'#3c5464')}"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitClass('${id}')">保存</button>`)}
function commitClass(id){const name=$('#mName').value.trim();if(!name)return toast('请填写班级名称');if(id){const c=DB.classes.find(x=>x.id===id);c.name=name;c.color=$('#mColor').value}else{const cid=uid();DB.classes.push({id:cid,name,color:$('#mColor').value});DB.artClasses[cid]={students:[],groups:[],seats:{rows:10,cols:2,cells:Array(20).fill(null)},attendance:{},homework:[],bonus:[]};S.classId=cid}save(true);closeModal();renderSettings()}
function deleteClass(id){const i=DB.classes.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除该班级及其美术课数据？',()=>{pushRecycle('classBundle',{class:DB.classes[i],art:DB.artClasses[id]});DB.classes.splice(i,1);delete DB.artClasses[id];if(S.classId===id)S.classId=DB.classes[0]?.id||null;save(true);renderSettings()})}
async function exportBackup(){const copy=typeof structuredClone==='function'?structuredClone(DB):JSON.parse(JSON.stringify(DB)),need=[];walkFiles(copy,f=>{if(!f.data&&f.cloudPath)need.push(f)});if(need.length&&cloudReady()){toast('正在打包云端附件…');for(const f of need){try{const path=f.cloudPath.split('/').map(encodeURIComponent).join('/'),res=await cloudFetch(`/storage/v1/object/authenticated/${encodeURIComponent(Cloud.cfg.bucket||'art-teacher-files')}/${path}`),blob=await res.blob();f.data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}catch(e){console.warn('备份附件读取失败',f.name,e)}}}else if(need.length)toast('当前未连接云端，备份中有部分附件仅保留云端路径');const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`美术教师工作台备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('备份文件已导出')}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||typeof data!=='object'||!data.settings)throw new Error('invalid');askConfirmNoRecycle('导入将覆盖当前数据，确定继续？',()=>{DB=data;normalizeDB();save(true);S.clubId=null;S.classId=DB.classes[0]?.id||null;shell();toast('备份已恢复')})}catch(e){toast('JSON备份文件无效')}};r.readAsText(file,'utf-8')}
function fillDemo(){askConfirmNoRecycle('演示数据将覆盖当前全部数据，确定继续？',()=>{DB=demoDB();normalizeDB();save(true);S.classId=DB.classes[0]?.id;S.clubId=null;shell();toast('已填充演示数据')})}
function blankDB(){const n=new Date(),e=new Date();e.setDate(n.getDate()+139);return{settings:{teacherName:'美术老师',school:'',semesterStart:today(),semesterEnd:isoDate(e),lessonMinutes:40,periodTimes:DEFAULT_PERIOD_TIMES.map(x=>x.slice()),gradePeriodTimes:DEFAULT_GRADE_PERIOD_TIMES(),schedulePeriodSchemaVersion:2,theme:DB?.settings?.theme||'light',privacy:false,passwordHash:'',lockOnLeave:true,avatar:tinyJpg,bonusLabels:['美术创作优秀 +1','区美术赛获一等奖 +3']},classes:[],todos:[],holidays:[],schedule:{entries:[],holidayDates:[],adjustmentNote:'',substitutions:[]},artClasses:{},teaching:{plans:[],courseware:[],pbl:[],topic:'',papers:[],awards:[]},clubs:[],projects:{'党政中心':{tasks:[],notes:[],progress:[]},'融媒体中心':{tasks:[],notes:[],progress:[]},'美育中心':{tasks:[],notes:[],progress:[]}},hobbies:['画画','书法','篆刻','拼豆','缝纫','运动'].map((name,i)=>({id:'h'+i,name,color:['#3c5464','#c9a68b','#6e8ea3','#d98a7a','#8b7d6b','#769183'][i],records:{}})),recycle:[]}}
function clearAllData(){askConfirmNoRecycle('确认清空全部业务数据？当前完整数据会作为一项快照放入新的回收站。',()=>{const old=JSON.parse(JSON.stringify(DB));DB=blankDB();DB.recycle.push({id:uid(),kind:'allData',data:old,meta:{},deletedAt:new Date().toISOString()});normalizeDB();save(true);S.classId=null;S.clubId=null;shell();toast('全部业务数据已清空，可从回收站恢复快照')})}
function recycleLabel(x){const m={todo:'待办',holiday:'倒计时',schedule:'课程',substitution:'调课/代课记录',student:'学生',homework:'作业',bonus:'附加分',plan:'教案',attachment:'附件',courseware:'课件索引',pbl:'PBL项目',paper:'论文',award:'获奖记录',club:'社团',clubStudent:'社团学生',clubMaterial:'社团资料',clubActivity:'社团活动',clubIdea:'教学灵感',projectTask:'项目待办',projectNote:'项目便签',projectProgress:'项目进度',classBundle:'班级',hobby:'爱好分类',hobbyRecord:'爱好打卡',allData:'完整数据快照'};return `${m[x.kind]||x.kind}：${x.data?.title||x.data?.name||x.data?.text||x.data?.file?.name||'记录'}`}
function restoreRecycle(id){const i=DB.recycle.findIndex(x=>x.id===id);if(i<0)return;const x=DB.recycle[i],d=x.data,m=x.meta||{};try{switch(x.kind){case'todo':DB.todos.push(d);break;case'holiday':DB.holidays.push(d);break;case'schedule':DB.schedule.entries.push(d);break;case'substitution':DB.schedule.substitutions.push(d);break;case'student':DB.artClasses[m.classId]?.students.push(d);break;case'homework':DB.artClasses[m.classId]?.homework.push(d);break;case'bonus':DB.artClasses[m.classId]?.bonus.push(d);break;case'plan':DB.teaching.plans.push(d);break;case'courseware':DB.teaching.courseware.push(d);break;case'pbl':DB.teaching.pbl.push(d);break;case'paper':DB.teaching.papers.push(d);break;case'award':DB.teaching.awards.push(d);break;case'club':DB.clubs.push(d);break;case'clubStudent':DB.clubs.find(c=>c.id===m.clubId)?.students.push(d);break;case'clubMaterial':DB.clubs.find(c=>c.id===m.clubId)?.materials.push(d);break;case'clubActivity':DB.clubs.find(c=>c.id===m.clubId)?.activities.push(d);break;case'clubIdea':DB.clubs.find(c=>c.id===m.clubId)?.inspirations.push(d);break;case'projectTask':DB.projects[m.cat]?.tasks.push(d);break;case'projectNote':DB.projects[m.cat]?.notes.push(d);break;case'projectProgress':DB.projects[m.cat]?.progress.push(d);break;case'classBundle':DB.classes.push(d.class);DB.artClasses[d.class.id]=d.art;break;case'hobby':DB.hobbies.push(d);break;case'hobbyRecord':{const h=DB.hobbies.find(h=>h.id===m.hobbyId);if(h)h.records[m.date]=d;break}case'attachment':restoreAttachment(d,m);break;case'allData':DB=d;normalizeDB();save(true);shell();toast('完整数据快照已恢复');return;default:throw new Error('未知类型')}DB.recycle.splice(i,1);save(true);renderSettings();toast('已恢复')}catch(e){console.error(e);toast('恢复失败：原所属数据可能已不存在')}}
function restoreAttachment(d,m){if(m.target==='plan'){DB.teaching.plans.find(p=>p.id===m.pid)?.versions.find(v=>v.id===m.vid)?.attachments.push(d)}if(m.target==='clubPlan'){DB.clubs.find(c=>c.id===m.clubId)?.plans.find(p=>p.week===m.week)?.attachments.push(d)}}

function renderHelp(){$('#content').innerHTML=pageHead('帮助','快速上手、云同步部署与快捷键')+`<div class="grid two"><div class="card"><h3>快速上手</h3><div class="list"><div class="note"><b>总览</b><br>查看今日课程、待办、假期倒计时、本周课量与学期进度。</div><div class="note"><b>课表</b><br>支持周、日、月、时间轴视图，1–20周、单双周、10节课与大课间、分年级课时时间、自定义课表颜色、放假与调课记录。</div><div class="note"><b>美术课</b><br>管理学生、标签、分组、两列座位、考勤、作业、附加分和成绩统计。</div><div class="note"><b>教学教研</b><br>保存教案历史版本、反思、附件、课件索引、PBL、课题、论文与获奖。</div><div class="note"><b>校本社团</b><br>每个社团拥有独立学生名单、20周社团课程、活动记录和活动灵感。</div><div class="note"><b>项目中心</b><br>分党政、融媒体、美育中心管理待办、便签与工作进度。</div></div></div><div class="card"><h3>云同步怎么使用</h3><p><b>程序仍然只有一个HTML文件</b>，没有引用外部JS/CSS/字体/图片。区别是开启云同步后，会用浏览器原生fetch访问你自己的Supabase项目。</p><p>第一次使用：在Supabase创建项目 → 在本工作台“设置 → 云同步”复制并执行SQL → 填写Project URL与publishable/anon key → 点击“测试云端连接” → 注册或登录。部署完成后，还应在Supabase Auth的URL Configuration中把Site URL设为最终工作台网址；这样邮箱确认、密码重置等跳转会回到正确页面。</p><p>要实现“同一个链接在手机、电脑、平板打开”，需要把这个HTML部署在一个静态网站地址。部署后使用设置中的“复制多端访问链接”；其他设备打开并登录同一账号即可同步。单纯通过微信发送HTML文件并不会形成一个全局网址。</p><p>本机使用IndexedDB缓存，断网时仍可编辑；重新联网后自动同步。Word/Excel/图片附件先存在本机，登录云端后上传到私有对象存储。头像和少量打卡图片仍可作为小型base64数据随工作台快照同步。</p><p>同步采用单用户工作台常见的“最新版本 + 冲突保护”模式。如果两个设备在离线状态同时修改，系统不会静默覆盖，而是在设置页要求选择本机或云端版本。</p><p class="subtle">安全提示：前端只允许放Supabase的publishable/anon key；绝不能把service_role密钥写入HTML。真正的数据访问权限由Supabase Auth和RLS策略控制。</p><h3>快捷键</h3><div class="table-wrap"><table class="table"><tbody><tr><td>Alt + 1…8</td><td>切换总览、课表、美术课、教学教研、校本社团、项目中心、设置、帮助</td></tr><tr><td>Ctrl/⌘ + Shift + L</td><td>立即锁屏（需先设置密码）</td></tr><tr><td>Esc</td><td>关闭弹窗</td></tr></tbody></table></div></div></div>`}

function renderHobbies(){const h=DB.hobbies.find(x=>x.id===S.hobbyId)||DB.hobbies[0];S.hobbyId=h?.id||null;$('#content').innerHTML=pageHead('兴趣爱好','按月历记录画画、书法、篆刻、拼豆、缝纫、运动等每日打卡',`<button class="btn primary" onclick="addHobby()">新增爱好分类</button>`)+(h?`<div class="hobby-layout"><div class="card"><div class="hobby-nav">${DB.hobbies.map(x=>`<button class="btn ${x.id===S.hobbyId?'primary':''}" onclick="S.hobbyId='${x.id}';renderHobbies()">${esc(x.name)}</button>`).join('')}</div><button class="btn red small" style="margin-top:12px;width:100%" onclick="deleteHobby('${h.id}')">删除当前分类</button></div><div class="card"><div class="toolbar"><button class="btn small" onclick="moveHobbyMonth(-1)">‹ 上月</button><b>${S.hobbyMonth.replace('-','年')}月 · ${esc(h.name)}</b><button class="btn small" onclick="moveHobbyMonth(1)">下月 ›</button><span class="spacer"></span><span class="pill">本月 ${Object.keys(h.records||{}).filter(d=>d.startsWith(S.hobbyMonth)).length} 次</span></div><div id="hobbyCalendar"></div></div></div>`:empty());if(h)renderHobbyCalendar()}
function renderHobbyCalendar(){const h=DB.hobbies.find(x=>x.id===S.hobbyId),[y,m]=S.hobbyMonth.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=isoDate(d),rec=h.records?.[ds],dim=d.getMonth()!==m-1;cells+=`<div class="cal-day hobby-day ${dim?'dim':''} ${rec?'checked':''}" onclick="editHobbyRecord('${ds}')"><b>${d.getDate()}</b>${rec?'<span class="mark">✓</span>':''}${rec?.image?`<img class="hobby-thumb" src="${rec.image}">`:''}${rec?.note?`<div class="cal-events">${esc(rec.note.slice(0,18))}</div>`:''}</div>`}$('#hobbyCalendar').innerHTML=`<div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div>`}
function moveHobbyMonth(n){let [y,m]=S.hobbyMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);S.hobbyMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderHobbies()}
function addHobby(){modal('新增爱好分类',`<div class="field"><label>分类名称</label><input id="mName"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHobby()">添加</button>`)}
function commitHobby(){const name=$('#mName').value.trim();if(!name)return toast('请填写名称');const h={id:uid(),name,color:'#3c5464',records:{}};DB.hobbies.push(h);S.hobbyId=h.id;save(true);closeModal();renderHobbies()}
function deleteHobby(id){const i=DB.hobbies.findIndex(x=>x.id===id);askConfirm('删除这个爱好分类及全部打卡？',()=>{pushRecycle('hobby',DB.hobbies[i]);DB.hobbies.splice(i,1);S.hobbyId=DB.hobbies[0]?.id||null;save(true);renderHobbies()})}
function editHobbyRecord(date){const h=DB.hobbies.find(x=>x.id===S.hobbyId),r=h.records?.[date];modal(r?'编辑打卡':'每日打卡',`<p><b>${esc(date)}</b> · ${esc(h.name)}</p><div class="field"><label>打卡记录</label><textarea id="mNote">${esc(r?.note||'')}</textarea></div><div class="field"><label>JPG配图</label><input id="mFile" type="file" accept="image/jpeg,.jpg,.jpeg"></div>${r?.image?`<img src="${r.image}" style="max-width:100%;height:150px;object-fit:cover;border-radius:5px">`:''}`,`<button class="btn" onclick="closeModal()">取消</button>${r?`<button class="btn red" onclick="deleteHobbyRecord('${date}')">删除打卡</button>`:''}<button class="btn primary" onclick="commitHobbyRecord('${date}')">打卡</button>`)}
function commitHobbyRecord(date){const h=DB.hobbies.find(x=>x.id===S.hobbyId);h.records??={};const old=h.records[date]||{note:'',image:''},obj={note:$('#mNote').value.trim(),image:old.image||''},file=$('#mFile').files[0],done=()=>{h.records[date]=obj;save(true);closeModal();renderHobbies();toast('打卡已记录')};if(file)readJpgImage(file,1400,.84,data=>{obj.image=data;done()});else done()}
function deleteHobbyRecord(date){const h=DB.hobbies.find(x=>x.id===S.hobbyId),r=h.records[date];closeModal();askConfirm('删除这一天的打卡记录？',()=>{pushRecycle('hobbyRecord',r,{hobbyId:h.id,date});delete h.records[date];save(true);renderHobbies()})}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.altKey&&/^[1-8]$/.test(e.key)){e.preventDefault();go(navs[+e.key-1][0])}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='l'){e.preventDefault();lockNow()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&DB?.settings?.lockOnLeave&&DB.settings.passwordHash)S.locked=true;else if(!document.hidden&&S.locked&&!$('#lockLayer'))renderLock()});
async function initApp(){Cloud.cfg=loadCloudConfig();Cloud.session=loadCloudSession();try{const ui=JSON.parse(SafeStore.get(UI_KEY)||'{}');if(ui.theme)document.documentElement.dataset.theme=ui.theme}catch{}await load();document.documentElement.dataset.theme=DB.settings.theme||'light';shell();startCloudPolling();if(cloudReady())setTimeout(()=>cloudSyncNow().catch(()=>{}),700)}
window.addEventListener('online',()=>{toast('网络已恢复，准备同步');cloudSyncNow().catch(()=>{})});window.addEventListener('focus',()=>{if(cloudReady())cloudSyncNow().catch(()=>{})});initApp().catch(e=>{console.error(e);document.body.innerHTML='<div style="padding:30px;font-family:serif;background:#f7f2e7;color:#2b2b2b;min-height:100vh"><h2>工作台初始化失败</h2><p>'+String(e&&e.message||e)+'</p><p>可尝试关闭 Safari 的“阻止所有 Cookie”后重新打开。</p></div>'});
</script>
