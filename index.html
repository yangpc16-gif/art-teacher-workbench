function collectSummaryStats(start,end){
  const st={lessons:0,teachingLessons:0,studentCount:0,studentPersonTimes:0,grades:{'初一':0,'初二':0,'初三':0,'校务':0},classes:new Set(),subjects:new Set(),mapped:0,holidayDays:0,makeupDays:0,stopDays:0,specialDays:0,substitutions:0,attendanceDays:0,attendanceIssues:0,homeworks:0,bonus:0,studentComments:0,featured:0,specialStudents:0,planVersions:0,reflections:0,awards:0,papers:0,clubActivities:0,clubAttendanceSessions:0,clubAttendanceExpected:0,clubAttendancePresent:0,clubAttendanceLate:0,clubAttendanceLeave:0,clubAttendanceAbsent:0,clubAttendanceRate:0,clubNames:new Set(),schoolAdminLessons:0,schoolAdminItems:new Set(),adminCategories:{'党政':0,'融媒体':0,'美育':0,'其他':0},projectTasks:0,projectDone:0,projectPending:0,todoDone:0,todoPending:0,savedSemesters:summarySavedSemesterCount(start,end),classStats:[],detail:{clubActivities:[],awards:[],specials:[],substitutions:[],schoolAdmin:[],projectTasks:[],todos:[]}};
  const classLessonMap=new Map(),studentKeys=new Set();
  const classByNorm=new Map((DB.classes||[]).map(c=>[normalizeClassName(c.name),c]));
  for(let w=1;w<=20;w++)for(let d=0;d<7;d++){const date=dateForWeekDay(w,d);if(!summaryInRange(date,start,end))continue;for(let p=1;p<=11;p++){effectiveEntriesForDate(w,d,p).filter(e=>!e._holiday&&!e._stopped).forEach(e=>{st.lessons++;if(st.grades[e.grade]!=null)st.grades[e.grade]++;else st.grades[e.grade]=(st.grades[e.grade]||0)+1;if(e.subject)st.subjects.add(e.subject);if(e._mapped)st.mapped++;if(e.grade==='校务'){st.schoolAdminLessons++;const cat=schoolAdminCategory(e);st.adminCategories[cat]=(st.adminCategories[cat]||0)+1;const label=[e.className,e.subject].filter(Boolean).join(' · ')||'校务';st.schoolAdminItems.add(`${cat}：${label}`);st.detail.schoolAdmin.push(`${date} [${cat}] ${label}${scheduleEntryTime(e)?`（${scheduleEntryTime(e)}）`:''}`)}else{st.teachingLessons++;const norm=normalizeClassName(e.className||'');const cfg=classByNorm.get(norm);if(cfg||parseClassParts(e.className||'')){const key=cfg?.id||`name:${norm}`;if(!classLessonMap.has(key))classLessonMap.set(key,{classId:cfg?.id||'',className:cfg?.name||parseClassParts(e.className||'')?.name||e.className,lessons:0});classLessonMap.get(key).lessons++;st.classes.add(cfg?.name||e.className)}}})}}
  (DB.schedule.holidayDates||[]).filter(x=>summaryInRange(x,start,end)).forEach(()=>st.holidayDays++);

  (DB.schedule.substitutions||[]).filter(x=>summaryInRange(x.date,start,end)).forEach(x=>{st.substitutions++;st.detail.substitutions.push(`${x.date} ${x.info||''}`)});
  Object.values(DB.artClasses||{}).forEach(a=>{Object.keys(a.attendance||{}).filter(x=>summaryInRange(x,start,end)).forEach(date=>{st.attendanceDays++;Object.values(a.attendance[date]||{}).forEach(v=>{if(v&&v!=='present')st.attendanceIssues++})});(a.homework||[]).filter(h=>summaryInRange(h.deadline,start,end)).forEach(()=>st.homeworks++);(a.bonus||[]).filter(b=>summaryInRange(b.date,start,end)).forEach(()=>st.bonus++);(a.students||[]).forEach(x=>{if((x.comments||'').trim())st.studentComments++;if(x.featured)st.featured++;if(x.special)st.specialStudents++})});
  (DB.teaching.plans||[]).forEach(p=>(p.versions||[]).filter(v=>summaryInRange(v.date,start,end)).forEach(v=>{st.planVersions++;if((v.reflection||'').trim())st.reflections++}));
  (DB.teaching.awards||[]).filter(x=>summaryInRange(x.date,start,end)).forEach(x=>{st.awards++;st.detail.awards.push(`${x.date} ${x.name||''}${x.level?'（'+x.level+'）':''}`)});
  const y1=+start.slice(0,4),y2=+end.slice(0,4);if(S.summaryTab==='semester'||S.summaryTab==='year')(DB.teaching.papers||[]).filter(x=>+x.year>=y1&&+x.year<=y2).forEach(()=>st.papers++);
  (DB.clubs||[]).forEach(c=>(c.activities||[]).filter(x=>summaryInRange(x.date,start,end)).forEach(x=>{st.clubActivities++;st.clubNames.add(c.name);if(!Object.keys(c.attendance?.[x.date]||{}).length)st.studentPersonTimes+=(c.students||[]).length;st.detail.clubActivities.push(`${x.date} ${c.name}：${x.title||''}${x.summary?'——'+x.summary:''}`)}));

function generateWorkSummary(){const range=summaryRange(),st=collectSummaryStats(range.start,range.end);S.summaryStats=st;S.summaryDraft=generateSummaryText(range,st,summaryOptions());S.summaryLoadedId='';renderWorkSummary();toast('已根据现有记录生成总结初稿')}
function saveWorkSummary(){const text=$('#summaryEditor')?.value??S.summaryDraft;if(!text.trim())return toast('请先生成或填写总结');S.summaryDraft=text;const range=summaryRange(),now=new Date().toISOString(),selection=range.selection;let obj=S.summaryLoadedId?DB.workSummaries.find(x=>x.id===S.summaryLoadedId):null;if(obj){Object.assign(obj,{type:S.summaryTab,selection,start:range.start,end:range.end,title:summaryTitle(range),text,stats:S.summaryStats||collectSummaryStats(range.start,range.end),updatedAt:now})}else{obj={id:uid(),type:S.summaryTab,selection,start:range.start,end:range.end,title:summaryTitle(range),text,stats:S.summaryStats||collectSummaryStats(range.start,range.end),createdAt:now,updatedAt:now};DB.workSummaries.push(obj);S.summaryLoadedId=obj.id}save(true);renderWorkSummary();toast('工作总结版本已保存')}
function loadWorkSummary(id){const x=DB.workSummaries.find(r=>r.id===id);if(!x)return;S.summaryTab=x.type||'week';if(x.type==='week')S.summaryWeek=+x.selection||1;if(x.type==='month')S.summaryMonth=x.selection||today().slice(0,7);if(x.type==='year')S.summarySchoolYear=String(x.selection||academicStartYear());S.summaryDraft=x.text||'';S.summaryStats=(x.stats&&x.stats.studentPersonTimes!=null&&x.stats.adminCategories)?x.stats:collectSummaryStats(x.start,x.end);S.summaryLoadedId=x.id;renderWorkSummary();toast('已打开历史版本')}
function deleteWorkSummary(id){const i=DB.workSummaries.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这份工作总结历史版本？',()=>{pushRecycle('workSummary',DB.workSummaries[i]);DB.workSummaries.splice(i,1);if(S.summaryLoadedId===id){S.summaryLoadedId='';S.summaryDraft='';S.summaryStats=null}save(true);renderWorkSummary()})}

function summaryDownload(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportWorkSummaryMarkdown(){const range=summaryRange(),text=$('#summaryEditor')?.value??S.summaryDraft;if(!text.trim())return toast('暂无总结内容');const st=S.summaryStats||collectSummaryStats(range.start,range.end),body=`# ${summaryTitle(range)}\n\n${summaryMarkdownData(st)}\n\n## 工作总结正文\n\n${text}`;summaryDownload(`${summaryTitle(range)}.md`,'\uFEFF'+body,'text/markdown;charset=utf-8')}
function wordHtml(title,text,st=null){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:"Songti SC","STSong","SimSun",serif;line-height:1.9;font-size:12pt;margin:36pt;color:#222}h1{text-align:center;font-size:20pt}h2{font-size:14pt;margin:18pt 0 8pt}table{border-collapse:collapse;width:100%;margin:8pt 0 14pt;font-size:10.5pt}th,td{border:1px solid #999;padding:6pt 7pt;text-align:center}th{background:#f3efe5}pre{white-space:pre-wrap;font-family:inherit;font-size:12pt}</style></head><body><h1>${esc(title)}</h1>${summaryWordDataHtml(st)}<h2>工作总结正文</h2><pre>${esc(text)}</pre></body></html>`}
function exportWorkSummaryWord(){const range=summaryRange(),text=$('#summaryEditor')?.value??S.summaryDraft;if(!text.trim())return toast('暂无总结内容');const st=S.summaryStats||collectSummaryStats(range.start,range.end);summaryDownload(`${summaryTitle(range)}.doc`,'\uFEFF'+wordHtml(summaryTitle(range),text,st),'application/msword;charset=utf-8')}
function exportSavedSummaryWord(id){const x=DB.workSummaries.find(r=>r.id===id);if(!x)return;const st=(x.stats&&x.stats.studentPersonTimes!=null&&x.stats.adminCategories)?x.stats:collectSummaryStats(x.start,x.end);summaryDownload(`${x.title||'工作总结'}.doc`,'\uFEFF'+wordHtml(x.title||'工作总结',x.text||'',st),'application/msword;charset=utf-8')}
function printWorkSummary(){const range=summaryRange(),text=$('#summaryEditor')?.value??S.summaryDraft;if(!text.trim())return toast('暂无总结内容');const st=S.summaryStats||collectSummaryStats(range.start,range.end),w=window.open('','_blank');if(!w)return toast('浏览器阻止了打印窗口');w.document.write(wordHtml(summaryTitle(range),text,st));w.document.close();setTimeout(()=>w.print(),300)}

function copyCloudLink(){if(!Cloud.cfg?.url||!Cloud.cfg?.key)return toast('请先保存云端连接');if(location.protocol==='file:')return toast('当前是本地file链接。请先把这个HTML部署到静态网站，再复制多端链接');const u=new URL(location.href);u.searchParams.set('sp_url',Cloud.cfg.url);u.searchParams.set('sp_key',Cloud.cfg.key);navigator.clipboard?.writeText(u.toString()).then(()=>toast('多端链接已复制；其他设备打开后再登录同一账号')).catch(()=>prompt('复制这个链接：',u.toString()))}
function cloudSetupSQL(){return `create table if not exists public.art_teacher_snapshots (\n  user_id uuid primary key references auth.users(id) on delete cascade,\n  data jsonb not null default '{}'::jsonb,\n  client_updated_at bigint not null default 0,\n  client_id text,\n  updated_at timestamptz not null default now()\n);\nalter table public.art_teacher_snapshots enable row level security;\ngrant select, insert, update, delete on public.art_teacher_snapshots to authenticated;\ndrop policy if exists \"users read own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users read own art teacher snapshot\" on public.art_teacher_snapshots for select to authenticated using (auth.uid() = user_id);\ndrop policy if exists \"users insert own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users insert own art teacher snapshot\" on public.art_teacher_snapshots for insert to authenticated with check (auth.uid() = user_id);\ndrop policy if exists \"users update own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users update own art teacher snapshot\" on public.art_teacher_snapshots for update to authenticated using (auth.uid() = user_id) with check (auth.uid() = user_id);\ndrop policy if exists \"users delete own art teacher snapshot\" on public.art_teacher_snapshots;\ncreate policy \"users delete own art teacher snapshot\" on public.art_teacher_snapshots for delete to authenticated using (auth.uid() = user_id);\ninsert into storage.buckets (id,name,public) values ('art-teacher-files','art-teacher-files',false) on conflict (id) do nothing;\ndrop policy if exists \"art teacher files read\" on storage.objects;\ncreate policy \"art teacher files read\" on storage.objects for select to authenticated using (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');\ndrop policy if exists \"art teacher files insert\" on storage.objects;\ncreate policy \"art teacher files insert\" on storage.objects for insert to authenticated with check (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');\ndrop policy if exists \"art teacher files update\" on storage.objects;\ncreate policy \"art teacher files update\" on storage.objects for update to authenticated using (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%') with check (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');\ndrop policy if exists \"art teacher files delete\" on storage.objects;\ncreate policy \"art teacher files delete\" on storage.objects for delete to authenticated using (bucket_id='art-teacher-files' and name like auth.uid()::text || '/%');`;}

async function exportBackup(){const copy=typeof structuredClone==='function'?structuredClone(DB):JSON.parse(JSON.stringify(DB)),need=[];walkFiles(copy,f=>{if(!f.data&&f.cloudPath)need.push(f)});if(need.length&&cloudReady()){toast('正在打包云端附件…');for(const f of need){try{const path=f.cloudPath.split('/').map(encodeURIComponent).join('/'),res=await cloudFetch(`/storage/v1/object/authenticated/${encodeURIComponent(Cloud.cfg.bucket||'art-teacher-files')}/${path}`),blob=await res.blob();f.data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}catch(e){console.warn('备份附件读取失败',f.name,e)}}}else if(need.length)toast('当前未连接云端，备份中有部分附件仅保留云端路径');const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`美术教师工作台备份-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('备份文件已导出')}

function restoreRecycle(id){const i=DB.recycle.findIndex(x=>x.id===id);if(i<0)return;const x=DB.recycle[i],d=x.data,m=x.meta||{};try{switch(x.kind){case'todo':DB.todos.push(d);break;case'holiday':DB.holidays.push(d);break;case'schedule':DB.schedule.entries.push(d);break;case'substitution':DB.schedule.substitutions.push(d);break;case'specialDay':DB.schedule.specialDays.push(d);break;case'student':DB.artClasses[m.classId]?.students.push(d);break;case'homework':DB.artClasses[m.classId]?.homework.push(d);break;case'bonus':DB.artClasses[m.classId]?.bonus.push(d);break;case'plan':DB.teaching.plans.push(d);break;case'courseware':DB.teaching.courseware.push(d);break;case'pbl':DB.teaching.pbl.push(d);break;case'paper':DB.teaching.papers.push(d);break;case'award':DB.teaching.awards.push(d);break;case'club':DB.clubs.push(d);break;case'clubStudent':DB.clubs.find(c=>c.id===m.clubId)?.students.push(d);break;case'clubMaterial':DB.clubs.find(c=>c.id===m.clubId)?.materials.push(d);break;case'clubActivity':DB.clubs.find(c=>c.id===m.clubId)?.activities.push(d);break;case'clubIdea':DB.clubs.find(c=>c.id===m.clubId)?.inspirations.push(d);break;case'projectTask':DB.projects[m.cat]?.tasks.push(d);break;case'projectNote':DB.projects[m.cat]?.notes.push(d);break;case'projectProgress':DB.projects[m.cat]?.progress.push(d);break;case'projectFile':DB.projects[m.cat]?.files.push(d);break;case'quickNote':DB.quickNotes.push(d);break;case'classBundle':DB.classes.push(d.class);DB.artClasses[d.class.id]=d.art;break;case'hobby':DB.hobbies.push(d);break;case'hobbyRecord':{const h=DB.hobbies.find(h=>h.id===m.hobbyId);if(h)h.records[m.date]=d;break}case'workSummary':DB.workSummaries.push(d);break;case'attachment':restoreAttachment(d,m);break;case'allData':DB=d;normalizeDB();save(true);shell();toast('完整数据快照已恢复');return;default:throw new Error('未知类型')}DB.recycle.splice(i,1);save(true);renderSettings();toast('已恢复')}catch(e){console.error(e);toast('恢复失败：原所属数据可能已不存在')}}
function restoreAttachment(d,m){if(m.target==='plan'){DB.teaching.plans.find(p=>p.id===m.pid)?.versions.find(v=>v.id===m.vid)?.attachments.push(d)}if(m.target==='clubPlan'){DB.clubs.find(c=>c.id===m.clubId)?.plans.find(p=>p.week===m.week)?.attachments.push(d)}}

function renderHobbies(){const h=DB.hobbies.find(x=>x.id===S.hobbyId)||DB.hobbies[0];S.hobbyId=h?.id||null;$('#content').innerHTML=pageHead('兴趣爱好','按月历记录画画、书法、篆刻、拼豆、缝纫、运动等每日打卡',`<button class="btn primary" onclick="addHobby()">新增爱好分类</button>`)+(h?`<div class="hobby-layout"><div class="card"><div class="hobby-nav">${DB.hobbies.map(x=>`<button class="btn ${x.id===S.hobbyId?'primary':''}" onclick="S.hobbyId='${x.id}';renderHobbies()">${esc(x.name)}</button>`).join('')}</div><button class="btn red small" style="margin-top:12px;width:100%" onclick="deleteHobby('${h.id}')">删除当前分类</button></div><div class="card"><div class="toolbar"><button class="btn small" onclick="moveHobbyMonth(-1)">‹ 上月</button><b>${S.hobbyMonth.replace('-','年')}月 · ${esc(h.name)}</b><button class="btn small" onclick="moveHobbyMonth(1)">下月 ›</button><span class="spacer"></span><span class="pill">本月 ${Object.keys(h.records||{}).filter(d=>d.startsWith(S.hobbyMonth)).length} 次</span></div><div id="hobbyCalendar"></div></div></div>`:empty());if(h)renderHobbyCalendar()}
function renderHobbyCalendar(){const h=DB.hobbies.find(x=>x.id===S.hobbyId),[y,m]=S.hobbyMonth.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=isoDate(d),rec=h.records?.[ds],dim=d.getMonth()!==m-1;cells+=`<div class="cal-day hobby-day ${dim?'dim':''} ${rec?'checked':''}" onclick="editHobbyRecord('${ds}')"><b>${d.getDate()}</b>${rec?'<span class="mark">✓</span>':''}${rec?.image?`<img class="hobby-thumb" src="${rec.image}">`:''}${rec?.note?`<div class="cal-events">${esc(rec.note.slice(0,18))}</div>`:''}</div>`}$('#hobbyCalendar').innerHTML=`<div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div>`}

function bonusPointsFromName(name){const m=String(name||'').match(/([+-]?\d+(?:\.\d+)?)\s*$/);return m?Math.abs(+m[1]):1}

function editBonusLabel(id=''){const x=(DB.settings.bonusLabelLibrary||[]).find(x=>x.id===id);modal(x?'编辑附加分标签':'新增附加分标签',`<div class="field"><label>标签名称</label><input id="mBonusLabel" value="${esc(x?.name||'')}"></div><div class="field"><label>默认分值</label><input id="mBonusPoints" type="number" step="0.5" min="0" value="${x?.points??1}"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitBonusLabel('${id}')">保存</button>`)}
function commitBonusLabel(id){const name=$('#mBonusLabel').value.trim(),points=+$('#mBonusPoints').value||0;if(!name)return toast('请填写标签名称');if((DB.settings.bonusLabelLibrary||[]).some(x=>x.id!==id&&x.name===name))return toast('标签名称已存在');const x=DB.settings.bonusLabelLibrary.find(x=>x.id===id);if(x){x.name=name;x.points=points}else DB.settings.bonusLabelLibrary.push({id:uid(),name,points});DB.settings.bonusLabels=DB.settings.bonusLabelLibrary.map(x=>x.name);save(true);closeModal();renderSettings();toast('附加分标签已同步')}
function deleteBonusLabel(id){const lib=DB.settings.bonusLabelLibrary||[],i=lib.findIndex(x=>x.id===id);if(i<0)return;const label=lib[i],used=Object.values(DB.artClasses||{}).reduce((n,a)=>n+(a.bonus||[]).filter(b=>b.labelId===id).length,0);askConfirmNoRecycle(`删除“${label.name}”？${used?`已有 ${used} 条历史附加分使用该标签，删除后历史事由和分值仍会保留。`:''}`,()=>{Object.values(DB.artClasses||{}).forEach(a=>(a.bonus||[]).forEach(b=>{if(b.labelId===id){b.reason=label.name;delete b.labelId}}));lib.splice(i,1);DB.settings.bonusLabels=lib.map(x=>x.name);save(true);renderSettings();toast('标签已删除，历史记录已保留')})}

function projectCatForTodoType(type){return type==='党政'?'党政中心':type==='融媒体'?'融媒体中心':type==='美育'?'美育中心':''}
function visibleHomeTodoItems(now=new Date()){return homeTodoItems().filter(t=>!t.done)}
function overdueDays(t,now=new Date()){if(!t?.deadline)return 0;const dt=new Date(`${t.deadline}T${t._source==='project'?(t.time||'23:59'):(t.time||'23:59')}`);if(Number.isNaN(dt.getTime())||dt>=now)return 0;return Math.max(1,Math.ceil((now-dt)/86400000))}
function addTodo(prefill={}){modal('新增待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(prefill.title||'')}"></div><div class="field"><label>类型（必选）</label><select id="mTodoType"><option value="">请选择类型</option>${TODO_TYPES.map(x=>`<option value="${x}" ${prefill.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${prefill.deadline||today()}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="${prefill.time||'17:00'}"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitTodo()">添加</button>`)}
function commitTodo(){const title=$('#mTitle').value.trim(),type=$('#mTodoType').value,deadline=$('#mDate').value,time=$('#mTime').value;if(!title)return toast('请填写任务');if(!TODO_TYPES.includes(type))return toast('请选择任务类型');const cat=projectCatForTodoType(type);if(cat){DB.projects[cat]??={tasks:[],notes:[],progress:[],files:[]};DB.projects[cat].tasks.push({id:uid(),title,deadline,time,repeat:'none',done:false,source:'home'})}else DB.todos.push({id:uid(),title,type,deadline,time,done:false,source:'home'});save(true);closeModal();renderHome();toast(cat?`任务已添加，并同步到${cat}`:'任务已添加')}
function commitHomeTodoEdit(source,id,cat=''){const title=$('#mTitle')?.value.trim();if(!title)return toast('请填写任务');if(source==='project'){const t=(DB.projects?.[cat]?.tasks||[]).find(x=>x.id===id);if(!t)return;t.title=title;t.deadline=$('#mDate')?.value||'';t.time=$('#mTime')?.value||t.time||'';t.repeat=$('#mRepeat')?.value||'none'}else{const a=DB.todos||[],i=a.findIndex(x=>x.id===id),t=a[i];if(!t)return;const type=$('#mTodoType')?.value||'';if(!TODO_TYPES.includes(type))return toast('请选择任务类型');const target=projectCatForTodoType(type);if(target){a.splice(i,1);DB.projects[target].tasks.push({id:t.id,title,deadline:$('#mDate')?.value||'',time:$('#mTime')?.value||'',repeat:'none',done:!!t.done,source:t.source||'home'})}else{t.title=title;t.type=type;t.deadline=$('#mDate')?.value||'';t.time=$('#mTime')?.value||''}}save(true);closeModal();renderHome();toast('待办已更新')}
function editHomeTodo(source,id,cat=''){if(source==='project'){const t=(DB.projects?.[cat]?.tasks||[]).find(x=>x.id===id);if(!t)return;modal('编辑项目待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(t.title||'')}"></div><div class="field"><label>类型</label><input value="${esc(projectTodoType(cat))}" disabled><div class="subtle" style="margin-top:5px">项目类型由“${esc(cat)}”自动决定</div></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(t.deadline||'')}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="${esc(t.time||'17:00')}"></div></div><div class="field"><label>重复</label><select id="mRepeat"><option value="none" ${t.repeat==='none'||!t.repeat?'selected':''}>不重复</option><option value="daily" ${t.repeat==='daily'?'selected':''}>每日</option><option value="weekly" ${t.repeat==='weekly'?'selected':''}>每周</option></select></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHomeTodoEdit('project','${id}','${cat}')">保存</button>`)}else{const t=(DB.todos||[]).find(x=>x.id===id);if(!t)return;modal('编辑待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(t.title||'')}"></div><div class="field"><label>类型（必选）</label><select id="mTodoType">${TODO_TYPES.map(x=>`<option value="${x}" ${t.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(t.deadline||'')}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="${esc(t.time||'17:00')}"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHomeTodoEdit('todo','${id}','')">保存</button>`)}}

function quickNoteSort(){return (DB.quickNotes||[]).slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}
function editQuickNote(id=''){const x=(DB.quickNotes||[]).find(x=>x.id===id);modal(x?'编辑便签':'新增便签',`<div class="field"><label>标题（可选）</label><input id="mNoteTitle" value="${esc(x?.title||'')}"></div><div class="field"><label>想法 / 灵感</label><textarea id="mNoteText" style="min-height:180px">${esc(x?.text||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitQuickNote('${id}')">保存</button>`)}
function commitQuickNote(id){const text=$('#mNoteText').value.trim(),title=$('#mNoteTitle').value.trim();if(!text&&!title)return toast('请写一点内容');const a=DB.quickNotes||[],i=a.findIndex(x=>x.id===id),now=Date.now(),obj=i>=0?{...a[i],title,text,updatedAt:now}:{id:uid(),title,text,createdAt:now,updatedAt:now};if(i>=0)a[i]=obj;else a.push(obj);save(true);closeModal();renderHome();toast('便签已保存')}
function deleteQuickNote(id){const a=DB.quickNotes||[],i=a.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这张便签？',()=>{pushRecycle('quickNote',a[i]);a.splice(i,1);save(true);renderHome()})}
function convertQuickNoteToTodo(id){const x=(DB.quickNotes||[]).find(x=>x.id===id);if(!x)return;const title=(x.title||x.text||'').trim().split(/\n/)[0].slice(0,80);modal('便签转为待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(title)}"></div><div class="field"><label>类型（必选）</label><select id="mTodoType"><option value="">请选择类型</option>${TODO_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${today()}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="17:00"></div></div><div class="note">原便签会继续保留，方便以后回看灵感来源。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitTodo()">转为待办</button>`)}

function renderHome(){const n=new Date(),week=getWeek(),prog=semesterProgress(),day=(n.getDay()+6)%7,ds=today();const todays=[];for(let p=1;p<=11;p++)todays.push(...effectiveEntriesForDate(week,day,p));const activeToday=todays.filter(e=>!e._holiday&&!e._stopped);let lessonCount=0;for(let d=0;d<7;d++)for(let p=1;p<=11;p++)lessonCount+=effectiveEntriesForDate(week,d,p).filter(e=>!e._holiday&&!e._stopped).length;const countdowns=DB.holidays.slice().sort((a,b)=>{const da=daysLeft(a.date),db=daysLeft(b.date),af=da>=0,bf=db>=0;if(af!==bf)return af?-1:1;return af?da-db:db-da});const soonSpecial=(DB.schedule.specialDays||[]).filter(x=>{const d=daysLeft(x.date);return d>=0&&d<=7}).sort((a,b)=>a.date.localeCompare(b.date));const todoItems=visibleHomeTodoItems(n),unfinishedTodos=todoItems.length,notes=quickNoteSort();$('#content').innerHTML=`<div class="hero"><div><div class="hero-date">${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日</div><div class="hero-meta"><span class="pill">第 ${week} 教学周</span><span class="pill">${DB.settings.school||'未设置学校'}</span><span class="pill">学期进度 ${prog}%</span></div></div><div class="hero-time" id="clock">${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}</div></div><div class="grid four"><div class="card metric"><span class="subtle">本周课量</span><b>${lessonCount} 节</b></div><div class="card metric"><span class="subtle">今日课程</span><b>${activeToday.length} 节</b></div><div class="card metric"><span class="subtle">未完成待办</span><b>${unfinishedTodos} 项</b></div><div class="card metric"><span class="subtle">学期进度</span><b>${prog}%</b><div class="progress"><i style="width:${prog}%"></i></div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">To do list</h3><span class="seal todo-seal">待办</span><span class="spacer"></span><button class="btn primary small" onclick="addTodo()">新增任务</button></div><div class="todo-list home-todo-scroll">${todoItems.length?todoItems.map(t=>{const od=homeTodoExpired(t,n),odays=overdueDays(t,n);return `<div class="todo ${od?'overdue':''}"><button class="check" onclick="toggleHomeTodo('${t._source}','${t.id}','${t._cat||''}')"></button><div class="todo-main"><div class="todo-title">${esc(t.title)}${od?`<span class="todo-overdue-tag">逾期${odays}天</span>`:''}</div><div class="todo-meta"><span class="pill todo-type">${esc(t.type||'未分类')}</span> 截止 ${esc(t.deadline||'未设日期')} ${esc(t.time||'')}${t._source==='project'?` · 来自${esc(t._cat)}`:''}</div></div><div class="mini-actions"><button class="btn small" onclick="editHomeTodo('${t._source}','${t.id}','${t._cat||''}')">编辑</button><button class="btn small red" onclick="deleteHomeTodo('${t._source}','${t.id}','${t._cat||''}')">删除</button></div></div>`}).join(''):empty('暂无未完成任务')}</div></div><div class="card"><div class="toolbar"><h3 style="margin:0">假期倒计时</h3><span class="seal">盼</span><span class="spacer"></span><button class="btn small" onclick="addHoliday()">新增</button></div><div class="home-countdown-scroll">${countdowns.length?countdowns.map(h=>{const d=daysLeft(h.date);return `<div class="countdown"><div><b>${esc(h.name)}</b><div class="subtle">${esc(h.date)}</div></div><div class="countdown-actions"><div class="days">${d>=0?d+'天':'已过'}</div><button class="btn small red" onclick="deleteHoliday('${h.id}')">删除</button></div></div>`}).join(''):empty()}</div></div></div><div class="card" style="margin-top:16px"><div class="toolbar"><h3 style="margin:0">便签 · 灵感</h3><span class="seal">记</span><span class="spacer"></span><button class="btn primary small" onclick="editQuickNote()">新增便签</button></div><div class="quick-note-scroll">${notes.length?notes.map(x=>`<div class="quick-note-item"><div>${x.title?`<b>${esc(x.title)}</b>`:''}<div class="quick-note-text">${esc(x.text||'')}</div><div class="quick-note-meta">更新于 ${new Date(x.updatedAt||x.createdAt||Date.now()).toLocaleString()}</div></div><div class="mini-actions" style="margin-top:8px"><button class="btn small" onclick="convertQuickNoteToTodo('${x.id}')">转为待办</button><button class="btn small" onclick="editQuickNote('${x.id}')">编辑</button><button class="btn small red" onclick="deleteQuickNote('${x.id}')">删除</button></div></div>`).join(''):empty('随手记录课堂想法、活动灵感或临时事项')}</div></div><div class="card" style="margin-top:16px"><div class="toolbar"><h3 style="margin:0">近期调休 / 特殊教学日</h3><span class="seal">调</span><span class="spacer"></span><button class="btn small" onclick="go('schedule');setTimeout(()=>openSpecialDayManager(),0)">管理</button></div>${soonSpecial.length?soonSpecial.map(x=>`<div class="special-summary"><div><b>${esc(x.date)} · ${esc(specialTypeLabel(x.type))}</b><div class="subtle">${esc(specialDayRecordLabel(x))}${x.note?` · ${esc(x.note)}`:''}</div></div><span class="pill">${daysLeft(x.date)===0?'今天':daysLeft(x.date)+'天后'}</span></div>`).join(''):empty('未来7天暂无调休或特殊教学日')}</div><div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">今日课表</h3><span class="spacer"></span><button class="btn small" onclick="go('schedule')">查看课表</button></div>${todays.length?todays.map(e=>`<div class="schedule-today" style="${(e._holiday||e._stopped)?'opacity:.5':''}"><div class="period">${periodBadgeText(e.period)}</div><div><b>${esc(e.className)}</b><div class="subtle">${esc(e.grade)}${e.grade==='校务'?` · ${esc(schoolAdminCategory(e))}`:''} · ${esc(e.subject)} · ${periodSlotLabel(e.period)} · ${esc(scheduleEntryTime(e))}${e._mapped?' · 调休映射':''}${e._stopped?' · 临时停课':''}${e._holiday&&!e._mapped?' · 放假':''}</div></div></div>`).join(''):empty('今日暂无课程')}</div><div class="card"><div class="toolbar"><h3 style="margin:0">数据状态</h3><span class="spacer"></span><button class="btn small" onclick="go('settings')">同步设置</button></div><div class="note"><b>${cloudReady()?'云端同步已启用':'当前为本机保存'}</b><div class="subtle">${cloudReady()?esc(cloudStatusText()):'数据已自动写入本机 IndexedDB；配置云端后可跨设备同步。'}</div></div><div class="subtle" style="margin-top:10px">本机数据约 ${fmtBytes(storageUsage())}</div></div></div>`}

function renderSeats(){const a=currentArt();a.seats.cols=2;const {rows,cells}=a.seats;$('#artBody').innerHTML=`<div class="toolbar"><label>排数</label><input id="seatRows" type="number" min="1" max="40" value="${rows}" style="width:72px"><span class="pill">固定两列</span><button class="btn" onclick="resizeSeats()">调整座位</button><button class="btn primary" onclick="randomSeats()">随机排座</button><button class="btn" onclick="exportSeatsPng()">导出图片</button><button class="btn" onclick="printSeats()">打印 / PDF</button></div><div class="seat-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${cells.map((id,i)=>{const si=a.students.findIndex(s=>s.id===id);return `<div class="seat" onclick="pickSeat(${i})"><span>${id&&si>=0?esc(privacyName(a.students[si].name,si)):'空座位'}</span></div>`}).join('')}</div>`}
function seatExportRows(){const a=currentArt(),cls=DB.classes.find(c=>c.id===S.classId),rows=[];for(let r=0;r<a.seats.rows;r++){rows.push([0,1].map(col=>{const id=a.seats.cells[r*2+col],s=a.students.find(x=>x.id===id);return s?.name||'空座位'}))}return{title:`${cls?.name||'班级'} 座位表`,rows}}
function exportSeatsPng(){const d=seatExportRows(),w=900,rowH=72,pad=55,head=100,h=head+d.rows.length*rowH+pad,cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');c.fillStyle='#fffaf0';c.fillRect(0,0,w,h);c.fillStyle='#2b2b2b';c.textAlign='center';c.font='bold 30px serif';c.fillText(d.title,w/2,48);c.font='16px serif';c.fillStyle='#606060';c.fillText('讲台 / 黑板方向',w/2,78);const gap=28,colW=(w-pad*2-gap)/2;d.rows.forEach((row,ri)=>row.forEach((name,ci)=>{const x=pad+ci*(colW+gap),y=head+ri*rowH;c.strokeStyle='#7a7468';c.strokeRect(x,y,colW,rowH-12);c.fillStyle='#2b2b2b';c.font='22px serif';c.fillText(name,x+colW/2,y+35)}));const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`${d.title}.png`;a.click();toast('座位表图片已导出')}
function printSeats(){const d=seatExportRows(),w=window.open('','_blank');if(!w)return toast('浏览器阻止了打印窗口');w.document.write(`<!doctype html><meta charset="utf-8"><title>${esc(d.title)}</title><style>body{font-family:serif;margin:30px;color:#222}h1{text-align:center}.front{text-align:center;margin:8px auto 20px;color:#666}.seatprint{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;max-width:700px;margin:auto}.seatprint div{border:1px solid #888;padding:16px;text-align:center;font-size:18px}</style><h1>${esc(d.title)}</h1><div class="front">讲台 / 黑板方向</div><div class="seatprint">${d.rows.flat().map(x=>`<div>${esc(x)}</div>`).join('')}</div>`);w.document.close();setTimeout(()=>w.print(),250)}

function attendanceMonthValue(){return S.attMonth||String(S.attDate||today()).slice(0,7)}
function moveAttendanceMonth(n){const [y,m]=attendanceMonthValue().split('-').map(Number),d=new Date(y,m-1+n,1);S.attMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderArtClass()}
function attendanceCalendarHtml(a){const ym=attendanceMonthValue(),[y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=isoDate(d),dim=d.getMonth()!==m-1,has=Object.keys(a.attendance?.[ds]||{}).length>0;cells+=`<button class="att-day ${dim?'dim':''} ${has?'has-record':''} ${ds===S.attDate?'active':''}" onclick="S.attDate='${ds}';S.attMonth='${ds.slice(0,7)}';renderArtClass()">${d.getDate()}</button>`}return `<div class="att-month-head"><button class="btn small" onclick="moveAttendanceMonth(-1)">‹</button><b>${y}年${m}月</b><button class="btn small" onclick="moveAttendanceMonth(1)">›</button></div><div class="att-calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="att-cal-head">${x}</div>`).join('')}${cells}</div><div class="subtle" style="margin-top:8px">朱红日期表示该日已有考勤记录。</div>`}
function renderAttendance(){const a=currentArt(),date=S.attDate||today();S.attDate=date;S.attMonth=S.attMonth||date.slice(0,7);a.attendance[date]??={};const rec=a.attendance[date],counts={present:0,late:0,absent:0,leave:0};Object.values(rec).forEach(s=>counts[s]=(counts[s]||0)+1);$('#artBody').innerHTML=`<div class="att-layout"><div class="card" style="box-shadow:none">${attendanceCalendarHtml(a)}</div><div><div class="toolbar"><input type="date" value="${date}" onchange="S.attDate=this.value;S.attMonth=this.value.slice(0,7);renderArtClass()" style="width:auto"><button class="btn primary" onclick="markAllPresent()">一键整班全勤</button><button class="btn red" onclick="clearAttendanceDay()">清除当日考勤</button>${S.lastClearedAttendance?.classId===S.classId?`<button class="btn" onclick="undoClearAttendance()">撤销清除</button>`:''}<button class="btn" onclick="exportAttendance()">导出CSV</button></div><div class="statbar" style="margin-bottom:14px">${Object.keys(STATUS).map(k=>`<span class="statbox">${STATUS[k]} ${counts[k]||0}</span>`).join('')}</div>${a.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>学生</th><th>状态</th></tr></thead><tbody>${a.students.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(privacyName(s.name,i))}</td><td><div class="statuses">${Object.entries(STATUS).map(([k,v])=>`<button class="status ${k} ${rec[s.id]===k?'on':''}" onclick="setAttendance('${s.id}','${k}')">${v}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`:empty()}</div></div>`}
function clearAttendanceDay(){const a=currentArt(),date=S.attDate,rec=a.attendance[date]||{};if(!Object.keys(rec).length)return toast('当日暂无考勤记录');askConfirmNoRecycle(`确认清除当前班级 ${date} 的全部考勤记录？`,()=>{S.lastClearedAttendance={classId:S.classId,date,data:JSON.parse(JSON.stringify(rec))};delete a.attendance[date];save(true);renderArtClass();toast('当日考勤已清除，可点击“撤销清除”恢复')})}
function undoClearAttendance(){const x=S.lastClearedAttendance;if(!x||x.classId!==S.classId)return;const a=currentArt();a.attendance[x.date]=x.data;S.attDate=x.date;S.attMonth=x.date.slice(0,7);S.lastClearedAttendance=null;save(true);renderArtClass();toast('考勤记录已恢复')}

function clubAttendanceStats(c,sid){const dates=Object.keys(c.attendance||{}).filter(d=>(c.attendance[d]||{})[sid]);const cnt={present:0,late:0,leave:0,absent:0};dates.forEach(d=>{const v=c.attendance[d][sid];if(cnt[v]!=null)cnt[v]++});const total=dates.length,rate=total?(cnt.present+cnt.late)/total*100:0;return{total,...cnt,rate}}
function renderClubDetail(){const c=club();const tabs=[['students','学生名单'],['attendance','社团考勤'],['plans','社团课程'],['activities','社团活动记录'],['ideas','社团活动灵感']];if(!tabs.some(t=>t[0]===S.clubTab))S.clubTab='students';$('#content').innerHTML=pageHead(c.name,'独立社团空间 · 数据与其他社团互不干扰',`<button class="btn" onclick="S.clubId=null;renderClubs()">返回社团列表</button>`)+`<div class="card"><div class="tabs">${tabs.map(t=>`<button class="tab ${S.clubTab===t[0]?'active':''}" onclick="S.clubTab='${t[0]}';renderClubDetail()">${t[1]}</button>`).join('')}</div><div id="clubBody"></div></div>`;({students:renderClubStudents,attendance:renderClubAttendance,plans:renderClubPlans,activities:renderClubActivities,ideas:renderClubIdeas}[S.clubTab]||renderClubStudents)()}
function renderClubStudents(){const c=club();$('#clubBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editClubStudent()">新增学生</button><button class="btn" onclick="importClubStudents()">Excel复制粘贴导入</button><button class="btn" onclick="exportClubStudents()">完整导出CSV</button><button class="btn" onclick="exportClubAttendance()">导出考勤CSV</button></div>${c.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>特长标签</th><th>备注</th><th>出勤率</th><th>美术课对应</th><th>操作</th></tr></thead><tbody>${c.students.map((s,i)=>{const m=artStudentMatchForClubStudent(s),st=clubAttendanceStats(c,s.id);return`<tr><td>${i+1}</td><td>${esc(privacyName(s.name,i))}</td><td>${esc(s.className||'')}</td><td>${(s.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')||'—'}</td><td>${esc(s.note||'')}</td><td><span class="attendance-rate">${st.total?st.rate.toFixed(1)+'%':'—'}</span><div class="subtle">${st.present}勤 · ${st.late}迟 · ${st.leave}假 · ${st.absent}缺</div></td><td>${m?`<span class="pill">已关联 ${esc(m.className)}</span>`:'<span class="subtle">未关联</span>'}</td><td><button class="btn small" onclick="editClubStudent('${s.id}')">编辑</button> <button class="btn small red" onclick="deleteClubStudent('${s.id}')">删除</button></td></tr>`}).join('')}</tbody></table></div>`:empty('暂无数据，点击添加')}`}
function clubAttendanceMonthValue(){return S.clubAttMonth||String(S.clubAttDate||today()).slice(0,7)}
function moveClubAttendanceMonth(n){const [y,m]=clubAttendanceMonthValue().split('-').map(Number),d=new Date(y,m-1+n,1);S.clubAttMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;renderClubDetail()}
function clubAttendanceCalendarHtml(c){const ym=clubAttendanceMonthValue(),[y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=isoDate(d),dim=d.getMonth()!==m-1,has=Object.keys(c.attendance?.[ds]||{}).length>0;cells+=`<button class="att-day ${dim?'dim':''} ${has?'has-record':''} ${ds===S.clubAttDate?'active':''}" onclick="S.clubAttDate='${ds}';S.clubAttMonth='${ds.slice(0,7)}';renderClubDetail()">${d.getDate()}</button>`}return `<div class="att-month-head"><button class="btn small" onclick="moveClubAttendanceMonth(-1)">‹</button><b>${y}年${m}月</b><button class="btn small" onclick="moveClubAttendanceMonth(1)">›</button></div><div class="att-calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="att-cal-head">${x}</div>`).join('')}${cells}</div><div class="subtle" style="margin-top:8px">朱红日期表示该日已有社团考勤。</div>`}
function renderClubAttendance(){const c=club(),date=S.clubAttDate||today();S.clubAttDate=date;S.clubAttMonth=S.clubAttMonth||date.slice(0,7);c.attendance??={};c.attendance[date]??={};const rec=c.attendance[date],counts={present:0,late:0,absent:0,leave:0};Object.values(rec).forEach(v=>counts[v]=(counts[v]||0)+1);$('#clubBody').innerHTML=`<div class="att-layout"><div class="card" style="box-shadow:none">${clubAttendanceCalendarHtml(c)}</div><div><div class="toolbar"><input type="date" value="${date}" onchange="S.clubAttDate=this.value;S.clubAttMonth=this.value.slice(0,7);renderClubDetail()" style="width:auto"><button class="btn primary" onclick="markClubAllPresent()">一键全勤</button><button class="btn red" onclick="clearClubAttendanceDay()">清除当日</button><button class="btn" onclick="exportClubAttendance()">导出考勤CSV</button></div><div class="note" style="margin-bottom:10px">建议每次考勤先点“一键全勤”，再修改迟到、请假和缺勤，个人累计出勤率会更完整。</div><div class="statbar" style="margin-bottom:14px">${Object.keys(STATUS).map(k=>`<span class="statbox">${STATUS[k]} ${counts[k]||0}</span>`).join('')}</div>${c.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>学生</th><th>班级</th><th>状态</th><th>累计出勤率</th></tr></thead><tbody>${c.students.map((s,i)=>{const st=clubAttendanceStats(c,s.id);return `<tr><td>${i+1}</td><td>${esc(privacyName(s.name,i))}</td><td>${esc(s.className||'')}</td><td><div class="statuses">${Object.entries(STATUS).map(([k,v])=>`<button class="status ${k} ${rec[s.id]===k?'on':''}" onclick="setClubAttendance('${s.id}','${k}')">${v}</button>`).join('')}</div></td><td><span class="attendance-rate">${st.total?st.rate.toFixed(1)+'%':'—'}</span></td></tr>`}).join('')}</tbody></table></div>`:empty()}</div></div>`}
function setClubAttendance(id,status){const c=club();c.attendance[S.clubAttDate]??={};c.attendance[S.clubAttDate][id]=status;save(true);renderClubDetail()}
function markClubAllPresent(){const c=club();c.attendance[S.clubAttDate]=Object.fromEntries(c.students.map(s=>[s.id,'present']));save(true);renderClubDetail();toast('社团已整班标记全勤')}
function clearClubAttendanceDay(){const c=club(),date=S.clubAttDate,rec=c.attendance[date]||{};if(!Object.keys(rec).length)return toast('当日暂无社团考勤');askConfirmNoRecycle(`确认清除 ${c.name} ${date} 的考勤？`,()=>{delete c.attendance[date];save(true);renderClubDetail();toast('已清除当日社团考勤')})}
function exportClubAttendance(){const c=club(),rows=[['姓名','班级','应考勤次数','出勤','迟到','请假','缺勤','出勤率']];c.students.forEach(s=>{const st=clubAttendanceStats(c,s.id);rows.push([s.name,s.className||'',st.total,st.present,st.late,st.leave,st.absent,st.total?st.rate.toFixed(1)+'%':''])});csvDownload(`${c.name}-社团考勤汇总.csv`,rows)}

function exportClubStudents(){const c=club(),rows=[['所属社团','姓名','班级','社团特长标签','社团备注','应考勤次数','出勤','迟到','请假','缺勤','出勤率','美术课社团活动标签','美术特长标签','美术历次评语','特长学生','特殊学生','课堂作品简要信息']];c.students.forEach(s=>{const m=artStudentMatchForClubStudent(s),a=m?.student,st=clubAttendanceStats(c,s.id);rows.push([c.name,s.name,s.className,(s.tags||[]).join('；'),s.note||'',st.total,st.present,st.late,st.leave,st.absent,st.total?st.rate.toFixed(1)+'%':'',a?studentClubTags(a,m.classId).join('；'):'',a?(a.tags||[]).join('；'):'',a?.comments||'',a?.featured?'是':'否',a?.special?'是':'否',a?.artwork||''])});csvDownload(`${c.name}-学生名单完整导出.csv`,rows)}

function projectFileTypeOptions(sel=''){return ['工作计划','会议记录','工作总结','通知方案','活动材料','其他'].map(x=>`<option value="${x}" ${sel===x?'selected':''}>${x}</option>`).join('')}
function currentSchoolYearLabel(){const y=academicStartYear();return `${y}—${y+1}`}
function renderProjectFiles(p){const type=S.projectFileType||'全部',year=S.projectFileYear||'全部',files=(p.files||[]).filter(f=>(type==='全部'||f.category===type)&&(year==='全部'||f.schoolYear===year)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),years=[...new Set((p.files||[]).map(f=>f.schoolYear).filter(Boolean))].sort().reverse();return `<div class="project-file-filter"><select onchange="S.projectFileType=this.value;renderProjects()"><option>全部</option>${['工作计划','会议记录','工作总结','通知方案','活动材料','其他'].map(x=>`<option ${type===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="S.projectFileYear=this.value;renderProjects()"><option>全部</option>${years.map(x=>`<option ${year===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn small" onclick="exportProjectFileIndex()">导出索引CSV</button></div>${files.length?files.map(f=>{const task=(p.tasks||[]).find(t=>t.id===f.taskId);return `<div class="project-file-row"><div><div class="project-file-title">${esc(f.title||f.name)}</div><div class="project-file-meta">${esc(f.category)} · ${esc(f.date||'')} · ${esc(f.schoolYear||'未标学年度')} · ${fmtBytes(f.size||0)} <span class="cloud-ok">☁ 已存私有云端</span>${task?`<br>关联任务：${esc(task.title)}`:''}${f.tags?.length?`<br>标签：${f.tags.map(esc).join('、')}`:''}${f.note?`<br>${esc(f.note)}`:''}</div></div><div class="mini-actions"><button class="btn small" onclick="downloadAttachment('${f.id}')">下载</button><button class="btn small" onclick="editProjectFileMeta('${f.id}')">编辑信息</button><button class="btn small red" onclick="deleteProjectFile('${f.id}')">删除</button></div></div>`}).join(''):empty('暂无符合条件的部门档案')}`}
function renderProjects(){const cats=['党政中心','融媒体中心','美育中心'];if(!DB.projects[S.projectCat])DB.projects[S.projectCat]={tasks:[],notes:[],progress:[],files:[]};const p=DB.projects[S.projectCat];p.files??=[];$('#content').innerHTML=pageHead('项目中心','部门任务与历史档案统一归档；首页待办与部门任务双向同步')+`<div class="tabs">${cats.map(c=>`<button class="tab ${S.projectCat===c?'active':''}" onclick="S.projectCat='${c}';S.projectFileType='全部';S.projectFileYear='全部';renderProjects()">${c}</button>`).join('')}</div><div class="project-layout"><div class="card"><div class="toolbar"><h3 style="margin:0">待办清单</h3><span class="spacer"></span><button class="btn primary small" onclick="addProjectTask()">新增</button></div>${p.tasks.length?p.tasks.slice().sort((a,b)=>(a.done-b.done)||(a.deadline||'9999').localeCompare(b.deadline||'9999')).map(t=>{const od=!t.done&&daysLeft(t.deadline)<0;return `<div class="todo ${od?'overdue':''} ${t.done?'done':''}"><button class="check ${t.done?'on':''}" onclick="toggleProjectTask('${t.id}')">${t.done?'✓':''}</button><div class="todo-main"><b>${esc(t.title)}</b><div class="subtle">${esc(t.deadline||'未设日期')} ${esc(t.time||'')} · ${t.repeat==='daily'?'每日重复':t.repeat==='weekly'?'每周重复':'不重复'}${t.source==='home'?' · 首页创建':''}</div></div><div class="mini-actions"><button class="btn small" onclick="editProjectTask('${t.id}')">编辑</button><button class="btn small red" onclick="deleteProjectTask('${t.id}')">删除</button></div></div>`}).join(''):empty()}</div><div class="card"><div class="toolbar"><h3 style="margin:0">部门便签</h3><span class="spacer"></span><button class="btn primary small" onclick="addProjectNote()">新增</button></div>${p.notes.length?p.notes.map(n=>`<div class="note" style="margin-bottom:9px"><div>${esc(n.text)}</div><div class="mini-actions" style="margin-top:8px"><button class="btn small" onclick="editProjectNote('${n.id}')">编辑</button><button class="btn small red" onclick="deleteProjectNote('${n.id}')">删除</button></div></div>`).join(''):empty()}</div><div class="card"><div class="toolbar"><h3 style="margin:0">文件管理</h3><span class="pill">私有云端</span><span class="spacer"></span><button class="btn primary small" onclick="uploadProjectFileDialog()">上传档案</button></div><div class="note" style="margin-bottom:10px">可归档历史工作计划、会议记录、工作总结、通知方案、活动材料等。文件本体存入 Supabase 私有 Storage；工作台仅保存索引信息。前端不设置单文件大小上限，以云端平台实际限制为准。</div>${renderProjectFiles(p)}</div></div>`}
function addProjectTask(){editProjectTask('')}
function editProjectTask(id=''){const x=DB.projects[S.projectCat].tasks.find(x=>x.id===id);modal(x?'编辑项目待办':'新增项目待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(x?.title||'')}"></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(x?.deadline||today())}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="${esc(x?.time||'17:00')}"></div></div><div class="field"><label>重复</label><select id="mRepeat"><option value="none" ${!x||x.repeat==='none'?'selected':''}>不重复</option><option value="daily" ${x?.repeat==='daily'?'selected':''}>每日</option><option value="weekly" ${x?.repeat==='weekly'?'selected':''}>每周</option></select></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitProjectTask('${id}')">保存</button>`)}
function commitProjectTask(id=''){const title=$('#mTitle').value.trim();if(!title)return toast('请填写任务');const a=DB.projects[S.projectCat].tasks,x=a.find(x=>x.id===id),obj=x||{id:uid(),done:false,source:'project'};obj.title=title;obj.deadline=$('#mDate').value;obj.time=$('#mTime').value;obj.repeat=$('#mRepeat').value;if(!x)a.push(obj);save(true);closeModal();renderProjects();toast(id?'项目待办已更新':'项目待办已添加，总览将同步显示')}
function toggleProjectTask(id){const a=DB.projects[S.projectCat].tasks,t=a.find(x=>x.id===id);if(!t)return;const was=t.done;t.done=!t.done;if(!was&&t.done&&t.repeat!=='none'){const d=new Date(t.deadline+'T00:00:00');d.setDate(d.getDate()+(t.repeat==='daily'?1:7));const nd=isoDate(d);if(!a.some(x=>x.title===t.title&&x.deadline===nd&&!x.done))a.push({id:uid(),title:t.title,deadline:nd,time:t.time||'',repeat:t.repeat,done:false,source:t.source||'project'})}save(true);renderProjects()}
function uploadProjectFileDialog(){if(!cloudReady())return toast('文件档案需要先登录云端账号后上传');const p=DB.projects[S.projectCat],tasks=(p.tasks||[]).filter(x=>!x.done);modal('上传部门档案',`<div class="field"><label>选择文件</label><input id="mProjectFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png"></div><div class="grid two"><div class="field"><label>档案标题</label><input id="mFileTitle" placeholder="默认使用文件名"></div><div class="field"><label>文件类型</label><select id="mFileCategory">${projectFileTypeOptions('其他')}</select></div></div><div class="grid two"><div class="field"><label>日期</label><input id="mFileDate" type="date" value="${today()}"></div><div class="field"><label>学年度</label><input id="mSchoolYear" value="${esc(currentSchoolYearLabel())}" placeholder="如 2026—2027"></div></div><div class="field"><label>标签（逗号分隔）</label><input id="mFileTags"></div><div class="field"><label>关联任务（可选）</label><select id="mFileTask"><option value="">不关联任务</option>${tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label>备注</label><textarea id="mFileNote"></textarea></div><div class="note">不设置前端单文件大小限制；若超出 Supabase 当前套餐或项目允许的上传大小，云端会返回提示。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitProjectFileUpload()">上传到私有云端</button>`)}
async function commitProjectFileUpload(){const file=$('#mProjectFile')?.files?.[0];if(!file)return toast('请选择文件');if(!cloudReady())return toast('请先登录云端');const id=uid(),cat=S.projectCat,path=`${Cloud.session.user.id}/project-files/${cat}/${id}-${safeFileName(file.name)}`;try{toast('正在上传档案…');await cloudFetch(`/storage/v1/object/${encodeURIComponent(Cloud.cfg.bucket||'art-teacher-files')}/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});const obj={id,name:file.name,title:$('#mFileTitle').value.trim()||file.name,category:$('#mFileCategory').value,date:$('#mFileDate').value,schoolYear:$('#mSchoolYear').value.trim(),tags:$('#mFileTags').value.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean),note:$('#mFileNote').value.trim(),taskId:$('#mFileTask').value||'',type:file.type||'application/octet-stream',size:file.size,cloudPath:path,uploadedAt:new Date().toISOString()};DB.projects[cat].files.push(obj);save(true);closeModal();renderProjects();toast('档案已上传到私有云端')}catch(e){toast('上传失败：'+e.message)}}
function editProjectFileMeta(id){const p=DB.projects[S.projectCat],f=p.files.find(x=>x.id===id);if(!f)return;modal('编辑档案信息',`<div class="field"><label>档案标题</label><input id="mFileTitle" value="${esc(f.title||f.name)}"></div><div class="grid two"><div class="field"><label>文件类型</label><select id="mFileCategory">${projectFileTypeOptions(f.category)}</select></div><div class="field"><label>日期</label><input id="mFileDate" type="date" value="${esc(f.date||'')}"></div></div><div class="field"><label>学年度</label><input id="mSchoolYear" value="${esc(f.schoolYear||'')}"></div><div class="field"><label>标签</label><input id="mFileTags" value="${esc((f.tags||[]).join('，'))}"></div><div class="field"><label>关联任务</label><select id="mFileTask"><option value="">不关联任务</option>${(p.tasks||[]).map(t=>`<option value="${t.id}" ${f.taskId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label>备注</label><textarea id="mFileNote">${esc(f.note||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitProjectFileMeta('${id}')">保存</button>`)}
function commitProjectFileMeta(id){const f=DB.projects[S.projectCat].files.find(x=>x.id===id);if(!f)return;f.title=$('#mFileTitle').value.trim()||f.name;f.category=$('#mFileCategory').value;f.date=$('#mFileDate').value;f.schoolYear=$('#mSchoolYear').value.trim();f.tags=$('#mFileTags').value.split(/[,，;；]/).map(x=>x.trim()).filter(Boolean);f.taskId=$('#mFileTask').value||'';f.note=$('#mFileNote').value.trim();save(true);closeModal();renderProjects();toast('档案信息已更新')}
function deleteProjectFile(id){const a=DB.projects[S.projectCat].files,i=a.findIndex(x=>x.id===id);if(i<0)return;askConfirm('从文件管理中移除这份档案？云端文件会继续保留，以便从回收站恢复索引。',()=>{pushRecycle('projectFile',a[i],{cat:S.projectCat});a.splice(i,1);save(true);renderProjects();toast('档案索引已移入回收站')})}
function exportProjectFileIndex(){const p=DB.projects[S.projectCat],rows=[['部门','文件类型','档案标题','原文件名','日期','学年度','标签','备注','关联任务','文件大小','云端状态']];(p.files||[]).forEach(f=>{const t=(p.tasks||[]).find(x=>x.id===f.taskId);rows.push([S.projectCat,f.category,f.title||f.name,f.name,f.date,f.schoolYear,(f.tags||[]).join('；'),f.note||'',t?.title||'',f.size||0,f.cloudPath?'已同步':'未同步'])});csvDownload(`${S.projectCat}-档案索引.csv`,rows)}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.altKey&&/^[1-8]$/.test(e.key)){e.preventDefault();const n=navs[+e.key-1];if(n)go(n[0])}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='l'){e.preventDefault();lockNow()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&DB?.settings?.lockOnLeave&&DB.settings.passwordHash)S.locked=true;else if(!document.hidden&&S.locked&&!$('#lockLayer'))renderLock()});
async function initApp(){Cloud.cfg=loadCloudConfig();Cloud.session=loadCloudSession();try{const ui=JSON.parse(SafeStore.get(UI_KEY)||'{}');if(ui.theme)document.documentElement.dataset.theme=ui.theme}catch{}await load();document.documentElement.dataset.theme=DB.settings.theme||'light';shell();startCloudPolling();if(cloudReady())setTimeout(()=>cloudSyncNow().catch(()=>{}),700)}
window.addEventListener('online',()=>{toast('网络已恢复，准备同步');cloudSyncNow().catch(()=>{})});window.addEventListener('focus',()=>{if(cloudReady())cloudSyncNow().catch(()=>{})});initApp().catch(e=>{console.error(e);document.body.innerHTML='<div style="padding:30px;font-family:serif;background:#f7f2e7;color:#2b2b2b;min-height:100vh"><h2>工作台初始化失败</h2><p>'+String(e&&e.message||e)+'</p><p>可尝试关闭 Safari 的“阻止所有 Cookie”后重新打开。</p></div>'});
</script>
</body>
</html>
