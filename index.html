  document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar ${S.sideOpen?'open':''}" id="sidebar"><div class="sb-brand"><div class="zh">美術工作臺</div><div class="en">ART TEACHER WORKBENCH</div></div><div class="me"><label class="avatar-wrap" title="点击更换 JPG 头像"><img class="avatar" src="${DB.settings.avatar||tinyJpg}"><span class="av-edit">＋</span><input type="file" accept="image/jpeg,.jpg,.jpeg" hidden onchange="changeAvatar(this.files[0])"></label><div class="nm">${esc(DB.settings.teacherName||'美术老师')}</div><div class="sc">${esc(DB.settings.school||'')}</div></div><nav class="nav">${navs.map(n=>`<button class="${S.route===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="icon">${n[2]}</span>${n[1]}</button>`).join('')}</nav><div class="side-foot">云端同步 · 自动保存<br>同一账号，多端共用</div></aside><div class="backdrop ${S.sideOpen?'show':''}" onclick="toggleSide()"></div><main class="main"><header class="topbar"><button class="hamb" onclick="toggleSide()">☰</button><div class="tb-title">${esc(currentNav[1])}<small>美术教师智能工作台</small></div><div class="tb-actions"><span id="syncBadge" class="pill sync-badge" onclick="go('settings')">云端未配置</span><button class="btn mini" onclick="togglePrivacy()">${DB.settings.privacy?'显示姓名':'隐私模式'}</button><button class="btn mini" onclick="toggleTheme()">${DB.settings.theme==='dark'?'☀ 日卷':'☾ 夜卷'}</button><button class="btn mini" onclick="lockNow()">锁屏</button></div></header><section class="content" id="content"></section></main></div>`;
  renderRoute();shellSyncBadge(); if(S.locked)renderLock();
}
function go(r){S.route=r;S.sideOpen=false;shell()}
function toggleSide(){S.sideOpen=!S.sideOpen;$('#sidebar')?.classList.toggle('open',S.sideOpen);document.querySelector('.backdrop')?.classList.toggle('show',S.sideOpen)}
function toggleTheme(){DB.settings.theme=DB.settings.theme==='dark'?'light':'dark';save(true);shell();toast(DB.settings.theme==='dark'?'已切换深色书卷模式':'已切换浅色书卷模式')}
function togglePrivacy(){DB.settings.privacy=!DB.settings.privacy;save(true);shell();toast(DB.settings.privacy?'已隐藏学生真实姓名':'已显示学生真实姓名')}
function changeAvatar(file){if(!file)return;const ext=file.name.split('.').pop().toLowerCase();if(!['jpg','jpeg'].includes(ext)){toast('头像仅支持 JPG/JPEG');return}readJpgImage(file,800,.82,data=>{DB.settings.avatar=data;save(true);shell();toast('头像已更换')})}
function lockNow(){if(!DB.settings.passwordHash){toast('请先在设置中设置锁屏密码');go('settings');return}S.locked=true;renderLock()}
function renderLock(){document.body.insertAdjacentHTML('beforeend',`<div class="lock" id="lockLayer"><div class="card lock-card"><div class="lock-emblem">卷</div><h2>工作台已锁定</h2><p class="subtle">输入本机锁屏密码继续使用</p><div class="field"><input id="unlockPwd" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')unlock()"></div><button class="btn primary" style="width:100%" onclick="unlock()">解锁</button></div></div>`)}
function unlock(){const v=$('#unlockPwd')?.value||'';if(simpleHash(v)===DB.settings.passwordHash){S.locked=false;$('#lockLayer')?.remove();toast('已解锁')}else toast('密码不正确')}
function renderRoute(){const map={home:renderHome,schedule:renderSchedule,art:renderArtClass,teaching:renderTeaching,clubs:renderClubs,projects:renderProjects,summary:renderWorkSummary,settings:renderSettings,hobbies:renderHobbies};(map[S.route]||renderHome)()}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(desc||'')}</p></div><div class="mini-actions">${actions}</div></div>`}
function projectTodoType(cat){return cat==='党政中心'?'党政':cat==='融媒体中心'?'融媒体':cat==='美育中心'?'美育':'项目活动'}
function homeTodoItems(){
  const items=(DB.todos||[]).map(t=>({...t,_source:'todo',_cat:'',type:t.type||'未分类'}));
  Object.entries(DB.projects||{}).forEach(([cat,p])=>(p.tasks||[]).forEach(t=>items.push({...t,time:t.time||'',_source:'project',_cat:cat,type:projectTodoType(cat)})));
  return items.sort((a,b)=>(a.done-b.done)||(`${a.deadline||'9999-12-31'}${a.time||'23:59'}`).localeCompare(`${b.deadline||'9999-12-31'}${b.time||'23:59'}`));
}
function homeTodoExpired(t,now=new Date()){
  if(!t||t.done||!t.deadline)return false;
  const dt=new Date(`${t.deadline}T${t.time||'23:59'}`);
  return !Number.isNaN(dt.getTime())&&dt<now;
}
function visibleHomeTodoItems(now=new Date()){return homeTodoItems().filter(t=>!t.done&&!homeTodoExpired(t,now))}
function toggleHomeTodo(source,id,cat=''){
  if(source==='project'){
    const a=DB.projects?.[cat]?.tasks||[],t=a.find(x=>x.id===id);if(!t)return;
    const was=t.done;t.done=!t.done;
    if(!was&&t.done&&t.repeat&&t.repeat!=='none'){const d=new Date(t.deadline+'T00:00:00');d.setDate(d.getDate()+(t.repeat==='daily'?1:7));const nd=isoDate(d);if(!a.some(x=>x.title===t.title&&x.deadline===nd&&!x.done))a.push({id:uid(),title:t.title,deadline:nd,time:t.time||'',repeat:t.repeat,done:false,source:t.source||'project'})}
  }else{const t=(DB.todos||[]).find(x=>x.id===id);if(!t)return;t.done=!t.done}
  save(true);renderHome()
}
function editHomeTodo(source,id,cat=''){
  if(source==='project'){
    const t=(DB.projects?.[cat]?.tasks||[]).find(x=>x.id===id);if(!t)return;
    modal('编辑项目待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(t.title||'')}"></div><div class="field"><label>类型</label><input value="${esc(projectTodoType(cat))}" disabled><div class="subtle" style="margin-top:5px">项目类型由“${esc(cat)}”自动决定</div></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(t.deadline||'')}"></div><div class="field"><label>重复</label><select id="mRepeat"><option value="none" ${t.repeat==='none'||!t.repeat?'selected':''}>不重复</option><option value="daily" ${t.repeat==='daily'?'selected':''}>每日</option><option value="weekly" ${t.repeat==='weekly'?'selected':''}>每周</option></select></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHomeTodoEdit('project','${id}','${cat}')">保存</button>`)
  }else{
    const t=(DB.todos||[]).find(x=>x.id===id);if(!t)return;
    modal('编辑待办',`<div class="field"><label>任务</label><input id="mTitle" value="${esc(t.title||'')}"></div><div class="field"><label>类型（必选）</label><select id="mTodoType">${TODO_TYPES.map(x=>`<option value="${x}" ${t.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(t.deadline||'')}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="${esc(t.time||'17:00')}"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHomeTodoEdit('todo','${id}','')">保存</button>`)
  }
}
function commitHomeTodoEdit(source,id,cat=''){
  const title=$('#mTitle')?.value.trim();if(!title)return toast('请填写任务');
  if(source==='project'){
    const t=(DB.projects?.[cat]?.tasks||[]).find(x=>x.id===id);if(!t)return;
    t.title=title;t.deadline=$('#mDate')?.value||'';t.repeat=$('#mRepeat')?.value||'none';
  }else{
    const t=(DB.todos||[]).find(x=>x.id===id);if(!t)return;
    const type=$('#mTodoType')?.value||'';if(!TODO_TYPES.includes(type))return toast('请选择任务类型');
    t.title=title;t.type=type;t.deadline=$('#mDate')?.value||'';t.time=$('#mTime')?.value||'';
  }
  save(true);closeModal();renderHome();toast('待办已更新')
}
function deleteHomeTodo(source,id,cat=''){
  if(source==='project'){const a=DB.projects?.[cat]?.tasks||[],i=a.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这条项目待办？',()=>{pushRecycle('projectTask',a[i],{cat});a.splice(i,1);save(true);renderHome();toast('已移入回收站')})}
  else deleteTodo(id)
}
function renderHome(){
  const n=new Date(),week=getWeek(),prog=semesterProgress(),day=(n.getDay()+6)%7,ds=today();
  const todays=[];for(let p=1;p<=11;p++)todays.push(...effectiveEntriesForDate(week,day,p));
  const activeToday=todays.filter(e=>!e._holiday&&!e._stopped);
  let lessonCount=0;for(let d=0;d<7;d++)for(let p=1;p<=11;p++)lessonCount+=effectiveEntriesForDate(week,d,p).filter(e=>!e._holiday&&!e._stopped).length;
  const countdowns=DB.holidays.slice().sort((a,b)=>{const da=daysLeft(a.date),db=daysLeft(b.date),af=da>=0,bf=db>=0;if(af!==bf)return af?-1:1;return af?da-db:db-da});
  const soonSpecial=(DB.schedule.specialDays||[]).filter(x=>{const d=daysLeft(x.date);return d>=0&&d<=7}).sort((a,b)=>a.date.localeCompare(b.date));
  const todoItems=visibleHomeTodoItems(n),unfinishedTodos=todoItems.length;
  $('#content').innerHTML=`<div class="hero"><div><div class="hero-date">${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日</div><div class="hero-meta"><span class="pill">第 ${week} 教学周</span><span class="pill">${DB.settings.school||'未设置学校'}</span><span class="pill">学期进度 ${prog}%</span></div></div><div class="hero-time" id="clock">${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}</div></div>
  <div class="grid four"><div class="card metric"><span class="subtle">本周课量</span><b>${lessonCount} 节</b></div><div class="card metric"><span class="subtle">今日课程</span><b>${activeToday.length} 节</b></div><div class="card metric"><span class="subtle">未完成待办</span><b>${unfinishedTodos} 项</b></div><div class="card metric"><span class="subtle">学期进度</span><b>${prog}%</b><div class="progress"><i style="width:${prog}%"></i></div></div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">To do list</h3><span class="seal todo-seal">待办</span><span class="spacer"></span><button class="btn primary small" onclick="addTodo()">新增任务</button></div><div class="todo-list home-todo-scroll">${todoItems.length?todoItems.map(t=>`<div class="todo"><button class="check" onclick="toggleHomeTodo('${t._source}','${t.id}','${t._cat||''}')"></button><div class="todo-main"><div class="todo-title">${esc(t.title)}</div><div class="todo-meta"><span class="pill todo-type">${esc(t.type||'未分类')}</span> 截止 ${esc(t.deadline||'未设日期')} ${esc(t.time||'')}${t._source==='project'?` · 来自${esc(t._cat)}`:''}</div></div><div class="mini-actions"><button class="btn small" onclick="editHomeTodo('${t._source}','${t.id}','${t._cat||''}')">编辑</button><button class="btn small red" onclick="deleteHomeTodo('${t._source}','${t.id}','${t._cat||''}')">删除</button></div></div>`).join(''):empty('暂无未完成且未过期的任务')}</div></div>
  <div class="card"><div class="toolbar"><h3 style="margin:0">假期倒计时</h3><span class="seal">盼</span><span class="spacer"></span><button class="btn small" onclick="addHoliday()">新增</button></div><div class="home-countdown-scroll">${countdowns.length?countdowns.map(h=>{const d=daysLeft(h.date);return `<div class="countdown"><div><b>${esc(h.name)}</b><div class="subtle">${esc(h.date)}</div></div><div class="countdown-actions"><div class="days">${d>=0?d+'天':'已过'}</div><button class="btn small red" onclick="deleteHoliday('${h.id}')">删除</button></div></div>`}).join(''):empty()}</div></div></div>
  <div class="card" style="margin-top:16px"><div class="toolbar"><h3 style="margin:0">近期调休 / 特殊教学日</h3><span class="seal">调</span><span class="spacer"></span><button class="btn small" onclick="go('schedule');setTimeout(()=>openSpecialDayManager(),0)">管理</button></div>${soonSpecial.length?soonSpecial.map(x=>`<div class="special-summary"><div><b>${esc(x.date)} · ${esc(specialTypeLabel(x.type))}</b><div class="subtle">${esc(specialDayRecordLabel(x))}${x.note?` · ${esc(x.note)}`:''}</div></div><span class="pill">${daysLeft(x.date)===0?'今天':daysLeft(x.date)+'天后'}</span></div>`).join(''):empty('未来7天暂无调休或特殊教学日')}</div>
  <div class="grid two" style="margin-top:16px"><div class="card"><div class="toolbar"><h3 style="margin:0">今日课表</h3><span class="spacer"></span><button class="btn small" onclick="go('schedule')">查看课表</button></div>${todays.length?todays.map(e=>`<div class="schedule-today" style="${(e._holiday||e._stopped)?'opacity:.5':''}"><div class="period">${periodBadgeText(e.period)}</div><div><b>${esc(e.className)}</b><div class="subtle">${esc(e.grade)}${e.grade==='校务'?` · ${esc(schoolAdminCategory(e))}`:''} · ${esc(e.subject)} · ${periodSlotLabel(e.period)} · ${esc(scheduleEntryTime(e))}${e._mapped?' · 调休映射':''}${e._stopped?' · 临时停课':''}${e._holiday&&!e._mapped?' · 放假':''}</div></div></div>`).join(''):empty('今日暂无课程')}</div>
  <div class="card"><div class="toolbar"><h3 style="margin:0">数据状态</h3><span class="spacer"></span><button class="btn small" onclick="go('settings')">同步设置</button></div><div class="note"><b>${cloudReady()?'云端同步已启用':'当前为本机保存'}</b><div class="subtle">${cloudReady()?esc(cloudStatusText()):'数据已自动写入本机 IndexedDB；配置云端后可跨设备同步。'}</div></div><div class="subtle" style="margin-top:10px">本机数据约 ${fmtBytes(storageUsage())}</div></div></div>`;
}
function addTodo(){modal('新增待办',`<div class="field"><label>任务</label><input id="mTitle"></div><div class="field"><label>类型（必选）</label><select id="mTodoType"><option value="">请选择类型</option>${TODO_TYPES.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div class="grid two"><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${today()}"></div><div class="field"><label>截止时间</label><input id="mTime" type="time" value="17:00"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitTodo()">添加</button>`)}
function commitTodo(){const title=$('#mTitle').value.trim(),type=$('#mTodoType').value;if(!title)return toast('请填写任务');if(!TODO_TYPES.includes(type))return toast('请选择任务类型');DB.todos.push({id:uid(),title,type,deadline:$('#mDate').value,time:$('#mTime').value,done:false});save(true);closeModal();renderHome();toast('任务已添加')}
function toggleTodo(id){const x=DB.todos.find(x=>x.id===id);if(x){x.done=!x.done;save(true);renderHome()}}
function deleteTodo(id){const i=DB.todos.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这条待办？',()=>{pushRecycle('todo',DB.todos[i]);DB.todos.splice(i,1);save(true);renderHome();toast('已移入回收站')})}
function addHoliday(){modal('新增倒计时',`<div class="field"><label>名称</label><input id="mName"></div><div class="field"><label>日期</label><input id="mDate" type="date"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHoliday()">添加</button>`)}
function commitHoliday(){const name=$('#mName').value.trim(),date=$('#mDate').value;if(!name||!date)return toast('请填写完整');DB.holidays.push({id:uid(),name,date});save(true);closeModal();renderHome()}
function deleteHoliday(id){const i=DB.holidays.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这条倒计时？',()=>{pushRecycle('holiday',DB.holidays[i]);DB.holidays.splice(i,1);save(true);renderHome();toast('倒计时已移入回收站')})}

function periodSlotLabel(period){return PERIOD_SLOT_LABELS[(+period||1)-1]||`第${period}节`}
function periodBadgeText(period){return +period===3?'大':(+period<=2?+period:+period-1)}
function periodSessionLabel(period){return +period===3?'课间':(+period<=5?'上午':'下午')}
function periodTimeText(period,grade='初一'){if(grade==='校务')return '';const g=GRADES.includes(grade)?grade:'初一',t=DB.settings.gradePeriodTimes?.[g]?.[(+period||1)-1]||DEFAULT_GRADE_PERIOD_TIMES()[g]?.[(+period||1)-1];return t&&t[0]&&t[1]?`${t[0]}–${t[1]}`:(t&&(t[0]||t[1])?`${t[0]||'--:--'}–${t[1]||'--:--'}`:'')}
function schoolAdminCategory(e){if(ADMIN_CATEGORIES.includes(e?.adminCategory))return e.adminCategory;const s=`${e?.className||''} ${e?.subject||''}`;if(s.includes('党政'))return '党政';if(s.includes('融媒体'))return '融媒体';if(s.includes('美育'))return '美育';return '其他'}
function scheduleEntryTime(e){return e?.grade==='校务'?(e.customTime||''):periodTimeText(e?.period,e?.grade)}
function scheduleCellBg(color){const h=String(color||'#3c5464').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return 'rgba(60,84,100,.08)';const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return `rgba(${r},${g},${b},.12)`}
function schedulePeriodOptions(grade,selected){return Array.from({length:11},(_,i)=>{const p=i+1,time=periodTimeText(p,grade);return `<option value="${p}" ${+selected===p?'selected':''}>${periodSlotLabel(p)}${time?' · '+time:''}</option>`}).join('')}
function updateSchedulePeriodOptions(){const g=$('#mGrade')?.value||'初一',sel=$('#mPeriod');if(sel){const cur=+sel.value||1;sel.innerHTML=schedulePeriodOptions(g,cur)}const f=$('#mCustomTimeField'),a=$('#mAdminCategoryField');if(f)f.style.display=g==='校务'?'block':'none';if(a)a.style.display=g==='校务'?'block':'none'}

function weekForDate(ds){const st=new Date(DB.settings.semesterStart+'T00:00:00'),weekday=st.getDay()||7,monday=new Date(st);monday.setDate(st.getDate()-(weekday-1));const d=new Date(ds+'T00:00:00');return Math.floor((d-monday)/86400000/7)+1}
function dayIndexForDate(ds){return (new Date(ds+'T00:00:00').getDay()+6)%7}
function specialTypeLabel(type){return type==='stop'?'临时停课':type==='special'?'特殊教学日':'调休上课'}
function specialScopeLabel(scope){return scope==='all'?'全校':scope==='classes'?'指定班级':scope}
function specialDaysForDate(date){return (DB.schedule.specialDays||[]).filter(x=>x.date===date).sort((a,b)=>({makeup:0,stop:1,special:2}[a.type]??9)-({makeup:0,stop:1,special:2}[b.type]??9))}
function specialScopeMatch(rec,e){if(!rec||!e)return false;if(rec.scope==='all')return true;if(GRADES.includes(rec.scope))return e.grade===rec.scope;if(rec.scope==='classes'){const n=normalizeClassName(e.className||'');return (rec.classes||[]).some(x=>normalizeClassName(x)===n)}return false}
function specialDayRecordLabel(rec){if(!rec)return'';const scope=specialScopeLabel(rec.scope);if(rec.type==='makeup')return `${scope} · 按${DAYS[+rec.sourceDay||0]}课表`;if(rec.type==='stop')return `${scope} · 临时停课`;return `${scope} · 特殊教学日`}
function dateHasMakeup(date){return specialDaysForDate(date).some(x=>x.type==='makeup')}
function specialHeaderTags(date){return specialDaysForDate(date).map(x=>`<span class="schedule-day-tag ${x.type==='stop'?'stop':x.type==='special'?'special':''}">${esc(x.type==='makeup'?`调休 · ${specialScopeLabel(x.scope)}按${DAYS[+x.sourceDay||0]}`:x.type==='stop'?`停课 · ${specialScopeLabel(x.scope)}`:`特殊 · ${specialScopeLabel(x.scope)}${x.note?' · '+x.note:''}`)}</span>`).join('')}
function effectiveEntriesForDate(week,day,period){
  const date=dateForWeekDay(week,day),specials=specialDaysForDate(date),makeups=specials.filter(x=>x.type==='makeup'),stops=specials.filter(x=>x.type==='stop'),holiday=(DB.schedule.holidayDates||[]).includes(date);
  const normal=DB.schedule.entries.filter(e=>e.day===day&&e.period===period&&activeEntry(e,week));
  const keep=normal.filter(e=>!makeups.some(r=>specialScopeMatch(r,e))).map(e=>({...e,_mapped:false,_sourceDay:day}));
  const mapped=[];
  makeups.forEach(r=>{DB.schedule.entries.filter(e=>e.day===+r.sourceDay&&e.period===period&&activeEntry(e,week)&&specialScopeMatch(r,e)).forEach(e=>{if(!mapped.some(x=>x.id===e.id&&x._makeupId===r.id))mapped.push({...e,_mapped:true,_sourceDay:+r.sourceDay,_makeupId:r.id})})});
  return [...keep,...mapped].map(e=>{const mapped=!!e._mapped;const stopped=!mapped&&stops.some(r=>specialScopeMatch(r,e));return {...e,_stopped:stopped,_holiday:holiday&&!mapped,_effectiveDate:date}}).sort((a,b)=>(a.grade||'').localeCompare(b.grade||'zh-CN')||(a.className||'').localeCompare(b.className||'zh-CN'));
}
function courseChipHtml(e,displayDay,period){const muted=e._stopped||e._holiday,mark=e._mapped?'<span class="mini-mark">调休</span>':e._stopped?'<span class="mini-mark">停课</span>':e._holiday?'<span class="mini-mark">放假</span>':'';return `<div class="course-chip ${muted?'muted':''}" style="border-left-color:${esc(e.color||'#3c5464')}" onclick="event.stopPropagation();editSchedule(${e._sourceDay??displayDay},${period},'${e.id}')"><div class="course-line"><b>${esc(e.className)}${mark}</b><b>${esc(scheduleEntryTime(e))}</b></div><small>${esc(e.grade)} · ${esc(e.subject)} · ${esc(scheduleRepeatLabel(e))}</small></div>`}

function renderSchedule(){
  S.viewWeek=Math.max(1,Math.min(20,+S.viewWeek||getWeek()));
  const actions=`<button class="btn" onclick="addSubstitution()">新增调课/代课记录</button><button class="btn" onclick="openHolidayRange()">放假</button><button class="btn primary" onclick="openSpecialDayManager()">调休</button>`;
  $('#content').innerHTML=pageHead('课表','1–20周 · 周一至周日 · 每日10节 + 大课间 · 分年级课时 / 校务自由时间',actions)+`<div class="card"><div class="toolbar"><div class="tabs" style="margin:0">${[['week','周视图'],['day','日列表'],['month','月日历'],['timeline','时间轴']].map(v=>`<button class="tab ${S.scheduleView===v[0]?'active':''}" onclick="S.scheduleView='${v[0]}';renderSchedule()">${v[1]}</button>`).join('')}</div><span class="spacer"></span><div class="inline-field"><button class="btn small" onclick="S.viewWeek=Math.max(1,S.viewWeek-1);renderSchedule()">‹</button><select onchange="S.viewWeek=+this.value;renderSchedule()">${Array.from({length:20},(_,i)=>`<option value="${i+1}" ${S.viewWeek===i+1?'selected':''}>第${i+1}周</option>`).join('')}</select><button class="btn small" onclick="S.viewWeek=Math.min(20,S.viewWeek+1);renderSchedule()">›</button></div></div><div id="scheduleBody"></div></div>
  <div class="grid two" style="margin-top:16px"><div class="card"><h3>调课信息大事记</h3><textarea style="min-height:180px" oninput="DB.schedule.adjustmentNote=this.value;save(true)" placeholder="记录调课、代课、临时课程安排……">${esc(DB.schedule.adjustmentNote||'')}</textarea><p class="subtle">输入即自动保存并同步。</p></div><div class="card"><h3>调课 / 代课记录</h3>${DB.schedule.substitutions.length?DB.schedule.substitutions.slice().reverse().map(x=>`<div class="file-item"><div><b>${esc(x.date)}</b><div>${esc(x.info)}</div></div><button class="btn small red" onclick="deleteSubstitution('${x.id}')">删除</button></div>`).join(''):empty()}</div></div>`;
  if(S.scheduleView==='week')renderScheduleWeek();if(S.scheduleView==='day')renderScheduleDay();if(S.scheduleView==='month')renderScheduleMonth();if(S.scheduleView==='timeline')renderScheduleTimeline();
}

function renderScheduleWeek(){let out=`<div class="week-grid"><div class="head">节次</div>${DAYS.map((d,i)=>{const date=dateForWeekDay(S.viewWeek,i);return `<div class="head">${d}<div class="subtle">${date}</div>${specialHeaderTags(date)}</div>`}).join('')}`;for(let p=1;p<=11;p++){out+=`<div class="period-cell"><b>${periodSlotLabel(p)}</b>${p===5?'<small>上午结束</small>':p===6?'<small>下午开始</small>':''}</div>`;for(let d=0;d<DAYS.length;d++){const date=dateForWeekDay(S.viewWeek,d),arr=effectiveEntriesForDate(S.viewWeek,d,p),holiday=(DB.schedule.holidayDates||[]).includes(date),allMuted=arr.length&&arr.every(e=>e._holiday||e._stopped),fullHoliday=holiday&&!arr.some(e=>e._mapped),stops=specialDaysForDate(date).filter(x=>x.type==='stop'),fullStop=stops.some(x=>x.scope==='all'),bg=arr.length===1?scheduleCellBg(arr[0].color):'';out+=`<div class="slot ${(fullHoliday||fullStop||allMuted)?'holiday':''}" ${bg&&!allMuted?`style="background:${bg}"`:''} onclick="editSchedule(${d},${p},'')">${fullHoliday?'<span class="stamp">放假</span>':fullStop?'<span class="stamp">停课</span>':''}${arr.length?arr.map(e=>courseChipHtml(e,d,p)).join(''):'<span class="subtle">点击编辑</span>'}</div>`}}out+='</div>';$('#scheduleBody').innerHTML=out}

function renderScheduleDay(){const d=(new Date().getDay()+6)%7;$('#scheduleBody').innerHTML=`<div class="toolbar"><select id="daySel" onchange="renderDaySelected(+this.value)">${DAYS.map((x,i)=>`<option value="${i}" ${i===d?'selected':''}>${x}</option>`).join('')}</select></div><div id="dayList"></div>`;renderDaySelected(d)}
function renderDaySelected(d){const date=dateForWeekDay(S.viewWeek,d),tags=specialHeaderTags(date);let rows=`${tags?`<div class="note" style="margin-bottom:10px"><b>${DAYS[d]} ${date}</b><div style="margin-top:5px">${tags}</div></div>`:''}`;for(let p=1;p<=11;p++){const arr=effectiveEntriesForDate(S.viewWeek,d,p),holiday=(DB.schedule.holidayDates||[]).includes(date);if(arr.length){arr.forEach(e=>{rows+=`<div class="todo ${(e._holiday||e._stopped)?'overdue':''}" style="background:${scheduleCellBg(e.color)}" onclick="editSchedule(${e._sourceDay??d},${p},'${e.id}')"><div class="period">${periodBadgeText(p)}</div><div class="todo-main"><b>${esc(e.className)}</b><div class="subtle">${esc(e.grade)} · ${esc(scheduleEntryTime(e))} · ${esc(e.subject)}${e._mapped?' · 调休映射':''}${e._stopped?' · 临时停课':''}${e._holiday&&!e._mapped?' · 放假':''}</div></div></div>`})}else rows+=`<div class="todo ${holiday?'overdue':''}" onclick="editSchedule(${d},${p},'')"><div class="period">${periodBadgeText(p)}</div><div class="todo-main"><b>空课</b><div class="subtle">${periodSlotLabel(p)}${holiday?' · 放假':''}</div></div></div>`}$('#dayList').innerHTML=rows}

function renderScheduleMonth(){const base=new Date(dateForWeekDay(S.viewWeek,0)+'T00:00:00'),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const ds=isoDate(dt),dim=dt.getMonth()!==m,di=(dt.getDay()+6)%7,w=weekForDate(ds),special=specialDaysForDate(ds),fullMakeup=special.some(x=>x.type==='makeup'&&x.scope==='all'),holiday=(DB.schedule.holidayDates||[]).includes(ds)&&!fullMakeup;let count=0;if(w>=1&&w<=20)for(let p=1;p<=11;p++)count+=effectiveEntriesForDate(w,di,p).filter(e=>!e._holiday&&!e._stopped).length;const label=special.map(x=>x.type==='makeup'?`调休按${DAYS[+x.sourceDay||0]}`:x.type==='stop'?'临时停课':'特殊教学日').join(' · ');cells+=`<div class="cal-day ${dim?'dim':''} ${holiday?'holiday':''}"><b>${dt.getDate()}</b>${holiday?'<span class="stamp">放</span>':special.length?`<span class="stamp">${special.some(x=>x.type==='makeup')?'调':special.some(x=>x.type==='stop')?'停':'特'}</span>`:''}<div class="cal-events">${label?esc(label)+'<br>':''}${count?`${count} 节有效课程`:''}</div></div>`}$('#scheduleBody').innerHTML=`<div class="toolbar"><b>${y}年${m+1}月</b></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div>`}
function renderScheduleTimeline(){const list=[];for(let d=0;d<7;d++)for(let p=1;p<=11;p++)list.push(...effectiveEntriesForDate(S.viewWeek,d,p).map(e=>({...e,_displayDay:d})));list.sort((a,b)=>a._displayDay-b._displayDay||a.period-b.period);$('#scheduleBody').innerHTML=list.length?list.map(e=>`<div class="todo ${(e._holiday||e._stopped)?'overdue':''}" style="background:${scheduleCellBg(e.color)}"><div class="period">${periodBadgeText(e.period)}</div><div class="todo-main"><b>${DAYS[e._displayDay]} · ${esc(e.className)}</b><div class="subtle">${esc(e.grade)} · ${periodSlotLabel(e.period)} · ${esc(scheduleEntryTime(e))} · ${esc(e.subject)}${e._mapped?' · 调休映射':''}${e._stopped?' · 临时停课':''}${e._holiday&&!e._mapped?' · 放假':''}</div></div><button class="btn small" onclick="editSchedule(${e._sourceDay??e._displayDay},${e.period},'${e.id}')">编辑</button></div>`).join(''):empty()}

function editSchedule(day='',period='',id=''){const e=id?DB.schedule.entries.find(x=>x.id===id):null,grade=SCHEDULE_GRADES.includes(e?.grade)?e.grade:'初一',selPeriod=e?.period??period??1,adminCategory=schoolAdminCategory(e);modal(e?'编辑课程':'新增课程',`<div class="grid two"><div class="field"><label>星期</label><select id="mDay">${DAYS.map((x,i)=>`<option value="${i}" ${(e?.day??day)==i?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>年级 / 类型（必选）</label><select id="mGrade" onchange="updateSchedulePeriodOptions()">${SCHEDULE_GRADES.map(g=>`<option value="${g}" ${grade===g?'selected':''}>${g}</option>`).join('')}</select></div></div><div class="grid two"><div class="field"><label>节次</label><select id="mPeriod">${schedulePeriodOptions(grade,selPeriod)}</select></div><div class="field"><label>课表格颜色</label><input id="mColor" type="color" value="${esc(e?.color||'#3c5464')}" style="height:42px;padding:5px"></div></div><div class="grid two"><div id="mCustomTimeField" class="field" style="${grade==='校务'?'':'display:none'}"><label>校务时间（自由填写，可留空）</label><input id="mCustomTime" value="${esc(e?.customTime||'')}" placeholder="例如：14:30–16:00 / 全天"></div><div id="mAdminCategoryField" class="field" style="${grade==='校务'?'':'display:none'}"><label>校务类别</label><select id="mAdminCategory">${ADMIN_CATEGORIES.map(x=>`<option value="${x}" ${adminCategory===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid two"><div class="field"><label>班级 / 社团 / 校务</label><input id="mClass" value="${esc(e?.className||'')}"></div><div class="field"><label>科目 / 内容</label><input id="mSubject" value="${esc(e?.subject||(grade==='校务'?'校务':'美术'))}"></div></div><div class="field"><label>生效周</label><select id="mWeeks"><option value="all" ${e?.weeks==='all'?'selected':''}>每周</option><option value="odd" ${e?.weeks==='odd'?'selected':''}>单周</option><option value="even" ${e?.weeks==='even'?'selected':''}>双周</option><option value="once" ${e?.weeks==='once'?'selected':''}>不重复</option></select><div class="subtle" style="margin-top:6px">选择“不重复”时，仅在${e?.weeks==='once'?`第${+e.week||S.viewWeek}周`:`当前第${S.viewWeek}周`}生效。</div></div>`,`<button class="btn" onclick="closeModal()">取消</button>${e?`<button class="btn red" onclick="deleteSchedule('${e.id}')">删除</button>`:''}<button class="btn primary" onclick="commitSchedule('${e?.id||''}')">保存</button>`)}
function commitSchedule(id){const grade=$('#mGrade').value;if(!SCHEDULE_GRADES.includes(grade))return toast('请选择年级或校务');const prev=id?DB.schedule.entries.find(x=>x.id===id):null,weeks=$('#mWeeks').value;const obj={id:id||uid(),day:+$('#mDay').value,grade,period:+$('#mPeriod').value,customTime:grade==='校务'?($('#mCustomTime')?.value.trim()||''):'',adminCategory:grade==='校务'?(ADMIN_CATEGORIES.includes($('#mAdminCategory')?.value)?$('#mAdminCategory').value:'其他'):'',className:$('#mClass').value.trim(),subject:$('#mSubject').value.trim(),weeks,week:weeks==='once'?(prev?.weeks==='once'?(+prev.week||S.viewWeek):S.viewWeek):null,color:$('#mColor').value||'#3c5464'};if(!obj.className)return toast('请填写班级、社团或校务名称');const i=DB.schedule.entries.findIndex(x=>x.id===id);if(i>=0)DB.schedule.entries[i]=obj;else DB.schedule.entries.push(obj);save(true);closeModal();renderSchedule();toast(weeks==='once'?`已添加第${obj.week}周单次课程`:'课表已更新')}
function deleteSchedule(id){const i=DB.schedule.entries.findIndex(x=>x.id===id);if(i<0)return;closeModal();askConfirm('删除这节课程？',()=>{pushRecycle('schedule',DB.schedule.entries[i]);DB.schedule.entries.splice(i,1);save(true);renderSchedule()})}
function openHolidayRange(){modal('放假日期范围',`<div class="grid two"><div class="field"><label>开始日期</label><input id="mHolidayStart" type="date" value="${today()}"></div><div class="field"><label>结束日期</label><input id="mHolidayEnd" type="date" value="${today()}"></div></div><div class="note">设为放假后，对应日期在周课表和月日历中会灰显；如果同一天另设“调休上课”，调休安排将优先于放假显示。</div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn" onclick="commitHolidayRange('clear')">清除该范围</button><button class="btn primary" onclick="commitHolidayRange('add')">设为放假</button>`)}
function commitHolidayRange(mode='add'){const a=$('#mHolidayStart')?.value,b=$('#mHolidayEnd')?.value;if(!a||!b)return toast('请选择开始和结束日期');const st=new Date(a+'T00:00:00'),ed=new Date(b+'T00:00:00');if(st>ed)return toast('结束日期不能早于开始日期');const set=new Set(DB.schedule.holidayDates||[]);for(let d=new Date(st);d<=ed;d.setDate(d.getDate()+1)){const ds=isoDate(d);if(mode==='clear')set.delete(ds);else set.add(ds)}DB.schedule.holidayDates=[...set].sort();save(true);closeModal();renderSchedule();toast(mode==='clear'?'已清除所选范围的放假标记':'放假日期范围已设置')}

function specialClassChecks(rec){const selected=new Set((rec?.classes||[]).map(normalizeClassName));return DB.classes.length?DB.classes.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).map(c=>`<label class="special-scope-row"><input name="mSpecialClass" type="checkbox" value="${esc(normalizeClassName(c.name))}" ${selected.has(normalizeClassName(c.name))?'checked':''}>${esc(c.name)}</label>`).join(''):'<div class="subtle">尚未在“设置 → 班级管理”中添加班级。</div>'}
function updateSpecialDayFields(){const type=$('#mSpecialType')?.value||'makeup',scope=$('#mSpecialScope')?.value||'all';const sf=$('#mSpecialSourceField'),cf=$('#mSpecialClassesField');if(sf)sf.style.display=type==='makeup'?'block':'none';if(cf)cf.style.display=scope==='classes'?'block':'none'}
function openSpecialDayManager(editId=''){const rec=editId?(DB.schedule.specialDays||[]).find(x=>x.id===editId):null,list=(DB.schedule.specialDays||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));modal(rec?'编辑调休 / 特殊教学日':'调休 / 特殊教学日',`<div class="grid two"><div class="field"><label>日期</label><input id="mSpecialDate" type="date" value="${esc(rec?.date||today())}"></div><div class="field"><label>类型</label><select id="mSpecialType" onchange="updateSpecialDayFields()"><option value="makeup" ${rec?.type==='makeup'||!rec?'selected':''}>调休上课</option><option value="stop" ${rec?.type==='stop'?'selected':''}>临时停课</option><option value="special" ${rec?.type==='special'?'selected':''}>特殊教学日</option></select></div></div><div id="mSpecialSourceField" class="field" style="${rec&&rec.type!=='makeup'?'display:none':''}"><label>执行哪一天的课表</label><select id="mSpecialSourceDay">${DAYS.map((d,i)=>`<option value="${i}" ${(+rec?.sourceDay||0)===i?'selected':''}>按${d}课表</option>`).join('')}</select></div><div class="field"><label>适用范围</label><select id="mSpecialScope" onchange="updateSpecialDayFields()"><option value="all" ${rec?.scope==='all'||!rec?'selected':''}>全校</option>${GRADES.map(g=>`<option value="${g}" ${rec?.scope===g?'selected':''}>${g}</option>`).join('')}<option value="classes" ${rec?.scope==='classes'?'selected':''}>指定班级</option></select></div><div id="mSpecialClassesField" class="field" style="${rec?.scope==='classes'?'':'display:none'}"><label>指定班级（可多选）</label><div class="special-scope-box">${specialClassChecks(rec)}</div></div><div class="field"><label>备注</label><textarea id="mSpecialNote" placeholder="例如：国庆节前调休 / 艺术节 / 期中考试">${esc(rec?.note||'')}</textarea></div><div class="note">规则：调休上课优先于放假；选择“调休上课”时会自动映射所选星期几在同一教学周内最终生效的课程，不会复制课程数据。</div><h3 style="margin-top:18px">已有记录</h3><div class="special-list">${list.length?list.map(x=>`<div class="file-item"><div><b>${esc(x.date)} · ${esc(specialTypeLabel(x.type))}</b><div class="subtle">${esc(specialDayRecordLabel(x))}${x.note?` · ${esc(x.note)}`:''}</div></div><div class="mini-actions"><button class="btn small" onclick="openSpecialDayManager('${x.id}')">编辑</button><button class="btn small red" onclick="deleteSpecialDay('${x.id}')">删除</button></div></div>`).join(''):empty('暂无调休或特殊教学日记录')}</div>`,`<button class="btn" onclick="closeModal()">关闭</button>${rec?`<button class="btn red" onclick="deleteSpecialDay('${rec.id}')">删除</button>`:''}<button class="btn primary" onclick="commitSpecialDay('${rec?.id||''}')">保存</button>`);setTimeout(updateSpecialDayFields,0)}
function commitSpecialDay(id=''){const date=$('#mSpecialDate')?.value,type=$('#mSpecialType')?.value,scope=$('#mSpecialScope')?.value;if(!date)return toast('请选择日期');if(!['makeup','stop','special'].includes(type))return toast('请选择类型');if(!['all','初一','初二','初三','classes'].includes(scope))return toast('请选择适用范围');const classes=scope==='classes'?$$('input[name="mSpecialClass"]:checked').map(x=>normalizeClassName(x.value)).filter(Boolean):[];if(scope==='classes'&&!classes.length)return toast('请至少选择一个班级');const obj={id:id||uid(),date,type,sourceDay:type==='makeup'?+$('#mSpecialSourceDay').value:0,scope,classes,note:$('#mSpecialNote')?.value.trim()||''};let i=(DB.schedule.specialDays||[]).findIndex(x=>x.id===id);if(i<0)i=(DB.schedule.specialDays||[]).findIndex(x=>x.date===date&&x.scope===scope&&x.id!==id);if(i>=0)DB.schedule.specialDays[i]=obj;else DB.schedule.specialDays.push(obj);DB.schedule.specialDays.sort((a,b)=>a.date.localeCompare(b.date));save(true);closeModal();renderSchedule();toast(type==='makeup'&&(DB.schedule.holidayDates||[]).includes(date)?'已保存；该日调休将优先于放假显示':'调休 / 特殊教学日已保存')}
function deleteSpecialDay(id){const i=(DB.schedule.specialDays||[]).findIndex(x=>x.id===id);if(i<0)return;closeModal();askConfirm('删除这条调休 / 特殊教学日记录？',()=>{pushRecycle('specialDay',DB.schedule.specialDays[i]);DB.schedule.specialDays.splice(i,1);save(true);renderSchedule();toast('已移入回收站')})}

function addSubstitution(){modal('新增调课 / 代课记录',`<div class="field"><label>日期</label><input id="mDate" type="date" value="${today()}"></div><div class="field"><label>记录内容</label><textarea id="mInfo" placeholder="例如：五年级2班第4节调至周四第5节；王老师代课"></textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitSubstitution()">添加</button>`)}
function commitSubstitution(){const info=$('#mInfo').value.trim();if(!info)return toast('请填写调课或代课信息');DB.schedule.substitutions.push({id:uid(),date:$('#mDate').value||today(),info});save(true);closeModal();renderSchedule();toast('调课记录已添加')}
function deleteSubstitution(id){const i=DB.schedule.substitutions.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这条调课/代课记录？',()=>{pushRecycle('substitution',DB.schedule.substitutions[i]);DB.schedule.substitutions.splice(i,1);save(true);renderSchedule()})}

function parseClassParts(name=''){let x=String(name||'').replace(/\s+/g,'');x=x.replace(/^初一/,'七年级').replace(/^初二/,'八年级').replace(/^初三/,'九年级');let m=x.match(/(七年级|八年级|九年级)(?:第)?(\d{1,2})班/);if(!m){m=x.match(/([七八九])(?:年级)?(?:第)?(\d{1,2})班/);if(m)m=[m[0],m[1]+'年级',m[2]]}if(!m)return null;const no=Math.max(1,Math.min(20,+m[2]||1));return{grade:m[1],classNo:no,name:`${m[1]}${no}班`}}
function normalizeClassName(name=''){return parseClassParts(name)?.name||String(name||'').replace(/\s+/g,'')}
function artStudentMatchForClubStudent(cs){const name=String(cs?.name||'').trim();if(!name)return null;const ck=normalizeClassName(cs?.className||'');if(ck){for(const c of DB.classes){if(normalizeClassName(c.name)!==ck)continue;const st=DB.artClasses[c.id]?.students?.find(s=>String(s.name||'').trim()===name);if(st)return{student:st,classId:c.id,className:c.name}}}const all=[];for(const c of DB.classes){const st=DB.artClasses[c.id]?.students?.find(s=>String(s.name||'').trim()===name);if(st)all.push({student:st,classId:c.id,className:c.name})}return all.length===1?all[0]:null}
function linkedClubNamesForArtStudent(s,classId=S.classId){const name=String(s?.name||'').trim(),cls=DB.classes.find(c=>c.id===classId),ck=normalizeClassName(cls?.name||'');if(!name)return[];return DB.clubs.filter(c=>(c.students||[]).some(cs=>{if(String(cs.name||'').trim()!==name)return false;const sck=normalizeClassName(cs.className||'');return !sck||!ck||sck===ck})).map(c=>c.name)}
function studentClubTags(s,classId=S.classId){return[...new Set([...(s?.clubTags||[]),...linkedClubNamesForArtStudent(s,classId)])].filter(Boolean)}
function currentArt(){if(!S.classId||!DB.artClasses[S.classId])S.classId=DB.classes[0]?.id;return DB.artClasses[S.classId]}
function renderArtClass(){if(S.artTab==='performance')S.artTab='roster';const ac=currentArt();const cls=DB.classes.find(c=>c.id===S.classId);if(!ac){$('#content').innerHTML=pageHead('美术课','学生名册、分组、座位、考勤、作业、成绩与附加分')+empty('请先在设置中新增班级');return}const tabs=[['roster','学生名册'],['groups','分组管理'],['seats','座位表'],['attendance','考勤'],['homework','作业管理'],['bonus','附加分'],['grades','成绩统计']];$('#content').innerHTML=pageHead('美术课','合并班级管理与学期成绩，适配美术学科课堂')+`<div class="card"><div class="toolbar"><select onchange="S.classId=this.value;renderArtClass()">${DB.classes.map(c=>`<option value="${c.id}" ${c.id===S.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span class="pill"><span class="dot" style="background:${cls?.color}"></span>${ac.students.length}名学生</span></div><div class="tabs">${tabs.map(t=>`<button class="tab ${S.artTab===t[0]?'active':''}" onclick="S.artTab='${t[0]}';renderArtClass()">${t[1]}</button>`).join('')}</div><div id="artBody"></div></div>`;({roster:renderRoster,groups:renderGroups,seats:renderSeats,performance:renderPerformance,attendance:renderAttendance,homework:renderHomework,bonus:renderBonus,grades:renderGrades}[S.artTab]||renderRoster)()}
function renderRoster(){const a=currentArt();$('#artBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editStudent()">新增学生</button><button class="btn" onclick="importStudents()">Excel复制粘贴导入</button><button class="btn" onclick="exportArtStudents()">完整导出CSV</button></div>${a.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>姓名</th><th>社团活动标签</th><th>美术特长标签</th><th>历次评语</th><th>操作</th></tr></thead><tbody>${a.students.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(privacyName(s.name,i))}</td><td>${studentClubTags(s,S.classId).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'—'}</td><td>${(s.tags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'—'}</td><td>${esc(s.comments||'')}</td><td><button class="btn small" onclick="editStudent('${s.id}')">编辑</button> <button class="btn small red" onclick="deleteStudent('${s.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>`:empty('暂无数据，点击添加')}`}
function exportArtStudents(){const a=currentArt(),cls=DB.classes.find(c=>c.id===S.classId),rows=[['姓名','班级','社团活动标签','美术特长标签','历次评语','特长学生','特殊学生','课堂作品简要信息']];a.students.forEach(s=>rows.push([s.name,cls?.name||'',studentClubTags(s,S.classId).join('；'),(s.tags||[]).join('；'),s.comments||'',s.featured?'是':'否',s.special?'是':'否',s.artwork||'']));csvDownload(`${cls?.name||'美术课'}-学生名册完整导出.csv`,rows)}
function editStudent(id=''){const a=currentArt(),s=a.students.find(x=>x.id===id),linked=s?studentClubTags(s,S.classId):[];modal(s?'编辑学生':'新增学生',`<div class="field"><label>姓名</label><input id="mName" value="${esc(s?.name||'')}"></div><div class="field"><label>社团活动标签</label><div class="note">${linked.length?linked.map(x=>`<span class="pill">${esc(x)}</span>`).join(' '):'保存姓名后，将根据“校本社团 → 学生名单”中的姓名与班级自动关联，无需再次填写。'}</div></div><div class="field"><label>美术特长标签（逗号分隔）</label><input id="mTags" value="${esc((s?.tags||[]).join(','))}"></div><div class="field"><label>美术学科历次评语</label><textarea id="mComments">${esc(s?.comments||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitStudent('${id}')">保存</button>`) }
function commitStudent(id){const a=currentArt(),name=$('#mName').value.trim();if(!name)return toast('请填写姓名');const old=a.students.find(x=>x.id===id)||{},obj={...old,id:id||uid(),name,clubTags:old.clubTags||[],tags:$('#mTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),comments:$('#mComments').value.trim(),special:old.special||false,featured:old.featured||false,artwork:old.artwork||''};const i=a.students.findIndex(x=>x.id===id);if(i>=0)a.students[i]=obj;else a.students.push(obj);save(true);closeModal();renderArtClass()}
function deleteStudent(id){const a=currentArt(),i=a.students.findIndex(x=>x.id===id);if(i<0)return;askConfirm('删除这名学生及其课堂关联显示？',()=>{pushRecycle('student',a.students[i],{classId:S.classId});a.students.splice(i,1);a.groups=a.groups.map(g=>g.filter(x=>x!==id));a.seats.cells=a.seats.cells.map(x=>x===id?null:x);save(true);renderArtClass()})}
function importStudents(){modal('Excel复制粘贴导入',`<p class="subtle">从Excel复制“姓名、美术特长标签、评语”三列后直接粘贴。社团活动标签会根据校本社团名单自动关联。支持Tab分隔；第一行若为表头会自动跳过。</p><textarea id="mPaste" style="min-height:220px" placeholder="姓名\t绘画特长,书法\t课堂观察评语"></textarea>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitImportStudents()">导入</button>`) }
function commitImportStudents(){const text=$('#mPaste').value.trim();if(!text)return toast('请粘贴数据');let rows=text.split(/\r?\n/).map(r=>r.includes('\t')?r.split('\t'):r.split(/[,，]/));if(/姓名/.test(rows[0]?.[0]||''))rows.shift();let n=0;rows.forEach(r=>{const name=(r[0]||'').trim();if(name){currentArt().students.push({id:uid(),name,clubTags:[],tags:(r[1]||'').split(/[,，;；]/).map(x=>x.trim()).filter(Boolean),comments:(r[2]||'').trim(),special:false,featured:false,artwork:''});n++}});save(true);closeModal();renderArtClass();toast(`已导入 ${n} 名学生`)}
function renderGroups(){const a=currentArt();$('#artBody').innerHTML=`<div class="toolbar"><label>分组数</label><input id="groupCount" type="number" min="2" max="12" value="4" style="width:90px"><button class="btn primary" onclick="randomGroups()">一键随机分组</button><button class="btn" onclick="clearGroups()">清空分组</button></div>${a.groups.length?`<div class="grid three">${a.groups.map((g,gi)=>`<div class="card"><h3>第${gi+1}组</h3>${g.map(id=>{const i=a.students.findIndex(s=>s.id===id);return `<span class="pill">${esc(i>=0?privacyName(a.students[i].name,i):'已删除')}</span>`}).join(' ')||'<span class="subtle">空组</span>'}</div>`).join('')}</div>`:empty('尚未分组')}`}
function randomGroups(){const a=currentArt(),n=Math.max(2,+$('#groupCount').value||4),arr=a.students.map(s=>s.id).sort(()=>Math.random()-.5);a.groups=Array.from({length:n},()=>[]);arr.forEach((id,i)=>a.groups[i%n].push(id));save(true);renderArtClass();toast('已随机分组')}
function clearGroups(){currentArt().groups=[];save(true);renderArtClass()}
function renderSeats(){const a=currentArt();a.seats.cols=2;const {rows,cells}=a.seats;$('#artBody').innerHTML=`<div class="toolbar"><label>排数</label><input id="seatRows" type="number" min="1" max="40" value="${rows}" style="width:72px"><span class="pill">固定两列</span><button class="btn" onclick="resizeSeats()">调整座位</button><button class="btn primary" onclick="randomSeats()">随机排座</button><button class="btn" onclick="exportSeatsPng()">导出图片</button><button class="btn" onclick="printSeats()">打印 / PDF</button></div><div class="seat-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${cells.map((id,i)=>{const si=a.students.findIndex(s=>s.id===id);return `<div class="seat" onclick="pickSeat(${i})"><span>${id&&si>=0?esc(privacyName(a.students[si].name,si)):'空座位'}</span></div>`}).join('')}</div>`}
function resizeSeats(){const a=currentArt(),r=Math.max(1,+$('#seatRows').value),old=a.seats.cells.slice();a.seats={rows:r,cols:2,cells:Array(r*2).fill(null)};old.slice(0,r*2).forEach((x,i)=>a.seats.cells[i]=x);save(true);renderArtClass()}
function randomSeats(){const a=currentArt(),arr=a.students.map(s=>s.id).sort(()=>Math.random()-.5),len=a.seats.rows*2;a.seats.cells=Array(len).fill(null);arr.slice(0,len).forEach((x,i)=>a.seats.cells[i]=x);save(true);renderArtClass();toast('已随机排座')}
function pickSeat(index){const a=currentArt();modal('分配座位',`<div class="field"><label>选择学生</label><select id="mStudent"><option value="">空座位</option>${a.students.map((s,i)=>`<option value="${s.id}" ${a.seats.cells[index]===s.id?'selected':''}>${esc(privacyName(s.name,i))}</option>`).join('')}</select></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitSeat(${index})">确定</button>`)}
function commitSeat(index){currentArt().seats.cells[index]=$('#mStudent').value||null;save(true);closeModal();renderArtClass()}
function renderPerformance(){const a=currentArt();$('#artBody').innerHTML=a.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>特长学生</th><th>特殊学生</th><th>课堂作品简要信息</th></tr></thead><tbody>${a.students.map((s,i)=>`<tr><td>${esc(privacyName(s.name,i))}</td><td><button class="btn small ${s.featured?'primary':''}" onclick="toggleStudentFlag('${s.id}','featured')">${s.featured?'已标记':'标记'}</button></td><td><button class="btn small ${s.special?'red':''}" onclick="toggleStudentFlag('${s.id}','special')">${s.special?'已标记':'标记'}</button></td><td><input value="${esc(s.artwork||'')}" oninput="updateArtwork('${s.id}',this.value)"></td></tr>`).join('')}</tbody></table></div>`:empty()}
function toggleStudentFlag(id,key){const s=currentArt().students.find(x=>x.id===id);s[key]=!s[key];save(true);renderArtClass()}
function updateArtwork(id,v){const s=currentArt().students.find(x=>x.id===id);if(s){s.artwork=v;save(true)}}
function renderAttendance(){const a=currentArt(),date=S.attDate||today();S.attDate=date;a.attendance[date]??={};const rec=a.attendance[date],counts={present:0,late:0,absent:0,leave:0};Object.values(rec).forEach(s=>counts[s]=(counts[s]||0)+1);$('#artBody').innerHTML=`<div class="toolbar"><input type="date" value="${date}" onchange="S.attDate=this.value;renderArtClass()" style="width:auto"><button class="btn primary" onclick="markAllPresent()">一键整班全勤</button><button class="btn" onclick="exportAttendance()">导出CSV</button></div><div class="statbar" style="margin-bottom:14px">${Object.keys(STATUS).map(k=>`<span class="statbox">${STATUS[k]} ${counts[k]||0}</span>`).join('')}</div>${a.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>学生</th><th>状态</th></tr></thead><tbody>${a.students.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(privacyName(s.name,i))}</td><td><div class="statuses">${Object.entries(STATUS).map(([k,v])=>`<button class="status ${k} ${rec[s.id]===k?'on':''}" onclick="setAttendance('${s.id}','${k}')">${v}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`:empty()}`}
function setAttendance(id,status){currentArt().attendance[S.attDate][id]=status;save(true);renderArtClass()}
function markAllPresent(){const a=currentArt();a.attendance[S.attDate]=Object.fromEntries(a.students.map(s=>[s.id,'present']));save(true);renderArtClass();toast('已整班标记全勤')}
function exportAttendance(){const a=currentArt(),rec=a.attendance[S.attDate]||{};csvDownload(`美术考勤-${S.attDate}.csv`,[['姓名','日期','状态'],...a.students.map(s=>[s.name,S.attDate,STATUS[rec[s.id]]||'未标记'])])}
function renderHomework(){const a=currentArt();const hwId=S.hwId||a.homework[0]?.id;S.hwId=hwId;const hw=a.homework.find(x=>x.id===hwId);$('#artBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editHomework()">新增作业</button>${a.homework.length?`<select onchange="S.hwId=this.value;renderArtClass()">${a.homework.map(h=>`<option value="${h.id}" ${h.id===hwId?'selected':''}>${esc(h.title)}</option>`).join('')}</select>`:''}</div>${hw?renderHomeworkDetail(hw):empty('暂无作业，点击新增')}`}
function renderHomeworkDetail(hw){const a=currentArt(),near=daysLeft(hw.deadline)<=3&&daysLeft(hw.deadline)>=0,missing=a.students.filter(s=>(hw.records[s.id]?.status||'missing')==='missing');return `<div class="note" style="margin-bottom:14px"><b>${esc(hw.title)}</b> · ${esc(hw.subject)} · 截止 ${esc(hw.deadline)} ${near?'<span style="color:var(--cinnabar)">临近截止</span>':''}<div class="subtle">${esc(hw.requirement)}</div><div style="margin-top:7px">未交：${missing.length?missing.map((s,i)=>esc(privacyName(s.name,a.students.indexOf(s)))).join('、'):'无'}</div><div class="mini-actions" style="margin-top:8px"><button class="btn small" onclick="editHomework('${hw.id}')">编辑作业</button><button class="btn small red" onclick="deleteHomework('${hw.id}')">删除作业</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>状态</th><th>成绩</th><th>美术作业备注</th></tr></thead><tbody>${a.students.map((s,i)=>{const r=hw.records[s.id]||{status:'missing',score:'',note:''};return `<tr><td>${esc(privacyName(s.name,i))}</td><td><button class="btn small" onclick="cycleHomework('${hw.id}','${s.id}')">${r.status==='missing'?'未交':r.status==='submitted'?'已交':'已批'}</button></td><td>${r.status==='graded'?`<input type="number" min="0" max="100" value="${r.score??''}" oninput="setHomeworkScore('${hw.id}','${s.id}',this.value)">`:'—'}</td><td><input value="${esc(r.note||'')}" oninput="setHomeworkNote('${hw.id}','${s.id}',this.value)"></td></tr>`}).join('')}</tbody></table></div>`}
function editHomework(id=''){const a=currentArt(),h=a.homework.find(x=>x.id===id);modal(h?'编辑作业':'新增作业',`<div class="field"><label>标题</label><input id="mTitle" value="${esc(h?.title||'')}"></div><div class="grid two"><div class="field"><label>科目</label><input id="mSubject" value="${esc(h?.subject||'美术')}"></div><div class="field"><label>截止日期</label><input id="mDate" type="date" value="${esc(h?.deadline||today())}"></div></div><div class="field"><label>美术创作要求</label><textarea id="mReq">${esc(h?.requirement||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitHomework('${id}')">保存</button>`)}
function commitHomework(id){const a=currentArt(),h=a.homework.find(x=>x.id===id),obj={id:id||uid(),title:$('#mTitle').value.trim(),subject:$('#mSubject').value.trim(),deadline:$('#mDate').value,requirement:$('#mReq').value.trim(),records:h?.records||{}};if(!obj.title)return toast('请填写标题');if(h)Object.assign(h,obj);else{a.students.forEach(s=>obj.records[s.id]={status:'missing',score:null,note:''});a.homework.push(obj);S.hwId=obj.id}save(true);closeModal();renderArtClass()}
function cycleHomework(hid,sid){const r=currentArt().homework.find(x=>x.id===hid).records[sid]||={status:'missing',score:null,note:''};r.status=r.status==='missing'?'submitted':r.status==='submitted'?'graded':'missing';if(r.status==='graded'&&r.score==null)r.score=85;save(true);renderArtClass()}
function setHomeworkScore(hid,sid,v){const r=currentArt().homework.find(x=>x.id===hid).records[sid];r.score=v===''?null:+v;save(true)}
function setHomeworkNote(hid,sid,v){const h=currentArt().homework.find(x=>x.id===hid);h.records[sid]??={status:'missing',score:null,note:''};h.records[sid].note=v;save(true)}
function deleteHomework(id){const a=currentArt(),i=a.homework.findIndex(x=>x.id===id);askConfirm('删除这项作业及其批改记录？',()=>{pushRecycle('homework',a.homework[i],{classId:S.classId});a.homework.splice(i,1);S.hwId=null;save(true);renderArtClass()})}
function renderBonus(){const a=currentArt();$('#artBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="addBonus()">新增附加分</button></div>${a.bonus.length?`<div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>日期</th><th>事由</th><th>分值</th><th>操作</th></tr></thead><tbody>${a.bonus.map(b=>{const i=a.students.findIndex(s=>s.id===b.studentId);return `<tr><td>${i>=0?esc(privacyName(a.students[i].name,i)):'已删除学生'}</td><td>${esc(b.date)}</td><td>${esc(b.reason)}</td><td>+${b.points}</td><td><button class="btn small red" onclick="deleteBonus('${b.id}')">删除</button></td></tr>`}).join('')}</tbody></table></div>`:empty()}`}
function addBonus(){const a=currentArt();modal('新增附加分',`<div class="field"><label>学生</label><select id="mStudent">${a.students.map((s,i)=>`<option value="${s.id}">${esc(privacyName(s.name,i))}</option>`).join('')}</select></div><div class="field"><label>事由</label><input id="mReason" list="bonusLabels"><datalist id="bonusLabels">${DB.settings.bonusLabels.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div><div class="grid two"><div class="field"><label>分值</label><input id="mPoints" type="number" step="0.5" value="1"></div><div class="field"><label>日期</label><input id="mDate" type="date" value="${today()}"></div></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitBonus()">添加</button>`)}
function commitBonus(){const reason=$('#mReason').value.trim();if(!reason)return toast('请填写事由');currentArt().bonus.push({id:uid(),studentId:$('#mStudent').value,reason,points:+$('#mPoints').value||0,date:$('#mDate').value});save(true);closeModal();renderArtClass()}
function deleteBonus(id){const a=currentArt(),i=a.bonus.findIndex(x=>x.id===id);askConfirm('删除这条附加分记录？',()=>{pushRecycle('bonus',a.bonus[i],{classId:S.classId});a.bonus.splice(i,1);save(true);renderArtClass()})}
function calcGrades(a,s){const dates=Object.keys(a.attendance),vals=dates.map(d=>a.attendance[d][s.id]).filter(Boolean);const map={present:100,late:90,leave:85,absent:0};const att=vals.length?vals.reduce((n,x)=>n+(map[x]??0),0)/vals.length:0;const scores=a.homework.map(h=>h.records[s.id]).filter(r=>r?.status==='graded'&&r.score!=null).map(r=>+r.score);const hw=scores.length?scores.reduce((n,x)=>n+x,0)/scores.length:0;const usual=.6*att+.4*hw;const bonus=Math.min(10,a.bonus.filter(b=>b.studentId===s.id).reduce((n,b)=>n+(+b.points||0),0));return{att,hw,usual,bonus,final:.9*usual+bonus}}
function renderGrades(){const a=currentArt();$('#artBody').innerHTML=`<div class="note" style="margin-bottom:14px">计算规则：平时成绩 = 60%考勤 + 40%作业；期末成绩 = 90%平时成绩 + 附加分（附加分按累计点数计入，最高10分）。</div>${a.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>学生</th><th>考勤</th><th>作业</th><th>平时成绩</th><th>附加分</th><th>期末成绩</th></tr></thead><tbody>${a.students.map((s,i)=>{const g=calcGrades(a,s);return `<tr><td>${esc(privacyName(s.name,i))}</td><td>${g.att.toFixed(1)}</td><td>${g.hw.toFixed(1)}</td><td>${g.usual.toFixed(1)}</td><td>${g.bonus.toFixed(1)}</td><td><b>${g.final.toFixed(1)}</b></td></tr>`}).join('')}</tbody></table></div>`:empty()}`}
function renderTeaching(){const tabs=[['plans','教案库'],['courseware','课件索引'],['pbl','PBL项目'],['topic','项目课题'],['papers','论文'],['awards','获奖记录']];$('#content').innerHTML=pageHead('教学教研','教案版本、课后反思、课件索引与美术教研记录')+`<div class="card"><div class="tabs">${tabs.map(t=>`<button class="tab ${S.teachTab===t[0]?'active':''}" onclick="S.teachTab='${t[0]}';renderTeaching()">${t[1]}</button>`).join('')}</div><div id="teachBody"></div></div>`;({plans:renderPlans,courseware:renderCourseware,pbl:renderPBL,topic:renderTopic,papers:renderPapers,awards:renderAwards}[S.teachTab]||renderPlans)()}
function renderPlans(){const list=DB.teaching.plans;$('#teachBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editPlan()">新建教案</button></div>${list.length?list.map(p=>{const v=p.versions[p.versions.length-1];return `<div class="card" style="margin-bottom:12px"><div class="toolbar"><div><h3 style="margin:0">${esc(p.title)}</h3><span class="subtle">${esc(p.grade||'')} · ${p.versions.length}个版本 · 最新v${v?.version||1}</span></div><span class="spacer"></span><button class="btn small" onclick="viewPlan('${p.id}')">查看版本</button><button class="btn small" onclick="newPlanVersion('${p.id}')">复制旧版新建</button><button class="btn small red" onclick="deletePlan('${p.id}')">删除</button></div><div class="note">${esc(v?.content||'')}</div>${v?.reflection?`<p class="subtle">课后反思：${esc(v.reflection)}</p>`:''}</div>`}).join(''):empty()}`}
function editPlan(){modal('新建教案',`<div class="field"><label>教案名称</label><input id="mTitle"></div><div class="field"><label>年级 / 对象</label><input id="mGrade"></div><div class="field"><label>教案内容</label><textarea id="mContent"></textarea></div><div class="field"><label>课后反思</label><textarea id="mReflection"></textarea></div><div class="field"><label>附件（Word / Excel / JPG / PNG，单文件≤${fmtBytes(MAX_FILE)}）</label><input id="mFile" type="file" accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitPlan()">创建</button>`)}
function commitPlan(){const title=$('#mTitle').value.trim();if(!title)return toast('请填写教案名称');const p={id:uid(),title,grade:$('#mGrade').value.trim(),versions:[{id:uid(),version:1,date:today(),content:$('#mContent').value.trim(),reflection:$('#mReflection').value.trim(),attachments:[]}]};const file=$('#mFile').files[0];const done=()=>{DB.teaching.plans.push(p);save(true);closeModal();renderTeaching();toast('教案已创建')};if(file)readFile(file,['doc','docx','xls','xlsx','jpg','jpeg','png'],f=>{p.versions[0].attachments.push(f);done()});else done()}
function viewPlan(id){const p=DB.teaching.plans.find(x=>x.id===id);if(!p)return;modal(p.title,`<div class="tabs">${p.versions.map((v,i)=>`<button class="tab ${i===p.versions.length-1?'active':''}" onclick="showPlanVersion('${p.id}','${v.id}',this)">v${v.version}</button>`).join('')}</div><div id="planVersionBox"></div>`,`<button class="btn" onclick="closeModal()">关闭</button>`);setTimeout(()=>showPlanVersion(p.id,p.versions[p.versions.length-1].id),0)}
function showPlanVersion(pid,vid,btn){const p=DB.teaching.plans.find(x=>x.id===pid),v=p?.versions.find(x=>x.id===vid);if(!v)return;if(btn){$$('.modal .tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}$('#planVersionBox').innerHTML=`<div class="field"><label>教案内容</label><textarea oninput="updatePlanVersion('${pid}','${vid}','content',this.value)">${esc(v.content)}</textarea></div><div class="field"><label>课后反思</label><textarea oninput="updatePlanVersion('${pid}','${vid}','reflection',this.value)">${esc(v.reflection||'')}</textarea></div><div class="file-zone"><div class="toolbar"><b>附件</b><span class="spacer"></span><label class="btn small">上传附件<input type="file" hidden accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" onchange="uploadPlanAttachment('${pid}','${vid}',this.files[0])"></label></div>${attachmentList(v.attachments,`deletePlanAttachment('${pid}','${vid}',{i})`)}</div>`}
function updatePlanVersion(pid,vid,key,val){const v=DB.teaching.plans.find(x=>x.id===pid)?.versions.find(x=>x.id===vid);if(v){v[key]=val;save(true)}}
function uploadPlanAttachment(pid,vid,file){readFile(file,['doc','docx','xls','xlsx','jpg','jpeg','png'],f=>{const v=DB.teaching.plans.find(x=>x.id===pid).versions.find(x=>x.id===vid);v.attachments.push(f);save(true);showPlanVersion(pid,vid);toast('附件已保存，本机立即可用并将自动同步云端')})}
function deletePlanAttachment(pid,vid,i){const v=DB.teaching.plans.find(x=>x.id===pid).versions.find(x=>x.id===vid);askConfirm('删除这个教案附件？',()=>{pushRecycle('attachment',v.attachments[i],{target:'plan',pid,vid});v.attachments.splice(i,1);save(true);showPlanVersion(pid,vid)})}
function newPlanVersion(pid){const p=DB.teaching.plans.find(x=>x.id===pid),base=p.versions[p.versions.length-1];modal('复制旧版新建版本',`<div class="field"><label>教案内容</label><textarea id="mContent">${esc(base.content)}</textarea></div><div class="field"><label>课后反思</label><textarea id="mReflection">${esc(base.reflection||'')}</textarea></div><div class="field"><label>可附加新文件</label><input id="mFile" type="file" accept=".doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitPlanVersion('${pid}')">新建版本</button>`)}
function commitPlanVersion(pid){const p=DB.teaching.plans.find(x=>x.id===pid),v={id:uid(),version:(p.versions.at(-1)?.version||0)+1,date:today(),content:$('#mContent').value,reflection:$('#mReflection').value,attachments:[]},file=$('#mFile').files[0];const done=()=>{p.versions.push(v);save(true);closeModal();renderTeaching();toast(`已新建v${v.version}`)};if(file)readFile(file,['doc','docx','xls','xlsx','jpg','jpeg','png'],f=>{v.attachments.push(f);done()});else done()}
function deletePlan(id){const i=DB.teaching.plans.findIndex(x=>x.id===id);askConfirm('删除整份教案及全部版本？',()=>{pushRecycle('plan',DB.teaching.plans[i]);DB.teaching.plans.splice(i,1);save(true);renderTeaching()})}
function renderCourseware(){const a=DB.teaching.courseware;$('#teachBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editCourseware()">新增索引</button></div>${a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>课件文件名</th><th>网盘 / 本地路径</th><th>备注</th><th>操作</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.path)}</td><td>${esc(x.note||'')}</td><td><button class="btn small" onclick="editCourseware('${x.id}')">编辑</button> <button class="btn small red" onclick="deleteCourseware('${x.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>`:empty()}`}
function editCourseware(id=''){const x=DB.teaching.courseware.find(x=>x.id===id);modal(x?'编辑课件索引':'新增课件索引',`<div class="field"><label>文件名</label><input id="mName" value="${esc(x?.name||'')}"></div><div class="field"><label>网盘 / 本地路径</label><input id="mPath" value="${esc(x?.path||'')}"></div><div class="field"><label>备注</label><textarea id="mNote">${esc(x?.note||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitCourseware('${id}')">保存</button>`)}
function commitCourseware(id){const obj={id:id||uid(),name:$('#mName').value.trim(),path:$('#mPath').value.trim(),note:$('#mNote').value.trim()};if(!obj.name)return toast('请填写文件名');const i=DB.teaching.courseware.findIndex(x=>x.id===id);if(i>=0)DB.teaching.courseware[i]=obj;else DB.teaching.courseware.push(obj);save(true);closeModal();renderTeaching()}
function deleteCourseware(id){const a=DB.teaching.courseware,i=a.findIndex(x=>x.id===id);askConfirm('删除这个课件索引？',()=>{pushRecycle('courseware',a[i]);a.splice(i,1);save(true);renderTeaching()})}
function renderPBL(){const a=DB.teaching.pbl;$('#teachBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editPBL()">新增PBL项目</button></div>${a.length?a.map(x=>`<div class="card" style="margin-bottom:12px"><div class="toolbar"><h3 style="margin:0">${esc(x.title)}</h3><span class="spacer"></span><button class="btn small" onclick="editPBL('${x.id}')">编辑</button><button class="btn small red" onclick="deletePBL('${x.id}')">删除</button></div><div class="grid two"><div><b>阶段任务</b><div class="note" style="white-space:pre-wrap;margin-top:8px">${esc(x.stages)}</div></div><div><b>学生分组进展</b><div class="note" style="white-space:pre-wrap;margin-top:8px">${esc(x.progress)}</div></div></div></div>`).join(''):empty()}`}
function editPBL(id=''){const x=DB.teaching.pbl.find(x=>x.id===id);modal(x?'编辑PBL项目':'新增PBL项目',`<div class="field"><label>项目主题</label><input id="mTitle" value="${esc(x?.title||'')}"></div><div class="field"><label>阶段任务</label><textarea id="mStages">${esc(x?.stages||'')}</textarea></div><div class="field"><label>学生分组进展</label><textarea id="mProgress">${esc(x?.progress||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitPBL('${id}')">保存</button>`)}
function commitPBL(id){const obj={id:id||uid(),title:$('#mTitle').value.trim(),stages:$('#mStages').value.trim(),progress:$('#mProgress').value.trim()};if(!obj.title)return toast('请填写主题');const i=DB.teaching.pbl.findIndex(x=>x.id===id);if(i>=0)DB.teaching.pbl[i]=obj;else DB.teaching.pbl.push(obj);save(true);closeModal();renderTeaching()}
function deletePBL(id){const a=DB.teaching.pbl,i=a.findIndex(x=>x.id===id);askConfirm('删除这个PBL项目？',()=>{pushRecycle('pbl',a[i]);a.splice(i,1);save(true);renderTeaching()})}
function renderTopic(){$('#teachBody').innerHTML=`<div class="field"><label>美术项目课题</label><textarea style="min-height:320px" oninput="DB.teaching.topic=this.value;save(true)" placeholder="记录课题研究内容，输入即自动保存……">${esc(DB.teaching.topic||'')}</textarea></div><p class="subtle">无需保存按钮，内容会自动写入本机缓存，并在联网登录后同步到云端。</p>`}
function renderPapers(){const a=DB.teaching.papers;$('#teachBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editPaper()">新增论文</button></div>${a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>题目</th><th>刊物 / 场合</th><th>年份</th><th>备注</th><th>操作</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.journal||'')}</td><td>${esc(x.year||'')}</td><td>${esc(x.note||'')}</td><td><button class="btn small" onclick="editPaper('${x.id}')">编辑</button> <button class="btn small red" onclick="deletePaper('${x.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>`:empty()}`}
function editPaper(id=''){const x=DB.teaching.papers.find(x=>x.id===id);modal(x?'编辑论文':'新增论文',`<div class="field"><label>论文题目</label><input id="mTitle" value="${esc(x?.title||'')}"></div><div class="grid two"><div class="field"><label>刊物 / 场合</label><input id="mJournal" value="${esc(x?.journal||'')}"></div><div class="field"><label>年份</label><input id="mYear" value="${esc(x?.year||new Date().getFullYear())}"></div></div><div class="field"><label>备注</label><textarea id="mNote">${esc(x?.note||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitPaper('${id}')">保存</button>`)}
function commitPaper(id){const obj={id:id||uid(),title:$('#mTitle').value.trim(),journal:$('#mJournal').value.trim(),year:$('#mYear').value.trim(),note:$('#mNote').value.trim()};if(!obj.title)return toast('请填写题目');const i=DB.teaching.papers.findIndex(x=>x.id===id);if(i>=0)DB.teaching.papers[i]=obj;else DB.teaching.papers.push(obj);save(true);closeModal();renderTeaching()}
function deletePaper(id){const a=DB.teaching.papers,i=a.findIndex(x=>x.id===id);askConfirm('删除这条论文记录？',()=>{pushRecycle('paper',a[i]);a.splice(i,1);save(true);renderTeaching()})}
function renderAwards(){const a=DB.teaching.awards;$('#teachBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editAward()">新增获奖记录</button></div>${a.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>获奖名称</th><th>级别</th><th>备注</th><th>操作</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.level)}</td><td>${esc(x.note||'')}</td><td><button class="btn small" onclick="editAward('${x.id}')">编辑</button> <button class="btn small red" onclick="deleteAward('${x.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>`:empty()}`}
function editAward(id=''){const x=DB.teaching.awards.find(x=>x.id===id);modal(x?'编辑获奖记录':'新增获奖记录',`<div class="grid two"><div class="field"><label>时间</label><input id="mDate" type="date" value="${esc(x?.date||today())}"></div><div class="field"><label>级别</label><input id="mLevel" value="${esc(x?.level||'校级')}"></div></div><div class="field"><label>获奖名称</label><input id="mName" value="${esc(x?.name||'')}"></div><div class="field"><label>备注</label><textarea id="mNote">${esc(x?.note||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitAward('${id}')">保存</button>`)}
function commitAward(id){const obj={id:id||uid(),date:$('#mDate').value,name:$('#mName').value.trim(),level:$('#mLevel').value.trim(),note:$('#mNote').value.trim()};if(!obj.name)return toast('请填写获奖名称');const i=DB.teaching.awards.findIndex(x=>x.id===id);if(i>=0)DB.teaching.awards[i]=obj;else DB.teaching.awards.push(obj);save(true);closeModal();renderTeaching()}
function deleteAward(id){const a=DB.teaching.awards,i=a.findIndex(x=>x.id===id);askConfirm('删除这条获奖记录？',()=>{pushRecycle('award',a[i]);a.splice(i,1);save(true);renderTeaching()})}

function renderClubs(){if(S.clubId&&DB.clubs.some(c=>c.id===S.clubId)){renderClubDetail();return}S.clubId=null;$('#content').innerHTML=pageHead('校本社团','自定义多社团课程；各社团数据完全隔离',`<button class="btn primary" onclick="editClub()">新增社团课程</button>`)+`${DB.clubs.length?`<div class="club-cards">${DB.clubs.map(c=>`<div class="card club-card" onclick="S.clubId='${c.id}';renderClubs()"><div><div class="club-mark">社</div><h3>${esc(c.name)}</h3><p class="subtle">${c.students.length}名学生 · 20周社团课程</p></div><div class="mini-actions"><button class="btn small" onclick="event.stopPropagation();editClub('${c.id}')">编辑名称</button><button class="btn small red" onclick="event.stopPropagation();deleteClub('${c.id}')">删除</button></div></div>`).join('')}</div>`:empty('暂无社团课程，点击新增')}`}
function editClub(id=''){const c=DB.clubs.find(x=>x.id===id);modal(c?'编辑社团名称':'新增社团课程',`<div class="field"><label>课程名称</label><input id="mName" value="${esc(c?.name||'')}"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitClub('${id}')">保存</button>`)}
function commitClub(id){const name=$('#mName').value.trim();if(!name)return toast('请填写社团名称');if(id)DB.clubs.find(x=>x.id===id).name=name;else DB.clubs.push({id:uid(),name,students:[],plans:Array.from({length:20},(_,i)=>({week:i+1,text:'',attachments:[]})),materials:[],activities:[],inspirations:[]});save(true);closeModal();renderClubs()}
function deleteClub(id){const i=DB.clubs.findIndex(x=>x.id===id);askConfirm('删除整个社团及其独立数据？',()=>{pushRecycle('club',DB.clubs[i]);DB.clubs.splice(i,1);if(S.clubId===id)S.clubId=null;save(true);renderClubs()})}
function club(){return DB.clubs.find(x=>x.id===S.clubId)}
function renderClubDetail(){const c=club();const tabs=[['students','学生名单'],['plans','社团课程'],['activities','社团活动记录'],['ideas','社团活动灵感']];if(S.clubTab==='materials')S.clubTab='plans';$('#content').innerHTML=pageHead(c.name,'独立社团空间 · 数据与其他社团互不干扰',`<button class="btn" onclick="S.clubId=null;renderClubs()">返回社团列表</button>`)+`<div class="card"><div class="tabs">${tabs.map(t=>`<button class="tab ${S.clubTab===t[0]?'active':''}" onclick="S.clubTab='${t[0]}';renderClubDetail()">${t[1]}</button>`).join('')}</div><div id="clubBody"></div></div>`;({students:renderClubStudents,plans:renderClubPlans,activities:renderClubActivities,ideas:renderClubIdeas}[S.clubTab]||renderClubStudents)()}
function renderClubStudents(){const c=club();$('#clubBody').innerHTML=`<div class="toolbar"><button class="btn primary" onclick="editClubStudent()">新增学生</button><button class="btn" onclick="importClubStudents()">Excel复制粘贴导入</button><button class="btn" onclick="exportClubStudents()">完整导出CSV</button></div>${c.students.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>特长标签</th><th>备注</th><th>美术课对应</th><th>操作</th></tr></thead><tbody>${c.students.map((s,i)=>{const m=artStudentMatchForClubStudent(s);return`<tr><td>${i+1}</td><td>${esc(privacyName(s.name,i))}</td><td>${esc(s.className||'')}</td><td>${(s.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')||'—'}</td><td>${esc(s.note||'')}</td><td>${m?`<span class="pill">已关联 ${esc(m.className)}</span>`:'<span class="subtle">未关联</span>'}</td><td><button class="btn small" onclick="editClubStudent('${s.id}')">编辑</button> <button class="btn small red" onclick="deleteClubStudent('${s.id}')">删除</button></td></tr>`}).join('')}</tbody></table></div>`:empty('暂无数据，点击添加')}`}
function exportClubStudents(){const c=club(),rows=[['所属社团','姓名','班级','社团特长标签','社团备注','美术课社团活动标签','美术特长标签','美术历次评语','特长学生','特殊学生','课堂作品简要信息']];c.students.forEach(s=>{const m=artStudentMatchForClubStudent(s),a=m?.student;rows.push([c.name,s.name,s.className,(s.tags||[]).join('；'),s.note||'',a?studentClubTags(a,m.classId).join('；'):'',a?(a.tags||[]).join('；'):'',a?.comments||'',a?.featured?'是':'否',a?.special?'是':'否',a?.artwork||''])});csvDownload(`${c.name}-学生名单完整导出.csv`,rows)}
function editClubStudent(id=''){const s=club().students.find(x=>x.id===id);modal(s?'编辑社团学生':'新增社团学生',`<div class="field"><label>姓名</label><input id="mName" value="${esc(s?.name||'')}"></div><div class="field"><label>班级</label><input id="mClass" value="${esc(s?.className||'')}"></div><div class="field"><label>特长标签（逗号分隔）</label><input id="mTags" value="${esc((s?.tags||[]).join(','))}"></div><div class="field"><label>备注</label><input id="mNote" value="${esc(s?.note||'')}"></div>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitClubStudent('${id}')">保存</button>`)}
function commitClubStudent(id){const c=club(),obj={id:id||uid(),name:$('#mName').value.trim(),className:$('#mClass').value.trim(),tags:$('#mTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),note:$('#mNote').value.trim()};if(!obj.name)return toast('请填写姓名');const i=c.students.findIndex(x=>x.id===id);if(i>=0)c.students[i]=obj;else c.students.push(obj);save(true);closeModal();renderClubDetail()}
function deleteClubStudent(id){const c=club(),i=c.students.findIndex(x=>x.id===id);askConfirm('删除这名社团学生？',()=>{pushRecycle('clubStudent',c.students[i],{clubId:c.id});c.students.splice(i,1);save(true);renderClubDetail()})}
function importClubStudents(){modal('批量导入社团名单',`<p class="subtle">从Excel复制“姓名、班级、特长标签、备注”四列粘贴。</p><textarea id="mPaste" style="min-height:220px"></textarea>`,`<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="commitClubImport()">导入</button>`)}
function commitClubImport(){let rows=$('#mPaste').value.trim().split(/\r?\n/).map(r=>r.includes('\t')?r.split('\t'):r.split(/[,，]/));if(/姓名/.test(rows[0]?.[0]||''))rows.shift();let n=0;rows.forEach(r=>{if((r[0]||'').trim()){club().students.push({id:uid(),name:r[0].trim(),className:(r[1]||'').trim(),tags:(r[2]||'').split(/[,，;；]/).map(x=>x.trim()).filter(Boolean),note:(r[3]||'').trim()});n++}});save(true);closeModal();renderClubDetail();toast(`已导入 ${n} 名学生`)}

function renderClubPlans(){const c=club();$('#clubBody').innerHTML=`<div class="grid two">${c.plans.map(p=>`<div class="card"><div class="toolbar"><b>第${p.week}周</b><span class="spacer"></span><button class="btn small" onclick="editClubPlan(${p.week})">编辑</button></div><div class="subtle">${esc(p.text||'尚未填写教学方案')}</div><div class="subtle" style="margin-top:7px">附件 ${p.attachments.length} 个</div></div>`).join('')}</div>`}

function summaryInRange(date,start,end){return !!date&&date>=start&&date<=end}
function summaryAddDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return isoDate(d)}
function academicStartYear(){const d=new Date((DB.settings.semesterStart||today())+'T00:00:00');return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1}
function semesterSummaryLabel(){const d=new Date((DB.settings.semesterStart||today())+'T00:00:00'),y=academicStartYear();return `${y}—${y+1}学年度${d.getMonth()>=6?'第一':'第二'}学期`}
function summaryTypeLabel(t){return ({week:'周总结',month:'月总结',semester:'学期总结',year:'学年度总结'})[t]||'工作总结'}
function summaryRange(){
  if(!S.summaryMonth)S.summaryMonth=today().slice(0,7);if(!S.summarySchoolYear)S.summarySchoolYear=String(academicStartYear());if(!S.summaryWeek)S.summaryWeek=getWeek();
  if(S.summaryTab==='week'){const w=Math.max(1,Math.min(20,+S.summaryWeek||getWeek())),start=dateForWeekDay(w,0);return {start,end:dateForWeekDay(w,6),label:`第${w}周`,selection:String(w)}}
  if(S.summaryTab==='month'){const [y,m]=S.summaryMonth.split('-').map(Number),start=`${y}-${pad(m)}-01`,end=isoDate(new Date(y,m,0));return {start,end,label:`${y}年${m}月`,selection:S.summaryMonth}}
  if(S.summaryTab==='semester')return {start:DB.settings.semesterStart,end:DB.settings.semesterEnd,label:semesterSummaryLabel(),selection:semesterSummaryLabel()};
  const y=+S.summarySchoolYear||academicStartYear();return {start:`${y}-09-01`,end:`${y+1}-08-31`,label:`${y}—${y+1}学年度`,selection:String(y)}
}
